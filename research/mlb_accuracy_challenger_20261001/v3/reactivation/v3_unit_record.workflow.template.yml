# MLB V3 prospective unit -- record, store the tape as a TEMPORARY Actions artifact, prove it, seal, verify.
#
# TEMPLATE (FC-MLB-001B reactivation package). Placeholders (at-at-NAME-at-at) are bound ONLY by
# reactivation/prepare_activation.py; the bound file is committed as .github/workflows/v3-unit-record.yml on the
# request branch by Claude after Jacob's go (step 5). An unbound copy refuses to run (first step).
#
# Storage (Jacob, 2026-10-06): GitHub Actions artifacts are the TEMPORARY authoritative tape store; NOT archival.
#   * the tape is uploaded as ONE artifact named v3-tape-<sha256> (compression 0, retention @@ARTIFACT_RETENTION_DAYS@@ days);
#   * BEFORE the seal is published, artifact_api.confirm_upload downloads it again by exact identity (run + sha-bound
#     name + artifact id + GitHub zip digest) and re-hashes the tape: size/sha mismatch, missing, expired -> MISS UNIT;
#   * the proof (tape_artifact.json: artifact id, created_at, expires_at, retention) is a sealed unit file;
#   * job verify-b replays the sealed unit on a FRESH runner from the exact artifact (no runner-local cache,
#     no fallback source); retention_monitor.py reports days remaining; migration to R2 is milestone FC-MLB-001C.
#
# Trigger: the dispatcher pushes requests/<unit>.json to the request branch. Never runs on a schedule by itself.
name: V3 prospective unit (record + seal + verify)

on:
  push:
    branches: ['@@REQUEST_BRANCH@@']
    paths: ['requests/*.json']

permissions:
  contents: write      # append-only push of the sealed unit to the evidence ref
  issues: write        # the #91 seal receipt comment
  actions: read        # read back the uploaded artifact (confirm_upload / verify-b)

concurrency:
  group: v3-unit-record
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

env:
  AUTH_COMMIT: '@@IMPLEMENTATION_COMMIT@@'
  AUTH_TREE: '@@IMPLEMENTATION_TREE@@'
  PREREG_BLOB: 71e7d2828df20a01f476376efcc0c651828dcaf2
  SHADOW_PIN: 7d3ebacd55c34c6ec78030bdeca70799e56d4764
  EVIDENCE_REF: claude/mlb-challenger-v3-evidence
  ACTIVATION_ON_EVIDENCE: 'ACTIVATION/ACTIVATION_@@JACOB_COMMENT_ID@@.json'
  ACTIVATION_SHA256: '@@ACTIVATION_SHA256@@'
  RETENTION_DAYS: '@@ARTIFACT_RETENTION_DAYS@@'
  V3: research/mlb_accuracy_challenger_20261001/v3
  PYTHONUNBUFFERED: '1'

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    outputs:
      unit: ${{ steps.req.outputs.unit }}
      staged: ${{ steps.stage.outputs.staged }}
      sealed: ${{ steps.publish.outputs.sealed }}
    steps:
      - name: Refuse an unbound template
        run: |
          case "$AUTH_COMMIT$AUTH_TREE$ACTIVATION_SHA256$RETENTION_DAYS" in *@@*) echo "::error::UNBOUND TEMPLATE"; exit 1;; esac
      - name: Checkout the request branch (requests only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 2
          path: req
      - name: The request (exactly one new request file; today's ET slate)
        id: req
        run: |
          set -euo pipefail
          f=$(git -C req diff --name-only --diff-filter=A HEAD~1 HEAD -- 'requests/*.json')
          test "$(printf '%s\n' "$f" | grep -c .)" -eq 1 || { echo "::error::need exactly one new request"; exit 1; }
          python3 - "req/$f" >> "$GITHUB_OUTPUT" <<'PY'
          import datetime, json, sys, zoneinfo
          r = json.load(open(sys.argv[1]))
          today = datetime.datetime.now(zoneinfo.ZoneInfo("America/New_York")).date().isoformat()
          if r.get("date") != today or r.get("window") not in ("DAY", "NIGHT") or r.get("impl") != __import__("os").environ["AUTH_COMMIT"]:
              raise SystemExit(f"request {r} is not for today's slate / the activated commit; refusing")
          print(f"date={r['date']}\nwindow={r['window']}\nunit={r['date']}_{r['window']}")
          PY
      - name: Exact activated implementation (commit + v3 tree + prereg blob) and the persisted activation record
        run: |
          set -euo pipefail
          git init -q impl && cd impl
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git fetch -q --no-tags --depth 1 origin "$AUTH_COMMIT" "$SHADOW_PIN" "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$EVIDENCE_REF:refs/remotes/origin/$EVIDENCE_REF"
          git checkout -q --detach "$AUTH_COMMIT"
          test "$(git rev-parse HEAD):$(git rev-parse "HEAD:$V3"):$(git rev-parse HEAD:research/mlb_accuracy_challenger_prereg_v3_20261001.md)" \
            = "$AUTH_COMMIT:$AUTH_TREE:$PREREG_BLOB" || { echo "::error::IDENTITY MISMATCH"; exit 1; }
          git show "origin/$EVIDENCE_REF:$ACTIVATION_ON_EVIDENCE" > "$V3/ACTIVATION.json"
          echo "$ACTIVATION_SHA256  $V3/ACTIVATION.json" | sha256sum -c -
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Host Python 3.11 (launcher only)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
      - name: Host tools, hash-locked launcher packages, pinned runtime image (by digest)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq strace
          grep -E '^(requests|urllib3|idna|certifi|charset-normalizer)==' "impl/$V3/shadow-requirements.lock" > "$RUNNER_TEMP/launcher.lock"
          python3 -m pip install -q --no-deps --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/launcher.lock"
          sudo -E env "PATH=$PATH" python3 "impl/$V3/runtime_image.py" "$RUNNER_TEMP/v3b_runtime"
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/stage"
      - name: Record + stage (runner --phase stage; no seal yet)
        id: stage
        run: |
          set -euo pipefail
          rc=0
          sudo -E env "PATH=$PATH" MLB_V3_ACTIVATION=JACOB_AUTHORIZED V3B_RUNTIME_CACHE="$RUNNER_TEMP/v3b_runtime" \
            V3B_TAPE_STORE=actions-artifact V3B_ARTIFACT_STAGE_DIR="$RUNNER_TEMP/stage" \
            V3B_ARTIFACT_RETENTION_DAYS="$RETENTION_DAYS" GITHUB_TOKEN="$GH_TOKEN" \
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0='*' \
            python3 "impl/$V3/runner.py" --mode prospective --phase stage --repo "$GITHUB_WORKSPACE/impl" \
            --date "${{ steps.req.outputs.date }}" --window "${{ steps.req.outputs.window }}" --out "$RUNNER_TEMP/unit" \
            > "$RUNNER_TEMP/out/stage.log" 2>&1 || rc=$?
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/unit" "$RUNNER_TEMP/stage" "$RUNNER_TEMP/out" 2>/dev/null || true
          tail -c 20000 "$RUNNER_TEMP/out/stage.log"
          if [ "$rc" -eq 0 ] && [ -f "$RUNNER_TEMP/unit/STAGED.json" ]; then
            n=$(python3 -c 'import json,sys; l=json.load(open(sys.argv[1])); assert l["artifact_name"]=="v3-tape-"+l["sha256"]; print(l["artifact_name"])' "$RUNNER_TEMP/unit/TAPE_LOCATOR.json")
            test "$(ls "$RUNNER_TEMP/stage")" = "fc-v3-tape-${n#v3-tape-}.json.gz"
            echo "tape_name=$n" >> "$GITHUB_OUTPUT"; echo "staged=true" >> "$GITHUB_OUTPUT";
          else echo "staged=false" >> "$GITHUB_OUTPUT"; echo "::warning title=V3 UNIT::not staged (rc $rc): MISS UNIT or NO_UNIT; no backfill"; fi
          test "$(ls "$RUNNER_TEMP/stage" | wc -l)" -le 1
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload the tape as ONE artifact named by its sha256 (TEMPORARY authoritative store)
        id: up
        if: steps.stage.outputs.staged == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ steps.stage.outputs.tape_name }}
          path: ${{ runner.temp }}/stage/
          retention-days: ${{ env.RETENTION_DAYS }}
          compression-level: 0
          if-no-files-found: error
      - name: Read back the uploaded artifact by exact identity (proof BEFORE sealing)
        if: steps.stage.outputs.staged == 'true'
        run: |
          set -euo pipefail
          python3 "impl/$V3/artifact_api.py" confirm --locator "$RUNNER_TEMP/unit/TAPE_LOCATOR.json" \
            --out "$RUNNER_TEMP/unit/tape_artifact.json"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["artifact_id"])' "$RUNNER_TEMP/unit/tape_artifact.json")" = "${{ steps.up.outputs.artifact-id }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish the seal (runner --phase publish; append-only; #91 receipt; TSA)
        id: publish
        if: steps.stage.outputs.staged == 'true'
        run: |
          set -euo pipefail
          rc=0
          sudo -E env "PATH=$PATH" MLB_V3_ACTIVATION=JACOB_AUTHORIZED GITHUB_TOKEN="$GH_TOKEN" \
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0='*' \
            python3 "impl/$V3/runner.py" --mode prospective --phase publish --repo "$GITHUB_WORKSPACE/impl" \
            --date "${{ steps.req.outputs.date }}" --window "${{ steps.req.outputs.window }}" --out "$RUNNER_TEMP/unit" \
            > "$RUNNER_TEMP/out/publish.log" 2>&1 || rc=$?
          tail -c 20000 "$RUNNER_TEMP/out/publish.log"
          if [ "$rc" -eq 0 ]; then echo "sealed=true" >> "$GITHUB_OUTPUT"; else echo "::error title=V3 UNIT::publish rc $rc (MISS UNIT or late)"; exit "$rc"; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Unit log (artifact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: v3-unit-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/out/
            ${{ runner.temp }}/unit/*.json
          retention-days: ${{ env.RETENTION_DAYS }}

  verify-b:
    # A FRESH runner: fetch the sealed unit from the evidence ref and the tape from the EXACT artifact, then the
    # full verify_evidence.verify_unit (identities, receipts, sandboxed no-network replay, literal payload bytes).
    needs: record
    if: needs.record.outputs.sealed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Exact implementation + evidence ref
        run: |
          set -euo pipefail
          git init -q impl && cd impl
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git fetch -q --no-tags --depth 1 origin "$AUTH_COMMIT" "$SHADOW_PIN" "+refs/heads/$EVIDENCE_REF:refs/remotes/origin/$EVIDENCE_REF"
          git checkout -q --detach "$AUTH_COMMIT"
          test "$(git rev-parse "HEAD:$V3")" = "$AUTH_TREE"
          git worktree add -q --detach "$RUNNER_TEMP/ev" "origin/$EVIDENCE_REF"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
      - name: Host tools + pinned runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq strace
          grep -E '^(requests|urllib3|idna|certifi|charset-normalizer)==' "impl/$V3/shadow-requirements.lock" > "$RUNNER_TEMP/launcher.lock"
          python3 -m pip install -q --no-deps --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/launcher.lock"
          sudo -E env "PATH=$PATH" python3 "impl/$V3/runtime_image.py" "$RUNNER_TEMP/v3b_runtime"
      - name: Fetch the sealed tape from the exact artifact (hash-verified; no fallback)
        run: |
          set -euo pipefail
          u="${{ needs.record.outputs.unit }}"
          python3 - "$RUNNER_TEMP/ev/seals/$u" > "$RUNNER_TEMP/locator.json" <<'PY'
          import gzip, json, os, sys
          d = sys.argv[1]
          loc = json.load(gzip.open(os.path.join(d, "manifest.json.gz")))["shadow_provenance"]["tape_store"]
          proof = json.load(open(os.path.join(d, "tape_artifact.json")))
          print(json.dumps(dict(loc, artifact_id=proof["artifact_id"])))
          PY
          python3 "impl/$V3/artifact_api.py" fetch --locator "$RUNNER_TEMP/locator.json" --dest "$RUNNER_TEMP/tape_dl"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: verify_unit (fresh environment B)
        run: |
          set -euo pipefail
          sudo -E env "PATH=$PATH" V3B_RUNTIME_CACHE="$RUNNER_TEMP/v3b_runtime" V3B_ARTIFACT_DOWNLOAD_DIR="$RUNNER_TEMP/tape_dl" \
            V3B_VERIFY_TAPE_SOURCE=sealed GITHUB_TOKEN="$GH_TOKEN" \
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0='*' \
            python3 - "impl/$V3" "$RUNNER_TEMP/ev" "${{ needs.record.outputs.unit }}" <<'PY'
          import json, sys
          sys.path.insert(0, sys.argv[1])
          import verify_evidence as VE
          seal = next(s for s in VE.load_chain(sys.argv[2]) if f"{s['date']}_{s['window']}" == sys.argv[3])
          st, detail, _ = VE.verify_unit(sys.argv[2], seal)
          print(f"::notice title=V3 VERIFY-B::{sys.argv[3]} {seal['seal_sha256']} {st}")
          print(json.dumps({"unit": sys.argv[3], "status": st, "detail": detail}, default=str)[:20000])
          sys.exit(0 if st == "VERIFIED" else 1)
          PY
          python3 "impl/$V3/retention_monitor.py" --evidence-root "$RUNNER_TEMP/ev" --live || rc=$?
          if [ "${rc:-0}" -ge 20 ]; then exit "$rc"; fi
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
