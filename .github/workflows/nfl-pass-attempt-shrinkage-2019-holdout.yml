name: NFL Pass Attempt Shrinkage 2019 Holdout

# ONE-SHOT untouched historical holdout.
#
# Frozen before performance:
#   history-only source: 2018 SHA256
#     d2df3adf2fbadfb597bc334807f5020aefe2b2ae13d28155f7f01cb981f00555
#   untouched test source: 2019 SHA256
#     d3311b008de52dd95729d76d225b45f51eb91932e8fa3c38c18548397aa00a06
#
# Frozen challenger:
#   B0 = mean official attempts over team prior up-to-5 REG games, min 3
#   L  = strictly-prior league-wide REG team-game attempt mean
#   B_SHRINK50 = 0.50*B0 + 0.50*L
#
# Frozen promotion-to-next-stage gate:
#   1) holdout MAE delta (challenger - B0) < 0
#   2) team-cluster bootstrap 95% CI upper bound for delta < 0
#
# Failure means reject this frozen challenger. Do not tune weight on 2019.
on:
  push:
    branches:
      - superchad/nfl-foundation-continuation-20260911
    paths:
      - .github/workflows/nfl-pass-attempt-shrinkage-2019-holdout.yml

permissions:
  contents: read

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install 'requests~=2.34.2'

      - name: Run frozen 2019 holdout exactly once
        env:
          FULL_COUNT_CODE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import csv
          import hashlib
          import io
          import json
          import math
          import os
          import random
          import statistics
          from collections import defaultdict, deque
          from datetime import datetime, timezone

          import requests

          HISTORY_SEASON = 2018
          HOLDOUT_SEASON = 2019
          WINDOW = 5
          MIN_HISTORY = 3
          WEIGHT = 0.50
          BOOTSTRAPS = 10000
          SEED = 20260911

          EXPECTED_SHA = {
              2018: "d2df3adf2fbadfb597bc334807f5020aefe2b2ae13d28155f7f01cb981f00555",
              2019: "d3311b008de52dd95729d76d225b45f51eb91932e8fa3c38c18548397aa00a06",
          }
          REQUIRED = {"season", "week", "season_type", "team", "attempts"}

          def pct(values, q):
              values = sorted(values)
              pos = (len(values)-1)*q
              lo = int(math.floor(pos))
              hi = int(math.ceil(pos))
              if lo == hi:
                  return values[lo]
              w = pos-lo
              return values[lo]*(1-w)+values[hi]*w

          def mae(rows, field):
              return statistics.fmean(
                  abs(r[field]-r["actual"]) for r in rows
              )

          session = requests.Session()
          session.headers.update({
              "User-Agent":
                  "Full-Count NFL frozen pass-attempt holdout"
          })

          raw = []
          sources = {}
          for season in (HISTORY_SEASON, HOLDOUT_SEASON):
              url = (
                  "https://github.com/nflverse/nflverse-data/releases/download/"
                  f"stats_team/stats_team_week_{season}.csv"
              )
              resp = session.get(url, timeout=60)
              resp.raise_for_status()
              digest = hashlib.sha256(resp.content).hexdigest()
              if digest != EXPECTED_SHA[season]:
                  raise SystemExit(
                      f"{season}: source drift {digest} != "
                      f"{EXPECTED_SHA[season]}"
                  )

              rows = list(csv.DictReader(io.StringIO(resp.text)))
              if not rows:
                  raise SystemExit(f"{season}: empty source")
              missing = sorted(REQUIRED-set(rows[0]))
              if missing:
                  raise SystemExit(f"{season}: schema drift {missing}")

              seen = set()
              reg_n = 0
              for r in rows:
                  if str(r["season_type"]) != "REG":
                      continue
                  s = int(float(r["season"]))
                  w = int(float(r["week"]))
                  team = str(r["team"]).strip()
                  attempts = float(r["attempts"])
                  if s != season or not team or not math.isfinite(attempts):
                      raise SystemExit(
                          f"{season}: invalid row identity/value"
                      )
                  key = (s,w,team)
                  if key in seen:
                      raise SystemExit(
                          f"{season}: duplicate REG team-week {key}"
                      )
                  seen.add(key)
                  reg_n += 1
                  raw.append({
                      "season":s,
                      "week":w,
                      "team":team,
                      "attempts":attempts,
                  })

              sources[str(season)] = {
                  "url":url,
                  "sha256":digest,
                  "bytes":len(resp.content),
                  "regular_rows":reg_n,
              }

          raw.sort(key=lambda r:(r["season"],r["week"],r["team"]))
          week_rows = defaultdict(list)
          for r in raw:
              week_rows[(r["season"],r["week"])].append(r)

          weeks = sorted(week_rows)
          league_history = []
          prior_league = {}
          for sw in weeks:
              prior_league[sw] = (
                  statistics.fmean(r["attempts"] for r in league_history)
                  if league_history else None
              )
              league_history.extend(week_rows[sw])

          team_history = defaultdict(lambda:deque(maxlen=WINDOW))
          scored = []
          for sw in weeks:
              season, week = sw
              league_mean = prior_league[sw]

              for r in sorted(week_rows[sw],key=lambda x:x["team"]):
                  h = team_history[r["team"]]
                  if (
                      season == HOLDOUT_SEASON
                      and len(h) >= MIN_HISTORY
                      and league_mean is not None
                  ):
                      b0 = statistics.fmean(h)
                      challenger = (
                          (1.0-WEIGHT)*b0 + WEIGHT*league_mean
                      )
                      scored.append({
                          "season":season,
                          "week":week,
                          "team":r["team"],
                          "actual":r["attempts"],
                          "b0":b0,
                          "challenger":challenger,
                          "league_prior_mean":league_mean,
                          "b0_abs_error":abs(b0-r["attempts"]),
                          "challenger_abs_error":
                              abs(challenger-r["attempts"]),
                      })

              for r in week_rows[sw]:
                  team_history[r["team"]].append(r["attempts"])

          if not scored:
              raise SystemExit("no 2019 holdout rows")

          b0_mae = mae(scored,"b0")
          challenger_mae = mae(scored,"challenger")
          delta = challenger_mae-b0_mae

          groups = defaultdict(list)
          for r in scored:
              groups[r["team"]].append(r)
          teams = sorted(groups)
          if len(teams) != 32:
              raise SystemExit(
                  f"expected 32 team clusters, got {len(teams)}"
              )

          rng = random.Random(SEED)
          deltas = []
          for _ in range(BOOTSTRAPS):
              sample = []
              for _ in teams:
                  sample.extend(groups[rng.choice(teams)])
              deltas.append(
                  mae(sample,"challenger")-mae(sample,"b0")
              )

          ci = [pct(deltas,0.025), pct(deltas,0.975)]
          p_below = sum(v<0 for v in deltas)/len(deltas)
          gate_pass = delta < 0 and ci[1] < 0

          # Secondary diagnostics only; never used to rescue/fail the gate.
          by_half = {}
          weeks_seen = sorted({r["week"] for r in scored})
          split = statistics.median(weeks_seen)
          for label,subset in (
              ("early",[r for r in scored if r["week"] <= split]),
              ("late",[r for r in scored if r["week"] > split]),
          ):
              by_half[label] = {
                  "n":len(subset),
                  "b0_mae":mae(subset,"b0"),
                  "challenger_mae":mae(subset,"challenger"),
                  "delta_vs_b0":
                      mae(subset,"challenger")-mae(subset,"b0"),
              }

          output = {
              "analysis":"NFL_PASS_ATTEMPT_SHRINKAGE_2019_HOLDOUT",
              "status":"one_shot_untouched_holdout",
              "created_at":datetime.now(timezone.utc).isoformat(),
              "code_sha":os.environ["FULL_COUNT_CODE_SHA"],
              "frozen_design":{
                  "history_only_season":HISTORY_SEASON,
                  "holdout_season":HOLDOUT_SEASON,
                  "window":WINDOW,
                  "minimum_history":MIN_HISTORY,
                  "weight":WEIGHT,
                  "formula":
                      "0.50*B0 + 0.50*strictly_prior_league_mean",
                  "gate":
                      "delta_mae<0 AND team_cluster_ci95_upper<0",
                  "diagnostic_screen_run_id":34646476143,
                  "source_audit_run_id":34646640598,
              },
              "sources":sources,
              "result":{
                  "n":len(scored),
                  "teams":len(teams),
                  "b0_mae":b0_mae,
                  "challenger_mae":challenger_mae,
                  "delta_vs_b0":delta,
                  "relative_mae_change":
                      (challenger_mae/b0_mae)-1.0,
                  "team_cluster_bootstrap":{
                      "replicates":len(deltas),
                      "ci95":ci,
                      "median_delta":pct(deltas,0.5),
                      "probability_delta_below_zero":p_below,
                  },
                  "secondary_by_season_half":by_half,
              },
              "decision":{
                  "holdout_gate_pass":gate_pass,
                  "may_advance_to_prospective_architecture":gate_pass,
                  "weight_must_not_be_retuned_on_2019":True,
              },
              "next_if_pass":(
                  "Promote SHRINK50 only as the team pass-volume research "
                  "baseline; then integrate prospective QB identity/availability "
                  "before player-level pass-attempt distribution work."
              ),
              "next_if_fail":(
                  "Reject SHRINK50. Do not change the weight using 2019. "
                  "Move to prospective availability/opponent/game-state features."
              ),
          }

          path="/tmp/nfl-pass-attempt-shrinkage-2019-holdout.json"
          with open(path,"w",encoding="utf-8") as f:
              json.dump(output,f,indent=2,sort_keys=True)
          print(json.dumps(output,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: nfl-pass-attempt-shrinkage-2019-holdout
          path: /tmp/nfl-pass-attempt-shrinkage-2019-holdout.json
          retention-days: 30
