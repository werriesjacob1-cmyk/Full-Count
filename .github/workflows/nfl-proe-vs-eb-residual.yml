name: NFL PROE vs EB Residual Audit

# Research-only development audit.
#
# The empirical-Bayes team-attempt baseline passed its preregistered gate.
# This workflow asks whether prior-five team PROE adds stable next-game signal
# on the residual left by that frozen EB baseline.
#
# No coefficient is fit. No untouched challenger holdout is inspected.
on:
  push:
    branches:
      - superchad/nfl-foundation-continuation-20260911
    paths:
      - .github/workflows/nfl-proe-vs-eb-residual.yml
      - nfl/research/team_attempt_eb.py

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install 'requests~=2.34.2'

      - name: Test prior PROE against EB attempt residual
        env:
          FULL_COUNT_CODE_SHA: ${{ github.sha }}
        run: |
          PYTHONPATH=. python3 - <<'PY'
          import csv
          import gzip
          import hashlib
          import io
          import json
          import math
          import os
          import random
          import statistics
          from collections import defaultdict, deque
          from datetime import datetime, timezone

          import requests

          from nfl.research import team_attempt_eb as eb

          SEASONS=(2022,2023,2024,2025)
          TEST_SEASONS=(2023,2024,2025)
          ATTEMPT_WINDOW=10
          PROE_WINDOW=5
          MIN_HYPER_TEAMS=24
          BOOTSTRAPS=5000
          SEED=20260911
          EPS=1e-9

          PBP_SHA256={
              2022:"0c69a71eb39498956c7b1d5c1ca52ce7fe679934a95d1af249facb5ea9829ea4",
              2023:"4649804ee0f0a40b41e51ec75a1ce921949d7fab5459213488656b92f78560e8",
              2024:"23370d5d10f8104d80d46a1fc5e61f4f6f5a3263fe96fe2dd629913cfcb08c06",
              2025:"2f135887790a013fd004e609e37096bb4816d5cc80b9f19122e1bad478961978",
          }
          TEAM_SHA256={
              2022:"9803875bd0b74aa49230288d45359c75e45910f1cf1953ea0f07b9d3db35e4d1",
              2023:"dc5a387daabe8663deaddac492ad7020d47fb1a66048690b355b406cd8e4c454",
              2024:"b207a1430c2715d03bbf1844c4eae98695f364851ff6025f422febc2c13f5255",
              2025:"91058a59d894855377b2f39f40c4e7bdbeef96d12144289dc68215209a1c93cb",
          }
          REQUIRED_PBP={
              "season","week","season_type","posteam","pass","rush",
              "xpass","pass_oe","sack","pass_attempt","two_point_attempt",
          }
          REQUIRED_TEAM={
              "season","week","season_type","team","attempts",
          }

          def num(value,label):
              try:
                  out=float(value)
              except (TypeError,ValueError) as exc:
                  raise ValueError(f"invalid {label}: {value!r}") from exc
              if not math.isfinite(out):
                  raise ValueError(f"non-finite {label}: {value!r}")
              return out

          def flag0(value,label):
              if value in (None,""):
                  return 0
              out=num(value,label)
              if out not in (0.0,1.0):
                  raise ValueError(f"{label} outside 0/1: {out}")
              return int(out)

          def pearson(xs,ys):
              if len(xs)<3:
                  return None
              mx=statistics.fmean(xs)
              my=statistics.fmean(ys)
              dx=[x-mx for x in xs]
              dy=[y-my for y in ys]
              den=math.sqrt(
                  sum(x*x for x in dx)*sum(y*y for y in dy)
              )
              if den<=0:
                  return None
              return sum(x*y for x,y in zip(dx,dy))/den

          def pct(values,q):
              values=sorted(values)
              pos=(len(values)-1)*q
              lo=int(math.floor(pos))
              hi=int(math.ceil(pos))
              if lo==hi:
                  return values[lo]
              w=pos-lo
              return values[lo]*(1-w)+values[hi]*w

          def cluster_bootstrap(rows,seed_offset):
              groups=defaultdict(list)
              for row in rows:
                  groups[row["team"]].append(row)
              teams=sorted(groups)
              rng=random.Random(SEED+seed_offset)
              vals=[]
              for _ in range(BOOTSTRAPS):
                  sample=[]
                  for _ in teams:
                      sample.extend(groups[rng.choice(teams)])
                  r=pearson(
                      [x["prior_proe"] for x in sample],
                      [x["eb_residual"] for x in sample],
                  )
                  if r is not None and math.isfinite(r):
                      vals.append(r)
              return {
                  "clusters":len(teams),
                  "replicates":len(vals),
                  "median":pct(vals,0.5),
                  "ci95":[pct(vals,0.025),pct(vals,0.975)],
                  "probability_above_zero":
                      sum(v>0 for v in vals)/len(vals),
              }

          def quartiles(rows):
              ordered=sorted(rows,key=lambda r:r["prior_proe"])
              n=len(ordered)
              out=[]
              for q in range(4):
                  sub=ordered[(q*n)//4:((q+1)*n)//4]
                  out.append({
                      "quartile":q+1,
                      "n":len(sub),
                      "mean_prior_proe":
                          statistics.fmean(r["prior_proe"] for r in sub),
                      "mean_eb_residual":
                          statistics.fmean(r["eb_residual"] for r in sub),
                  })
              return out

          session=requests.Session()
          session.headers.update({
              "User-Agent":"Full-Count NFL PROE versus EB residual audit"
          })

          # Build official attempts + per-team-game PROE substrate.
          game=defaultdict(lambda:{
              "decision_plays":0,
              "pass_oe_sum":0.0,
              "sacks":0,
              "parsed_pass_attempts":0,
          })
          sources={"pbp":{},"team":{}}

          for season in SEASONS:
              purl=(
                  "https://github.com/nflverse/nflverse-data/releases/download/"
                  f"pbp/play_by_play_{season}.csv.gz"
              )
              pr=session.get(purl,timeout=120)
              pr.raise_for_status()
              psha=hashlib.sha256(pr.content).hexdigest()
              if psha!=PBP_SHA256[season]:
                  raise SystemExit(f"{season}: PBP SHA drift {psha}")
              rows_seen=0
              with gzip.GzipFile(fileobj=io.BytesIO(pr.content)) as gz:
                  reader=csv.DictReader(
                      io.TextIOWrapper(gz,encoding="utf-8",newline="")
                  )
                  missing=sorted(REQUIRED_PBP-set(reader.fieldnames or []))
                  if missing:
                      raise SystemExit(
                          f"{season}: PBP schema drift {missing}"
                      )
                  for row in reader:
                      rows_seen+=1
                      if str(row.get("season_type") or "")!="REG":
                          continue
                      team=str(row.get("posteam") or "").strip()
                      if not team:
                          continue
                      try:
                          week=int(float(row["week"]))
                      except (TypeError,ValueError):
                          continue
                      key=(season,week,team)
                      if flag0(
                          row.get("two_point_attempt"),
                          "two_point_attempt",
                      ):
                          continue
                      rec=game[key]
                      rec["sacks"]+=flag0(row.get("sack"),"sack")
                      rec["parsed_pass_attempts"]+=flag0(
                          row.get("pass_attempt"),"pass_attempt"
                      )

                      xraw=row.get("xpass")
                      praw=row.get("pass_oe")
                      if xraw in (None,"") or praw in (None,""):
                          continue
                      p=flag0(row.get("pass"),"pass")
                      rush=flag0(row.get("rush"),"rush")
                      if p+rush<1:
                          raise SystemExit(
                              f"{season}: pass_oe on non-decision play"
                          )
                      xpass=num(xraw,"xpass")
                      pass_oe=num(praw,"pass_oe")
                      if abs(pass_oe-100.0*(p-xpass))>1e-7:
                          raise SystemExit(
                              f"{season}: pass_oe identity drift"
                          )
                      rec["decision_plays"]+=1
                      rec["pass_oe_sum"]+=pass_oe

              sources["pbp"][str(season)]={
                  "url":purl,
                  "rows":rows_seen,
                  "bytes":len(pr.content),
                  "sha256":psha,
              }

              turl=(
                  "https://github.com/nflverse/nflverse-data/releases/download/"
                  f"stats_team/stats_team_week_{season}.csv"
              )
              tr=session.get(turl,timeout=60)
              tr.raise_for_status()
              tsha=hashlib.sha256(tr.content).hexdigest()
              if tsha!=TEAM_SHA256[season]:
                  raise SystemExit(f"{season}: team SHA drift {tsha}")
              trows=list(csv.DictReader(io.StringIO(tr.text)))
              missing=sorted(REQUIRED_TEAM-set(trows[0]))
              if missing:
                  raise SystemExit(
                      f"{season}: team schema drift {missing}"
                  )
              for raw in trows:
                  if str(raw.get("season_type") or "")!="REG":
                      continue
                  key=(
                      int(float(raw["season"])),
                      int(float(raw["week"])),
                      str(raw["team"]).strip(),
                  )
                  if key not in game:
                      raise SystemExit(
                          f"{season}: official team-game missing PBP {key}"
                      )
                  rec=game[key]
                  official=num(raw["attempts"],"official attempts")
                  parsed=rec["parsed_pass_attempts"]-rec["sacks"]
                  if abs(parsed-official)>EPS:
                      raise SystemExit(
                          f"{season}: attempt reconciliation failed {key}"
                      )
                  rec["official_attempts"]=official

              sources["team"][str(season)]={
                  "url":turl,
                  "rows":len(trows),
                  "bytes":len(tr.content),
                  "sha256":tsha,
              }

          normalized=[]
          for (season,week,team),rec in game.items():
              if "official_attempts" not in rec:
                  continue
              if rec["decision_plays"]<=0:
                  raise SystemExit(
                      f"no PROE plays {(season,week,team)}"
                  )
              normalized.append({
                  "season":season,
                  "week":week,
                  "team":team,
                  "attempts":float(rec["official_attempts"]),
                  "decision_plays":float(rec["decision_plays"]),
                  "proe":rec["pass_oe_sum"]/rec["decision_plays"],
              })

          week_groups=defaultdict(list)
          for row in normalized:
              week_groups[(row["season"],row["week"])].append(row)

          attempt_history=defaultdict(
              lambda:deque(maxlen=ATTEMPT_WINDOW)
          )
          proe_history=defaultdict(
              lambda:deque(maxlen=PROE_WINDOW)
          )
          rows=[]

          for season,week in sorted(week_groups):
              current=week_groups[(season,week)]

              # Freeze EB hyperprior before any current-week outcome.
              eligible_histories={
                  team:list(hist)
                  for team,hist in attempt_history.items()
                  if len(hist)>=ATTEMPT_WINDOW
              }

              if season in TEST_SEASONS:
                  hyper=eb.estimate_hyperprior(
                      eligible_histories,
                      min_teams=MIN_HYPER_TEAMS,
                  )
                  for row in current:
                      team=row["team"]
                      ah=list(attempt_history[team])
                      ph=list(proe_history[team])
                      if len(ah)<ATTEMPT_WINDOW:
                          raise SystemExit(
                              f"{season} week {week} {team}: "
                              "insufficient attempt history"
                          )
                      if len(ph)<PROE_WINDOW:
                          raise SystemExit(
                              f"{season} week {week} {team}: "
                              "insufficient PROE history"
                          )

                      pred=eb.predict_from_history(
                          ah,
                          grand_mean=hyper["grand_mean"],
                          tau2=hyper["tau2"],
                      )
                      total_plays=sum(x["decision_plays"] for x in ph)
                      prior_proe=sum(
                          x["proe"]*x["decision_plays"] for x in ph
                      )/total_plays
                      rows.append({
                          "season":season,
                          "week":week,
                          "team":team,
                          "actual":row["attempts"],
                          "eb_prediction":pred["prediction"],
                          "eb_residual":
                              row["attempts"]-pred["prediction"],
                          "prior_proe":prior_proe,
                          "eb_weight":pred["weight"],
                      })

              # Append current data only after every prediction in week.
              for row in current:
                  attempt_history[row["team"]].append(row["attempts"])
                  proe_history[row["team"]].append({
                      "proe":row["proe"],
                      "decision_plays":row["decision_plays"],
                  })

          reports={}
          for season in TEST_SEASONS:
              sr=[r for r in rows if r["season"]==season]
              if len(sr)!=544:
                  raise SystemExit(
                      f"{season}: expected 544 rows, got {len(sr)}"
                  )

              pooled=pearson(
                  [r["prior_proe"] for r in sr],
                  [r["eb_residual"] for r in sr],
              )

              team_means={}
              for team in sorted({r["team"] for r in sr}):
                  sub=[r for r in sr if r["team"]==team]
                  team_means[team]={
                      "x":statistics.fmean(
                          r["prior_proe"] for r in sub
                      ),
                      "y":statistics.fmean(
                          r["eb_residual"] for r in sub
                      ),
                  }
              within=pearson(
                  [
                      r["prior_proe"]-team_means[r["team"]]["x"]
                      for r in sr
                  ],
                  [
                      r["eb_residual"]-team_means[r["team"]]["y"]
                      for r in sr
                  ],
              )

              reports[str(season)]={
                  "team_games":len(sr),
                  "teams":len({r["team"] for r in sr}),
                  "pooled_pearson":pooled,
                  "within_team_pearson":within,
                  "team_cluster_bootstrap":
                      cluster_bootstrap(sr,season),
                  "quartiles":quartiles(sr),
                  "mean_eb_weight":statistics.fmean(
                      r["eb_weight"] for r in sr
                  ),
              }

          pooled_positive=all(
              reports[str(s)]["pooled_pearson"]>0
              for s in TEST_SEASONS
          )
          ci_positive=sum(
              reports[str(s)]["team_cluster_bootstrap"]["ci95"][0]>0
              for s in TEST_SEASONS
          )
          within_positive=sum(
              reports[str(s)]["within_team_pearson"]>0
              for s in TEST_SEASONS
          )

          output={
              "analysis":"NFL_PROE_INCREMENTAL_SIGNAL_VS_EB_BASELINE",
              "status":"research_only_no_challenger",
              "created_at":datetime.now(timezone.utc).isoformat(),
              "code_sha":os.environ["FULL_COUNT_CODE_SHA"],
              "scientific_context":{
                  "eb_audit_run_id":34641267025,
                  "eb_primary_gate_passed":True,
                  "eb_module":"nfl.research.team_attempt_eb",
                  "question":(
                      "Does prior-five team PROE predict the next-game "
                      "official-attempt residual left after the frozen "
                      "prior-only empirical-Bayes team-volume baseline?"
                  ),
                  "holdout_policy":(
                      "No untouched challenger holdout inspected."
                  ),
                  "decision_rule":(
                      "PROE earns challenger design only if pooled Pearson "
                      ">0 in all 3 seasons, team-clustered 95% CI lower "
                      "bound >0 in >=2/3, and within-team Pearson >0 in >=2/3."
                  ),
              },
              "sources":sources,
              "reports":reports,
              "decision":{
                  "pooled_positive_all_seasons":pooled_positive,
                  "cluster_ci_entirely_positive_seasons":ci_positive,
                  "within_team_positive_seasons":within_positive,
                  "proe_incremental_signal_pass":(
                      pooled_positive
                      and ci_positive>=2
                      and within_positive>=2
                  ),
              },
              "next_if_pass":(
                  "Freeze one structurally grounded PROE adjustment formula "
                  "without target-season coefficient fitting, then test on "
                  "an untouched historical team-volume holdout before any "
                  "QB/player propagation."
              ),
              "next_if_fail":(
                  "Reject PROE for attempt volume on top of EB. Freeze EB "
                  "as the current team-volume research baseline and move to "
                  "prospective QB identity/availability plus opponent/game-state."
              ),
          }

          path="/tmp/nfl-proe-vs-eb-residual.json"
          with open(path,"w",encoding="utf-8") as f:
              json.dump(output,f,indent=2,sort_keys=True)
          print(json.dumps(output,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: nfl-proe-vs-eb-residual
          path: /tmp/nfl-proe-vs-eb-residual.json
          retention-days: 30
