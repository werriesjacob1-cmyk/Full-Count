name: NFL Pass Attempt Holdout Source Pin

# Source-identity-only step for the untouched pass-attempt shrinkage holdout.
#
# IMPORTANT:
# - This workflow DOES NOT compute model predictions or performance.
# - 2018 will be history only.
# - 2019 will be the untouched holdout once source identity is pinned.
on:
  push:
    branches:
      - superchad/nfl-foundation-continuation-20260911
    paths:
      - .github/workflows/nfl-pass-attempt-holdout-source-pin.yml

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install 'requests~=2.34.2'

      - name: Pin 2018-2019 weekly team source identity only
        env:
          FULL_COUNT_CODE_SHA: ${{ github.sha }}
        run: |
          PYTHONPATH=. python3 - <<'PY'
          import csv
          import hashlib
          import io
          import json
          import os
          from datetime import datetime, timezone

          import requests

          SEASONS = (2018, 2019)
          REQUIRED = {
              "season", "week", "season_type", "team", "attempts",
          }

          session = requests.Session()
          session.headers.update({
              "User-Agent":
                  "Full-Count NFL untouched holdout source pin"
          })

          sources = {}
          for season in SEASONS:
              url = (
                  "https://github.com/nflverse/nflverse-data/releases/download/"
                  f"stats_team/stats_team_week_{season}.csv"
              )
              resp = session.get(url, timeout=60)
              resp.raise_for_status()
              sha = hashlib.sha256(resp.content).hexdigest()
              rows = list(csv.DictReader(io.StringIO(resp.text)))
              if not rows:
                  raise SystemExit(f"{season}: empty source")
              missing = sorted(REQUIRED - set(rows[0]))
              if missing:
                  raise SystemExit(f"{season}: schema drift {missing}")

              reg_rows = sum(
                  1 for r in rows
                  if str(r.get("season_type") or "") == "REG"
              )
              teams = sorted({
                  str(r.get("team") or "").strip()
                  for r in rows
                  if str(r.get("season_type") or "") == "REG"
              })
              weeks = sorted({
                  int(float(r["week"]))
                  for r in rows
                  if str(r.get("season_type") or "") == "REG"
              })

              sources[str(season)] = {
                  "url": url,
                  "sha256": sha,
                  "bytes": len(resp.content),
                  "rows_total": len(rows),
                  "regular_season_rows": reg_rows,
                  "regular_season_team_count": len(teams),
                  "regular_season_week_min": min(weeks),
                  "regular_season_week_max": max(weeks),
                  "schema": sorted(rows[0].keys()),
              }

          output = {
              "analysis":
                  "NFL_PASS_ATTEMPT_HOLDOUT_SOURCE_PIN",
              "status":
                  "source_identity_only_no_model_performance",
              "created_at":
                  datetime.now(timezone.utc).isoformat(),
              "code_sha":
                  os.environ["FULL_COUNT_CODE_SHA"],
              "holdout_plan": {
                  "history_only_season": 2018,
                  "untouched_holdout_season": 2019,
                  "candidate_code_path":
                      "nfl/research/pass_attempt_shrinkage.py",
                  "candidate_weight_frozen": 0.50,
                  "performance_inspected": False,
              },
              "sources": sources,
          }

          path = "/tmp/nfl-pass-attempt-holdout-source-pin.json"
          with open(path, "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2, sort_keys=True)
          print(json.dumps(output, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: nfl-pass-attempt-holdout-source-pin
          path: /tmp/nfl-pass-attempt-holdout-source-pin.json
          retention-days: 30
