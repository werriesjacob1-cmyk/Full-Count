name: NFL Pass Attempt Shrinkage Screen

# Research-only diagnostic screen.
#
# Purpose:
#   Test whether the frozen 5-game official-attempt baseline overreacts to
#   recent extremes and benefits from simple regression toward a strictly
#   prior league-wide mean.
#
# Scientific rules:
#   - 2022 is history only.
#   - 2023-2025 are already-used diagnostic seasons.
#   - No untouched challenger holdout is inspected here.
#   - No football features, fitted coefficients, opponent data, or PROE.
#   - Fixed shrinkage grid is preregistered in this file.
#   - Selection rule is preregistered before results are viewed.
on:
  push:
    branches:
      - superchad/nfl-foundation-continuation-20260911
    paths:
      - .github/workflows/nfl-pass-attempt-shrinkage-screen.yml

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install 'requests~=2.34.2'

      - name: Screen fixed shrinkage weights on diagnostic seasons
        env:
          FULL_COUNT_CODE_SHA: ${{ github.sha }}
        run: |
          PYTHONPATH=. python3 - <<'PY'
          import csv
          import hashlib
          import io
          import json
          import math
          import os
          import random
          import statistics
          from collections import defaultdict, deque
          from datetime import datetime, timezone

          import requests

          HISTORY_SEASON = 2022
          TEST_SEASONS = (2023, 2024, 2025)
          SEASONS = (HISTORY_SEASON,) + TEST_SEASONS
          WINDOW = 5
          MIN_HISTORY = 3
          SHRINK_WEIGHTS = (0.10, 0.20, 0.30, 0.40, 0.50)
          BOOTSTRAPS = 5000
          SEED = 20260911
          EPS = 1e-12

          TEAM_SHA256 = {
              2022: "9803875bd0b74aa49230288d45359c75e45910f1cf1953ea0f07b9d3db35e4d1",
              2023: "dc5a387daabe8663deaddac492ad7020d47fb1a66048690b355b406cd8e4c454",
              2024: "b207a1430c2715d03bbf1844c4eae98695f364851ff6025f422febc2c13f5255",
              2025: "91058a59d894855377b2f39f40c4e7bdbeef96d12144289dc68215209a1c93cb",
          }
          REQUIRED = {"season", "week", "season_type", "team", "attempts"}

          def num(value, label):
              try:
                  out = float(value)
              except (TypeError, ValueError) as exc:
                  raise ValueError(f"invalid {label}: {value!r}") from exc
              if not math.isfinite(out):
                  raise ValueError(f"non-finite {label}: {value!r}")
              return out

          def pct(values, q):
              values = sorted(values)
              if not values:
                  return None
              pos = (len(values) - 1) * q
              lo = int(math.floor(pos))
              hi = int(math.ceil(pos))
              if lo == hi:
                  return values[lo]
              w = pos - lo
              return values[lo] * (1-w) + values[hi] * w

          def mae(rows, pred_field):
              return statistics.fmean(
                  abs(r[pred_field] - r["actual"]) for r in rows
              )

          def bootstrap_delta(rows, pred_field, seed_offset):
              groups = defaultdict(list)
              for row in rows:
                  groups[row["team"]].append(row)
              keys = sorted(groups)
              rng = random.Random(SEED + seed_offset)
              vals = []
              for _ in range(BOOTSTRAPS):
                  sample = []
                  for _ in keys:
                      sample.extend(groups[rng.choice(keys)])
                  b0 = mae(sample, "b0")
                  cand = mae(sample, pred_field)
                  vals.append(cand - b0)
              return {
                  "clusters": len(keys),
                  "replicates": len(vals),
                  "median_delta": pct(vals, 0.5),
                  "ci95": [pct(vals, 0.025), pct(vals, 0.975)],
                  "probability_delta_below_zero":
                      sum(v < 0 for v in vals) / len(vals),
              }

          session = requests.Session()
          session.headers.update({
              "User-Agent":
                  "Full-Count NFL pass-attempt shrinkage diagnostic"
          })

          raw = []
          sources = {}
          for season in SEASONS:
              url = (
                  "https://github.com/nflverse/nflverse-data/releases/download/"
                  f"stats_team/stats_team_week_{season}.csv"
              )
              resp = session.get(url, timeout=60)
              resp.raise_for_status()
              sha = hashlib.sha256(resp.content).hexdigest()
              if sha != TEAM_SHA256[season]:
                  raise SystemExit(
                      f"{season}: source drift {sha} != {TEAM_SHA256[season]}"
                  )
              rows = list(csv.DictReader(io.StringIO(resp.text)))
              if not rows:
                  raise SystemExit(f"{season}: empty source")
              missing = sorted(REQUIRED - set(rows[0]))
              if missing:
                  raise SystemExit(f"{season}: schema drift {missing}")
              sources[str(season)] = {
                  "url": url,
                  "sha256": sha,
                  "rows": len(rows),
                  "bytes": len(resp.content),
              }
              for r in rows:
                  if str(r["season_type"]) != "REG":
                      continue
                  s = int(float(r["season"]))
                  w = int(float(r["week"]))
                  team = str(r["team"]).strip()
                  attempts = num(r["attempts"], "attempts")
                  if attempts < 0:
                      raise SystemExit("negative attempts")
                  raw.append({
                      "season": s,
                      "week": w,
                      "team": team,
                      "attempts": attempts,
                  })

          # Deduplicate exact team-week identity and fail closed on collisions.
          by_key = {}
          for r in raw:
              key = (r["season"], r["week"], r["team"])
              if key in by_key:
                  raise SystemExit(f"duplicate team-week {key}")
              by_key[key] = r
          raw = sorted(
              by_key.values(),
              key=lambda r: (r["season"], r["week"], r["team"]),
          )

          # Strict prior-week league mean: for a given season/week, include
          # all prior regular-season team-games but NOTHING from current week.
          weeks = sorted({(r["season"], r["week"]) for r in raw})
          week_rows = defaultdict(list)
          for r in raw:
              week_rows[(r["season"], r["week"])].append(r)

          prior_league_mean = {}
          league_history = []
          for sw in weeks:
              if not league_history:
                  prior_league_mean[sw] = None
              else:
                  prior_league_mean[sw] = statistics.fmean(
                      r["attempts"] for r in league_history
                  )
              league_history.extend(week_rows[sw])

          team_history = defaultdict(lambda: deque(maxlen=WINDOW))
          analysis = []
          for sw in weeks:
              season, week = sw
              league_mean = prior_league_mean[sw]

              # Score all teams using only histories ending before this week.
              for r in sorted(week_rows[sw], key=lambda x: x["team"]):
                  h = team_history[r["team"]]
                  if (
                      season in TEST_SEASONS
                      and len(h) >= MIN_HISTORY
                      and league_mean is not None
                  ):
                      b0 = statistics.fmean(h)
                      out = {
                          "season": season,
                          "week": week,
                          "team": r["team"],
                          "actual": r["attempts"],
                          "b0": b0,
                          "league_prior_mean": league_mean,
                          "b0_minus_league": b0 - league_mean,
                      }
                      for weight in SHRINK_WEIGHTS:
                          key = f"s{int(round(weight*100)):02d}"
                          out[key] = (
                              (1.0-weight)*b0 + weight*league_mean
                          )
                      analysis.append(out)

              # Only after every team in the week is scored can this week's
              # observations enter future team histories.
              for r in week_rows[sw]:
                  team_history[r["team"]].append(r["attempts"])

          reports = {}
          for season in TEST_SEASONS:
              rows = [r for r in analysis if r["season"] == season]
              if not rows:
                  raise SystemExit(f"{season}: no analysis rows")
              base = mae(rows, "b0")
              candidates = {}
              for idx, weight in enumerate(SHRINK_WEIGHTS):
                  field = f"s{int(round(weight*100)):02d}"
                  cand = mae(rows, field)
                  candidates[field] = {
                      "weight": weight,
                      "mae": cand,
                      "delta_vs_b0": cand - base,
                      "team_cluster_bootstrap":
                          bootstrap_delta(
                              rows,
                              field,
                              season*100 + idx,
                          ),
                  }
              reports[str(season)] = {
                  "n": len(rows),
                  "teams": len({r["team"] for r in rows}),
                  "b0_mae": base,
                  "mean_prior_league_attempts":
                      statistics.fmean(
                          r["league_prior_mean"] for r in rows
                      ),
                  "candidates": candidates,
              }

          # Pooled diagnostic ranking. This is ONLY used to freeze the weight
          # for a later untouched holdout. No holdout outcome is read here.
          pooled = {}
          for idx, weight in enumerate(SHRINK_WEIGHTS):
              field = f"s{int(round(weight*100)):02d}"
              cand_mae = mae(analysis, field)
              base_mae = mae(analysis, "b0")
              season_deltas = [
                  reports[str(s)]["candidates"][field]["delta_vs_b0"]
                  for s in TEST_SEASONS
              ]
              ci_below_zero = sum(
                  reports[str(s)]["candidates"][field][
                      "team_cluster_bootstrap"
                  ]["ci95"][1] < 0
                  for s in TEST_SEASONS
              )
              pooled[field] = {
                  "weight": weight,
                  "n": len(analysis),
                  "b0_mae": base_mae,
                  "mae": cand_mae,
                  "delta_vs_b0": cand_mae - base_mae,
                  "improves_point_estimate_all_3":
                      all(d < 0 for d in season_deltas),
                  "cluster_ci_below_zero_seasons": ci_below_zero,
                  "season_deltas": season_deltas,
              }

          eligible = [
              (field, data)
              for field, data in pooled.items()
              if data["improves_point_estimate_all_3"]
              and data["cluster_ci_below_zero_seasons"] >= 2
          ]

          # Preregistered selection:
          # 1) must meet robust cross-season gate above;
          # 2) choose lowest pooled diagnostic MAE;
          # 3) exact tie => smaller shrinkage weight.
          if eligible:
              selected_field, selected = min(
                  eligible,
                  key=lambda item: (
                      item[1]["mae"],
                      item[1]["weight"],
                  ),
              )
              gate_pass = True
          else:
              selected_field = None
              selected = None
              gate_pass = False

          output = {
              "analysis": "NFL_PASS_ATTEMPT_SHRINKAGE_SCREEN",
              "status": "diagnostic_only_no_holdout",
              "created_at": datetime.now(timezone.utc).isoformat(),
              "code_sha": os.environ["FULL_COUNT_CODE_SHA"],
              "scientific_context": {
                  "baseline": (
                      "Mean official team pass attempts across team's prior "
                      "up-to-5 regular-season games, minimum 3."
                  ),
                  "candidate": (
                      "(1-w)*B0 + w*strictly-prior league-wide regular-season "
                      "attempt mean."
                  ),
                  "weights": list(SHRINK_WEIGHTS),
                  "diagnostic_seasons": list(TEST_SEASONS),
                  "history_only_season": HISTORY_SEASON,
                  "holdout_policy": (
                      "No untouched challenger holdout is inspected here. "
                      "If the screen passes, freeze the selected weight in a "
                      "separate commit before any holdout outcome is read."
                  ),
                  "selection_rule": (
                      "Require negative MAE delta in all 3 diagnostic seasons "
                      "and team-cluster 95% CI below zero in >=2/3; among "
                      "eligible weights choose lowest pooled MAE, tie to "
                      "smaller weight."
                  ),
              },
              "sources": sources,
              "reports": reports,
              "pooled": pooled,
              "decision": {
                  "screen_pass": gate_pass,
                  "selected_field": selected_field,
                  "selected": selected,
              },
              "next_if_pass": (
                  "Freeze selected weight exactly; preregister an untouched "
                  "historical holdout and source pins before reading its "
                  "performance."
              ),
              "next_if_fail": (
                  "Reject simple global shrinkage and move to prospective "
                  "availability/role plus opponent/game-state features."
              ),
          }

          path = "/tmp/nfl-pass-attempt-shrinkage-screen.json"
          with open(path, "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2, sort_keys=True)
          print(json.dumps(output, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: nfl-pass-attempt-shrinkage-screen
          path: /tmp/nfl-pass-attempt-shrinkage-screen.json
          retention-days: 30
