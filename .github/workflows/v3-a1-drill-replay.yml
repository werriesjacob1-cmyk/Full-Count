# FC-MLB-001A amendment A1 -- ENVIRONMENT B: independent virgin replay of the evidence-integrity drill.
#
# FC-MLB-001A EVIDENCE-INTEGRITY DRILL -- NOT A PROSPECTIVE UNIT. This workflow only VERIFIES committed drill
# artifacts on a fresh GitHub-hosted VM (a different machine from the recording container). It never collects,
# seals, pushes, posts, deploys, merges, reads outcomes, or touches V3's trigger, dispatcher or evidence chain.
#
# Runs on: a push to the amendment branch that changes the drill directory, or manually (workflow_dispatch once the
# file is on the default branch -- not required). Read-only token. The checkout is deliberately SHALLOW (depth 1):
# provenance must not depend on clone depth. Third-party actions are pinned to exact commits.
name: V3 A1 drill replay (environment B)

on:
  push:
    branches: [claude/mlb-v3-amendment-a1-20261005]
    paths: ['research/mlb_accuracy_challenger_20261001/v3/a1_drill/**']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: v3-a1-drill-replay-${{ github.sha }}
  cancel-in-progress: false

jobs:
  replay-b:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      V3: research/mlb_accuracy_challenger_20261001/v3
      SHADOW_PIN: 7d3ebacd55c34c6ec78030bdeca70799e56d4764
    steps:
      - name: Checkout exact amendment commit (shallow on purpose)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Python 3.11 (the lock's interpreter line)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
      - name: Fetch the frozen shadow pin only (depth 1)
        run: git fetch --no-tags --depth 1 origin "$SHADOW_PIN"
      - name: Virgin-environment identities
        run: |
          set -eu
          echo "commit=$(git rev-parse HEAD)"
          echo "v3_tree=$(git rev-parse HEAD:$V3)"
          echo "shallow=$(git rev-parse --is-shallow-repository)"
          echo "lock_sha256=$(sha256sum $V3/shadow-requirements.lock | cut -d' ' -f1)"
          echo "python=$(python3 --version)  runner_image=${ImageOS:-?}-${ImageVersion:-?}"
          test ! -e "$HOME/.pybaseball" && echo "host pybaseball cache: ABSENT"
          echo "::notice title=A1-B IDENTITIES::commit=$(git rev-parse HEAD) v3_tree=$(git rev-parse HEAD:$V3) shallow=$(git rev-parse --is-shallow-repository) lock_sha256=$(sha256sum $V3/shadow-requirements.lock | cut -d' ' -f1) python=$(python3 --version | cut -d' ' -f2) image=${ImageOS:-?}-${ImageVersion:-?} host_pybaseball_cache=$(test -e $HOME/.pybaseball && echo PRESENT || echo ABSENT)"
          ls -1 $V3/a1_drill
      - name: Unit + mutant tests (hermetic)
        run: |
          set -eu
          cd "$V3"
          V3A1_ISOLATION_BASE="$RUNNER_TEMP/iso_tests" python3 -W ignore -m unittest test_a1 -v 2>&1 | tail -20
          python3 -W ignore -m unittest test_v3 2>&1 | tail -3
      - name: Replay every drill from sealed artifacts alone (environment B)
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/out"
          rc=0
          for d in $V3/a1_drill/A1_DRILL_*/; do
            n=$(basename "$d")
            V3A1_ISOLATION_BASE="$RUNNER_TEMP/iso_$n" python3 "$V3/a1_drill.py" verify --drill-dir "$d" \
              --result "$RUNNER_TEMP/out/${n}_REPLAY_B_RESULT.json" || rc=1
            A1_DRILL_DIR="$d" V3A1_ISOLATION_BASE="$RUNNER_TEMP/iso_mut_$n" \
              python3 -W ignore -m unittest "test_a1.DrillArtifacts" -v 2>&1 | tail -3 || rc=1
          done
          {
            echo "## FC-MLB-001A drill replay (environment B) — NOT A PROSPECTIVE UNIT"
            for f in "$RUNNER_TEMP"/out/*_REPLAY_B_RESULT.json; do
              python3 -c "import json,sys; r=json.load(open(sys.argv[1])); print('###', sys.argv[1].rsplit('/',1)[-1]); print('result:', r['result']); print('checks:', json.dumps(r['checks'])); print('replay:', json.dumps({k: r['replay'][k] for k in ('misses','unconsumed','n_http','guard_violations','environment_mismatch')})); print('hashes:', json.dumps(r['hashes'])); print('identities:', json.dumps(r['identities']))" "$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          # Also expose results through the check-run annotations API (readable without blob downloads)
          for f in "$RUNNER_TEMP"/out/*_REPLAY_B_RESULT.json; do
            python3 - "$f" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          n = sys.argv[1].rsplit("/", 1)[-1]
          rows = {"RESULT": {"result": r["result"], "checks": r["checks"]},
                  "REPLAY": {k: r["replay"][k] for k in ("misses", "unconsumed", "n_http", "guard_violations",
                                                          "environment_mismatch", "error")},
                  "REPLAY_ENV": r["replay"]["replay_env"], "HASHES": r["hashes"], "IDENTITIES": r["identities"],
                  "TSA": r.get("tsa"), "VERIFIER_ENV": r.get("verifier_environment")}
          for k, v in rows.items():
              print(f"::notice title=A1-B {n} {k}::{json.dumps(v, sort_keys=True)}")
          PY
          done
          exit $rc
        working-directory: ${{ github.workspace }}
      - name: Durable result artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: a1-drill-replay-b-${{ github.sha }}
          path: ${{ runner.temp }}/out/
          retention-days: 90
