name: Board Freshness Watchdog

# 2026-08-28 incident hardening. The existing Live Freshness Watchdog was
# GREEN for the entire ten-hour outage, and correctly so: docs/live.json
# really was updating every five minutes. What no watchdog could see was
# that docs/data.json.generated_at was 06:31:57Z -- 10.1 hours stale --
# because three consecutive Dashboard Refresh runs (07:11, 12:35, 14:43
# UTC) died on a single unidentifiable candidate. Customers saw fresh
# prices painted onto a ten-hour-old model and lineup basis.
#
# This watchdog closes that blind spot. It checks the board's OWN
# generated_at, never git commit age -- commit age advanced every five
# minutes throughout the incident from live price pushes and would have
# read "seconds old" the whole time.
#
# It does NOT write docs/data.json. One semantic writer, unchanged
# (dashboard-refresh.yml -> build_dashboard.py). It only detects and
# dispatches the canonical workflow, exactly as the live watchdog does.
on:
  schedule:
    # Requested three times an hour, offset off the hour so it does not
    # contend with dashboard-refresh.yml in the same minute.
    #
    # READ THIS AS A REQUEST, NOT A GUARANTEE. Measured on this repo on
    # 2026-08-28: Lineup Watch declares '*/10 * * * *' and actually
    # delivered 12.4 runs/day -- 9% of its declared cadence, with a median
    # gap of 51 minutes, a worst observed gap of 11.0 hours, and 0 of 29
    # sampled intervals anywhere near the 10 minutes it claims. GitHub's
    # scheduled-workflow queue is best-effort and drops ticks under load.
    #
    # So this watchdog is a safety net with a long and variable delay, not
    # a 20-minute detection SLA, and it must not be described as one. It
    # meaningfully shortens a ten-hour outage; it does not bound it. A real
    # bound needs an off-platform check, which is outside this repo.
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: board-freshness-watchdog
  cancel-in-progress: false

jobs:
  check-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            docs/data.json
            dashboard/check_board_freshness.py
          sparse-checkout-cone-mode: true

      - name: Check docs/data.json board freshness
        id: freshness
        run: |
          if python3 dashboard/check_board_freshness.py docs/data.json; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch Dashboard Refresh (recovery attempt)
        if: steps.freshness.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::warning::docs/data.json exceeded the BOARD freshness SLA -- dispatching Dashboard Refresh to recover. Live prices being current does not make the board current."
          gh workflow run dashboard-refresh.yml --ref main \
            --repo "${{ github.repository }}"

      - name: Fail visibly on a stale board
        if: steps.freshness.outputs.stale == 'true'
        run: |
          echo "::error::BOARD STALE -- docs/data.json generation timestamp exceeded the freshness SLA. A recovery dispatch was sent to Dashboard Refresh; this run is marked failed so the condition stays visible until a successful check confirms recovery. NOTE: the Live Freshness Watchdog can be green at the same time -- it only proves prices are moving, not that the board underneath them is current."
          exit 1
