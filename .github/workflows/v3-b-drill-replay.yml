# FC-MLB-001B -- ENVIRONMENT B: virgin-runner replay of the 001B evidence-integrity drill in the pinned runtime.
#
# FC-MLB-001B EVIDENCE-INTEGRITY DRILL -- NOT A PROSPECTIVE UNIT. Verifies committed drill artifacts only. Never
# collects, seals, pushes, posts, deploys, merges, reads outcomes, or touches V3's trigger, dispatcher, activation or
# evidence chain. Criteria: ops e5475e66c0 engineering/ops/TASKS/FC-MLB-001B.md.
#
# Inputs: the identities frozen in git (b_drill/B_DRILL_RECORD.json, committed from environment A's annotations) name
# environment A's run and its two artifacts. This job first requires GitHub's artifact + run metadata to bind exactly
# to the committed record (b_artifacts.py), downloads them BY EXACT ARTIFACT ID (REST API; artifacts are temporary,
# outside git, non-authoritative), checks the artifact zip digests (bare lowercase hex), then the verifier checks every drill
# file against the committed SHA256SUMS and the tape's byte size + sha256 BEFORE replay. A committed
# b_drill/MUTANT.json deliberately corrupts the downloaded bytes (controlled mutant): the job must fail.
#
# Gate semantics (inherited from the repaired A1 gate): every step runs bash -eo pipefail and starts set -euo
# pipefail; test output goes to a log and the REAL exit code decides; required tests are never skipped (the
# sandbox tests require root and run under sudo; a skip is a failure); a missing drill is a failure; the verifier
# result is enforced by always-run gate steps. The checkout is shallow on purpose (provenance must not depend on
# clone depth). Actions are pinned to commits; the runtime image is pinned by digest inside runtime_image.py.
name: V3 001B drill replay (environment B, pinned runtime)

on:
  push:
    branches: [claude/mlb-v3-amendment-b-20261005]
    paths: ['research/mlb_accuracy_challenger_20261001/v3/**', '.github/workflows/v3-b-drill-replay.yml',
            '!research/mlb_accuracy_challenger_20261001/v3/b_drill/RECORD_REQUEST.json']
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read          # download environment A's artifacts by id

concurrency:
  group: v3-b-drill-replay-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  replay-b:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      V3: research/mlb_accuracy_challenger_20261001/v3
      SHADOW_PIN: 7d3ebacd55c34c6ec78030bdeca70799e56d4764
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact commit (shallow on purpose)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Host Python 3.11 (launcher/verifier only; the pipeline runs in the pinned image)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
      - name: Fetch the frozen shadow pin only (depth 1)
        run: |
          set -euo pipefail
          git fetch --no-tags --depth 1 origin "$SHADOW_PIN"
      - name: Host tools (strace for the whole-process-tree trace)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq strace
          strace -V | head -n 1
          mkdir -p "$RUNNER_TEMP/out"
      - name: Pinned runtime image (fetch by digest, verify every blob, extract, identity)
        run: |
          set -euo pipefail
          sudo -E env "PATH=$PATH" V3B_RUNTIME_CACHE="$RUNNER_TEMP/v3b_runtime" python3 "$V3/runtime_image.py" "$RUNNER_TEMP/v3b_runtime" > "$RUNNER_TEMP/out/runtime_identity.json"
          cat "$RUNNER_TEMP/out/runtime_identity.json"
          echo "::notice title=B RUNTIME::$(python3 -c "import json,sys; r=json.load(open(sys.argv[1])); r.pop('rootfs'); print(json.dumps(r, sort_keys=True))" "$RUNNER_TEMP/out/runtime_identity.json")"
      - name: Virgin-environment identities
        run: |
          set -euo pipefail
          host_cache=ABSENT; if [ -e "$HOME/.pybaseball" ]; then host_cache=PRESENT; fi
          echo "::notice title=B IDENTITIES::commit=$(git rev-parse HEAD) v3_tree=$(git rev-parse "HEAD:$V3") shallow=$(git rev-parse --is-shallow-repository) lock_sha256=$(sha256sum "$V3/shadow-requirements.lock" | cut -d' ' -f1) host_python=$(python3 --version | cut -d' ' -f2) kernel=$(uname -r) nproc=$(nproc) image=${ImageOS:-?}-${ImageVersion:-?} host_pybaseball_cache=$host_cache"
          ls -1 "$V3/b_drill" || true
      - name: Tests + mutants (test_b as root, test_v3, test_a1) -- real exit codes, no skips
        working-directory: research/mlb_accuracy_challenger_20261001/v3
        run: |
          set -euo pipefail
          run() {  # name, command...
            local n="$1"; shift; local rc=0
            "$@" > "$RUNNER_TEMP/out/$n.log" 2>&1 || rc=$?
            cat "$RUNNER_TEMP/out/$n.log"
            echo "::notice title=B TEST $n::rc=$rc $(grep -E '^(Ran |OK|FAILED)' "$RUNNER_TEMP/out/$n.log" | tr '\n' ' ')"
            if [ "$rc" -ne 0 ]; then echo "::error title=B TEST $n::unittest exited $rc"; exit "$rc"; fi
          }
          run test_b sudo -E env "PATH=$PATH" V3B_RUNTIME_CACHE="$RUNNER_TEMP/v3b_runtime" V3A1_ISOLATION_BASE="$RUNNER_TEMP/iso_b" python3 -W ignore -m unittest test_b -v
          if grep -q "skipped" "$RUNNER_TEMP/out/test_b.log"; then echo "::error title=B TEST test_b::a 001B test was skipped"; exit 1; fi
          run test_b_artifacts python3 -W ignore -m unittest test_b_artifacts
          run test_v3 python3 -W ignore -m unittest test_v3
          run test_a1 env V3A1_ISOLATION_BASE="$RUNNER_TEMP/iso_a1" python3 -W ignore -m unittest test_a1
      - name: Retrieve environment A's artifacts by exact id (temporary transport; verified, never trusted)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rec="$V3/b_drill/B_DRILL_RECORD.json"
          if [ ! -s "$rec" ]; then echo "::error title=B DRILLS::no committed b_drill/B_DRILL_RECORD.json"; exit 1; fi
          python3 - "$rec" > "$RUNNER_TEMP/ids.env" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          print(f"DRILL={r['drill']}\nFILES_ID={r['files_artifact']['id']}\nFILES_ZIP={r['files_artifact']['zip_sha256']}")
          print(f"TAPE_ID={r['tape']['artifact_id']}\nTAPE_ZIP={r['tape']['zip_sha256']}\nTAPE_NAME={r['tape']['asset_name']}")
          PY
          source "$RUNNER_TEMP/ids.env"
          mkdir -p "$RUNNER_TEMP/dl/files/$DRILL" "$RUNNER_TEMP/dl/tape"
          # Codex pre-drill audit MUST FIX 1 + 2: GitHub's artifact + workflow-run metadata must agree EXACTLY with
          # the committed record (id, name, record run id, record commit, repository, not expired, digest) BEFORE
          # download; then the zip's own sha256 (bare lowercase hex, the one frozen representation) is checked.
          for kind in files tape; do
            python3 "$V3/b_artifacts.py" --record "$rec" --kind "$kind" --out "$RUNNER_TEMP/dl/$kind.zip" \
              | tee "$RUNNER_TEMP/out/binding_$kind.json"
            echo "::notice title=B ARTIFACT BINDING $kind::$(cat "$RUNNER_TEMP/out/binding_$kind.json")"
          done
          unzip -q "$RUNNER_TEMP/dl/files.zip" -d "$RUNNER_TEMP/dl/files/$DRILL"
          unzip -q "$RUNNER_TEMP/dl/tape.zip" -d "$RUNNER_TEMP/dl/tape"
          test -f "$RUNNER_TEMP/dl/tape/$TAPE_NAME"
          echo "::notice title=B TRANSPORT::files_artifact=$FILES_ID tape_artifact=$TAPE_ID tape=$TAPE_NAME bytes=$(stat -c %s "$RUNNER_TEMP/dl/tape/$TAPE_NAME")"
          mut="$V3/b_drill/MUTANT.json"
          if [ -f "$mut" ]; then   # controlled corruption mutant: flip one byte of the downloaded tape
            python3 - "$mut" "$RUNNER_TEMP/dl/tape/$TAPE_NAME" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1])); off = int(m["flip_tape_byte_at"])
          with open(sys.argv[2], "r+b") as fh:
              fh.seek(off); b = fh.read(1); fh.seek(off); fh.write(bytes([b[0] ^ 0x01]))
          print(f"::warning title=B MUTANT::CONTROLLED MUTANT ACTIVE: flipped tape byte at offset {off} ({m.get('label')})")
          PY
          fi
      - name: Replay the 001B drill in the pinned runtime from the frozen identities (environment B)
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/ids.env"
          : > "$RUNNER_TEMP/out/verify_rc.txt"
          n="$DRILL"; rc=0
          # root (sandbox) reads the runner-owned checkout: safe.directory scoped to this one command via the
          # environment (never written to any git config; the sandbox's env -i drops it for the pipeline)
          sudo -E env "PATH=$PATH" V3B_RUNTIME_CACHE="$RUNNER_TEMP/v3b_runtime" V3A1_ISOLATION_BASE="$RUNNER_TEMP/iso_$n" \
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" \
            python3 "$V3/b_drill.py" verify --drill-dir "$RUNNER_TEMP/dl/files/$n" --tape-file "$RUNNER_TEMP/dl/tape/$TAPE_NAME" \
            --record "$V3/b_drill/B_DRILL_RECORD.json" --result "$RUNNER_TEMP/out/${n}_REPLAY_B_RESULT.json" \
            > "$RUNNER_TEMP/out/${n}_verify.log" 2>&1 || rc=$?
          tail -c 30000 "$RUNNER_TEMP/out/${n}_verify.log"
          echo "$n $rc" >> "$RUNNER_TEMP/out/verify_rc.txt"
          sudo chmod -R a+rX "$RUNNER_TEMP/out"
          test -s "$RUNNER_TEMP/out/${n}_REPLAY_B_RESULT.json"
          python3 - "$RUNNER_TEMP/out/${n}_REPLAY_B_RESULT.json" "$rc" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1])); n = sys.argv[1].rsplit("/", 1)[-1].replace("_REPLAY_B_RESULT.json", "")
          tr = r.get("traces") or {}
          rows = {"RESULT": {"verify_rc": int(sys.argv[2]), "result": r["result"], "gates": r.get("gates")},
                  "CHECKS": r["checks"],
                  "PAYLOAD": r.get("payload"),
                  "REPLAY": r.get("replay"),
                  "HASHES": r.get("hashes"),
                  "IDENTITIES": r.get("identities"),
                  "TRACE": {k: {kk: (v or {}).get(kk) for kk in ("forbidden_reads", "executables", "n_successful_calls", "by_class")}
                            for k, v in tr.items()},
                  "KERNEL": r.get("kernel_surfaces"),
                  "ENVELOPE": {"envelope": r.get("envelope"), "verifier": r.get("verifier_environment"),
                               "frozen_record": r.get("frozen_record")}}
          for k, v in rows.items():
              print(f"::notice title=B {n} {k}::{json.dumps(v, sort_keys=True)[:6000]}")
          PY
      - name: 'Gate 1/3: integrity (sealed artifacts, bindings, payload seal, tape identity, envelope chronology)'
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          results=("$RUNNER_TEMP"/out/*_REPLAY_B_RESULT.json)
          if [ "${#results[@]}" -lt 1 ]; then echo "::error title=B GATE integrity::no replay result"; exit 1; fi
          python3 - "integrity" "${results[@]}" <<'PY'
          import json, sys
          gate, bad = sys.argv[1], {}
          for f in sys.argv[2:]:
              r = json.load(open(f))
              if r.get("gates", {}).get(gate) != "PASS":
                  bad[f.rsplit("/", 1)[-1]] = {k: v for k, v in r["checks"].items() if v != "PASS"}
          if bad:
              print(f"::error title=B GATE {gate}::FAIL {json.dumps(bad, sort_keys=True)[:3000]}")
              sys.exit(1)
          print(f"::notice title=B GATE {gate}::PASS")
          PY
      - name: 'Gate 2/3: replay (tape by identity, 0 misses/unconsumed, LITERAL payload identity, runtime identity, 0 forbidden reads)'
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          results=("$RUNNER_TEMP"/out/*_REPLAY_B_RESULT.json)
          if [ "${#results[@]}" -lt 1 ]; then echo "::error title=B GATE replay::no replay result"; exit 1; fi
          python3 - "replay" "${results[@]}" <<'PY'
          import json, sys
          gate, bad = sys.argv[1], {}
          for f in sys.argv[2:]:
              r = json.load(open(f))
              if r.get("gates", {}).get(gate) != "PASS":
                  bad[f.rsplit("/", 1)[-1]] = {k: v for k, v in r["checks"].items() if v != "PASS"}
          if bad:
              print(f"::error title=B GATE {gate}::FAIL {json.dumps(bad, sort_keys=True)[:3000]}")
              sys.exit(1)
          print(f"::notice title=B GATE {gate}::PASS")
          PY
      - name: 'Gate 3/3: verifier exit codes'
        if: always()
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/out/verify_rc.txt"
          cat "$RUNNER_TEMP/out/verify_rc.txt"
          if awk '$2 != 0 {bad=1} END {exit bad ? 0 : 1}' "$RUNNER_TEMP/out/verify_rc.txt"; then
            echo "::error title=B GATE verify_rc::a verifier exited nonzero"; exit 1
          fi
          echo "::notice title=B GATE verify_rc::all verifiers exited 0"
      - name: Durable result artifact (results, retained replay payload/board bytes, env, traces, logs)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: b-drill-replay-${{ github.sha }}
          path: ${{ runner.temp }}/out/
          retention-days: 90
