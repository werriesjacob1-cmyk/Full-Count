name: Dashboard Refresh

# Rebuilds the standalone Full Count Board dashboard (dashboard/build_dashboard.py)
# and commits the complete board snapshot, on its own schedule, with no manual
# trigger from either Jacob or Claude. Direct request: "I want the dashboard
# to auto update each day, as prices change, and as lineups come out...
# I want this to run separately from you. No effort from either of us."
#
# Every 2 hours, not more often: build_dashboard.py's own docstring is
# explicit that a fresh live pass takes several minutes and makes real
# calls to FanGraphs/Statcast/FanDuel -- "this is not something to run
# every few minutes." Spread across the day this still catches lineups as
# MLB posts them progressively through the afternoon/evening and refreshes
# FanDuel prices each time. The separate Dashboard Live Update workflow
# owns live.json, and Dashboard Pages Deploy publishes the current pair.
#
# Multiple cron entries, same reasoning as mlb-daily.yml's own multi-window
# schedule: GitHub documents that scheduled runs are delayed under load and
# can be dropped entirely, and this project has already measured that
# happening. One missed window here is not catastrophic (the page just
# stays on its last build a bit longer), but there is no reason to accept
# more staleness than necessary when redundant windows are free on a
# public repo.
on:
  schedule:
    - cron: '0 13 * * *'
    - cron: '0 15 * * *'
    - cron: '0 17 * * *'
    - cron: '0 19 * * *'
    - cron: '0 21 * * *'
    - cron: '0 23 * * *'
    - cron: '0 1 * * *'
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Significant full/lineup rebuilds use GitHub's true bounded queue. They must
# never be displaced by a later five-minute observation. State correctness is
# still merge-based rather than relying on queue ordering.
concurrency:
  group: dashboard-full-rebuild
  cancel-in-progress: false
  queue: max

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build dashboard
        run: python3 dashboard/build_dashboard.py --out-dir "$RUNNER_TEMP/dashboard-build"

      - name: Commit and push
        run: |
          git config user.name "mlb-pipeline-bot"
          git config user.email "actions@github.com"
          cp "$RUNNER_TEMP/dashboard-build/data.json" "$RUNNER_TEMP/data-candidate.json"
          for attempt in 1 2 3 4 5; do
            # The job may have waited in queue or spent minutes scoring. Base
            # publication on current main at actual write time, then rerun the
            # first-pitch/registry/live reconciliation against that state.
            git fetch origin main
            git checkout --detach origin/main
            python3 dashboard/finalize_dashboard_state.py \
              --candidate "$RUNNER_TEMP/data-candidate.json" \
              --current docs/data.json --live docs/live.json --out docs/data.json
            cp "$RUNNER_TEMP/dashboard-build/index.html" docs/index.html
            cp "$RUNNER_TEMP/dashboard-build/app.css" docs/app.css
            cp "$RUNNER_TEMP/dashboard-build/app.js" docs/app.js
            git add docs/index.html docs/app.css docs/app.js docs/data.json
            if git diff --cached --quiet; then
              echo "No newer complete-board change to publish."
              exit 0
            fi
            git commit -m "Dashboard refresh $(date -u +'%F %H:%M') UTC"
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5); regenerating from current main."
          done
          echo "::error::Failed to push dashboard rebuild after 5 attempts."
          exit 1
