name: Dashboard Pages Deploy

# Repository commits do not mutate an already-uploaded Pages artifact.
# Deploy the newest main/docs snapshot after either state owner completes,
# including a partial live run that successfully committed one channel.
on:
  workflow_run:
    workflows: [Dashboard Refresh, Dashboard Live Update]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard-pages-deployment
  # Do not cancel a run after deploy-pages may already have made its artifact
  # public. Default single-pending behavior coalesces redundant deploy requests.
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    # New exposure candidates are admitted only when first pitch is at least
    # 15 minutes beyond artifact preparation. A successful job is bounded to
    # 10 minutes, so it cannot first expose one after the betting cutoff.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify publication registry
        run: python3 dashboard/verify_publication_registry.py

      - name: Stage exact Pages artifact
        run: |
          python3 dashboard/prepare_pages_artifact.py \
            --source docs --out "$RUNNER_TEMP/pages-artifact" \
            --source-commit "$(git rev-parse HEAD)"

      - name: Verify complete Pages artifact contract
        run: python3 dashboard/verify_pages_artifact.py "$RUNNER_TEMP/pages-artifact"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-artifact

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public site converges to deployed artifact
        # A green deploy-pages step only means our upload succeeded -- it is
        # not proof a real browser fetching the public URL right now gets
        # this artifact. Verified live 2026-08-20: GitHub Pages' own CDN
        # (Fastly) serves data.json with `Cache-Control: max-age=600` and
        # answered a freshly cache-busted request (`?t=<unique>`) with
        # `x-cache: HIT` -- the query-string trick client code already uses
        # does not reliably defeat this edge cache, so there is a real,
        # previously-unverified propagation window after every deploy.
        # Poll the public publication_manifest.json (the artifact's own
        # content-addressed provenance record, already deployed alongside
        # data.json/live.json) for source_commit to match this run's
        # checkout, bounded so a real outage still fails the job instead of
        # hanging past the 10-minute job timeout.
        env:
          PAGES_DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - "$RUNNER_TEMP/pages-artifact" "$PAGES_DEPLOYMENT_URL" <<'PYEOF'
          import json
          import sys
          import time
          import urllib.request

          # NOTE on what NOT to compare: publication_manifest.json's own
          # files["data.json"] is dashboard/live_state.py's state_digest() --
          # sha256 of json.dumps(data, sort_keys=True, separators=(",",":"))
          # over the NORMALIZED in-memory dict -- not a hash of the raw bytes
          # actually written to disk/served (atomic_write_json's own
          # formatting differs: different key order, indentation). Verified
          # live before shipping this step: hashing the raw served response
          # bytes and comparing against that field mismatches on every real
          # deploy, which would have made this gate permanently red. The
          # correct, meaningful signals are source_commit (content-addressed,
          # baked into the SAME manifest file served alongside data.json/
          # live.json from one atomic Pages artifact upload) and data.json's
          # own generated_at field, both compared below.
          artifact_dir, base_url = sys.argv[1], sys.argv[2].rstrip("/")
          with open(f"{artifact_dir}/publication_manifest.json", encoding="utf-8") as f:
              local_manifest = json.load(f)
          with open(f"{artifact_dir}/data.json", encoding="utf-8") as f:
              local_data = json.load(f)
          expected_commit = local_manifest["source_commit"]
          expected_generated_at = local_data.get("generated_at")
          print(f"Expecting source_commit={expected_commit} generated_at={expected_generated_at}")

          ATTEMPTS, DELAY_S = 12, 5
          for attempt in range(1, ATTEMPTS + 1):
              cachebust = f"{time.time_ns()}-{attempt}"
              try:
                  req = urllib.request.Request(
                      f"{base_url}/publication_manifest.json?cb={cachebust}",
                      headers={"Cache-Control": "no-cache", "Pragma": "no-cache"},
                  )
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      public_manifest = json.loads(resp.read())
              except Exception as e:
                  print(f"[{attempt}/{ATTEMPTS}] fetch failed: {type(e).__name__}: {e}", flush=True)
                  time.sleep(DELAY_S)
                  continue
              public_commit = public_manifest.get("source_commit")
              if public_commit != expected_commit:
                  print(f"[{attempt}/{ATTEMPTS}] public source_commit={public_commit} "
                       f"!= expected {expected_commit}; retrying in {DELAY_S}s", flush=True)
                  time.sleep(DELAY_S)
                  continue

              try:
                  req = urllib.request.Request(
                      f"{base_url}/data.json?cb={cachebust}",
                      headers={"Cache-Control": "no-cache", "Pragma": "no-cache"},
                  )
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      public_data = json.loads(resp.read())
              except Exception as e:
                  print(f"[{attempt}/{ATTEMPTS}] data.json fetch failed: {type(e).__name__}: {e}", flush=True)
                  time.sleep(DELAY_S)
                  continue
              public_generated_at = public_data.get("generated_at")
              if public_generated_at != expected_generated_at:
                  print(f"[{attempt}/{ATTEMPTS}] manifest converged but public data.json "
                       f"generated_at={public_generated_at} != expected {expected_generated_at}; "
                       f"retrying in {DELAY_S}s", flush=True)
                  time.sleep(DELAY_S)
                  continue

              print(f"CONVERGED on attempt {attempt}/{ATTEMPTS}: public source_commit="
                   f"{public_commit}, data.json generated_at={public_generated_at} matches artifact.")
              sys.exit(0)

          print(f"::error::Public site never converged to source_commit={expected_commit} "
               f"generated_at={expected_generated_at} after {ATTEMPTS} attempts "
               f"({ATTEMPTS * DELAY_S}s) -- deploy-pages reported success but the live public "
               f"URL is still serving something else. Do not treat this run as a successful publish.")
          sys.exit(1)
          PYEOF

      - name: Confirm durable public exposure
        env:
          PAGES_DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          cp "$RUNNER_TEMP/pages-artifact/publication_manifest.json" \
            "$RUNNER_TEMP/deployed-publication-manifest.json"
          git config user.name "mlb-pipeline-bot"
          git config user.email "actions@github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout --detach origin/main
            python3 dashboard/confirm_publication.py \
              --manifest "$RUNNER_TEMP/deployed-publication-manifest.json" \
              --registry data/public_top_picks/registry.json
            git add data/public_top_picks/registry.json
            if git diff --cached --quiet; then
              echo "Publication registry already contains this deployment."
              exit 0
            fi
            git commit -m "Record deployed Top Pick exposure $(date -u +'%F %H:%M') UTC"
            if git push origin HEAD:main; then
              echo "Recorded public exposure on attempt $attempt."
              exit 0
            fi
            echo "Registry push rejected (attempt $attempt/5); retrying idempotently from current main."
          done
          echo "::error::Pages deployed, but publication registry persistence failed. Rerun this deployment to recover from its public manifest."
          exit 1
