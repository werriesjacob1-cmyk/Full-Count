name: MLB Daily Pipeline

on:
  schedule:
    # 14:30 UTC = 10:30 AM EDT. MLB's regular season runs entirely within U.S.
    # daylight saving time (late March - early October), so this cron is
    # accurate for the season. It will run at 9:30 AM CT-equivalent (10:30 AM
    # EST) if ever triggered outside DST (e.g. a manual re-run in November) —
    # see README for the tradeoff; resolving DST dynamically in cron YAML
    # isn't worth the complexity for a two-outing-a-year edge case.
    - cron: '30 14 * * *'
    # LATER RUNS EXIST BECAUSE LINEUPS DO NOT EXIST YET AT 14:30.
    #
    # Batting-order slot is the strongest single signal in the whole model
    # (AUC 0.554 across 5,654 backtested hits props, against everything else
    # at 0.52 or indistinguishable from noise), and quality control now
    # rejects any batter prop whose lineup is not confirmed -- a nine-man
    # posted lineup. At 14:30 UTC (10:30am ET) almost no lineup for an evening
    # game has been posted, so the early runs are working from projections for
    # exactly the input that matters most.
    #
    # MLB games run 17:05 UTC through roughly 02:10 UTC, and lineups appear
    # two to three hours before each first pitch. These two extra runs cover
    # the afternoon and prime-time slates with real posted lineups. Each run
    # overwrites the day's picks, so the last run before you bet is the one
    # built on the best information.
    #
    # This costs Actions minutes, which is why it was not done earlier: on a
    # private repo the account has 2,000 minutes a month and the pipeline uses
    # about 11 per run. The repository is now public, and public repositories
    # get unlimited free Actions minutes, so the constraint that shaped the
    # old schedule no longer applies.
    - cron: '0 20 * * *'
    - cron: '30 22 * * *'
    # Backup window, 1 hour later. Added after verifying that the 14:30 slot
    # did NOT fire on its first scheduled day (13/13 runs to that point were
    # manual workflow_dispatch; the workflow was state:active and nothing was
    # holding the concurrency group). GitHub documents that scheduled runs are
    # delayed under load and can be dropped entirely, so a single daily window
    # is a single point of failure for the one thing that compounds here — the
    # accuracy record, which only grows if this runs unattended every day.
    #
    # Deliberately 15:30 UTC and not later: first pitch is ~18:10 UTC at the
    # earliest, so a backup run still generates picks pre-game. If BOTH windows
    # fire, the second is harmless and arguably better — it regenerates against
    # fresher confirmed lineups, and grade_results.py already de-duplicates by
    # date when writing results/history.json, so accuracy isn't double-counted.
    - cron: '30 15 * * *'
    # TWO MORE ATTEMPTS, because the schedule is the thing that has actually
    # been failing — not the code.
    #
    # Measured, not assumed: of the first 19 runs of this pipeline, only three
    # came from the schedule at all, and two of those were cancelled after
    # sitting fifteen minutes in the queue without ever being assigned a
    # runner (runner_id 0, empty runner_name, no steps array — the job never
    # started, so nothing in this repository could have prevented it). Every
    # other successful run was launched by hand.
    #
    # There is no fix on our side for a runner that never arrives. There is
    # only more chances to be assigned one. Public repositories get unlimited
    # Actions minutes, so extra attempts cost nothing, and the concurrency
    # group below means a slot that fires while another run is going queues
    # behind it rather than colliding. Spacing stays at 60+ minutes so this
    # never queues against itself.
    - cron: '0 17 * * *'
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (fast subset: lineups, injuries, weather, umpires) instead of the full ~15-20min pipeline"
        required: false
        type: boolean
        default: false
      skip_picks:
        description: "Skip the picks-scoring step (data package only) — useful when testing the data pull in isolation"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mlb-daily-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Speeds up reruns (Chadwick player-ID table, season-to-date FanGraphs/
      # Statcast pulls that don't change intraday). The save key includes
      # github.run_id, which is unique to this run, so it never collides with
      # an existing cache entry -- every run saves a brand-new one; the prior
      # comment here claimed this was "keyed by ISO week", which the key
      # expression below does not actually do (verified: no week/date
      # component in it at all). restore-keys' prefix match still warms the
      # cache from the single most recent prior run's save (freshest
      # available, never stale), so this isn't a correctness bug -- but it
      # does mean a new cache entry accumulates every single day with nothing
      # in this workflow ever reusing/overwriting a prior day's key, relying
      # entirely on GitHub's own account-level eviction (7-day-unused, 10GB
      # total) to bound growth rather than anything scoped here.
      - name: Cache pybaseball data
        uses: actions/cache@v4
        with:
          path: ~/.pybaseball/cache
          key: pybaseball-cache-${{ github.run_id }}
          restore-keys: |
            pybaseball-cache-

      - name: Grade yesterday's picks
        # Fetches yesterday's actual box scores and grades every pick this
        # pipeline made against them, before generating anything new — this is
        # the feedback loop that makes "more accurate over time" measurable
        # instead of a guess. Reads output/picks_YYYY-MM-DD.json (committed by
        # a prior run) and writes results/history.json. No-op if yesterday's
        # picks file doesn't exist (first run, or picks were skipped that day)
        # — never blocks the rest of the pipeline.
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: python3 grade_results.py

      - name: Measure signals against outcomes
        # The other half of the feedback loop. grade_results.py above settles
        # the ten published picks; this settles EVERY candidate that was
        # scored -- roughly 420 a day, persisted to data/players with their
        # individual signals -- and reports how well each signal separates
        # hits from misses.
        #
        # Seventeen signals are currently recorded without affecting any
        # score, on the promise that they would be measured before being
        # weighted. This step exists because ten graded picks a day cannot
        # resolve seventeen signals on its own, even now that nine of them
        # are ALSO measurable via a real backtest replay (fixed 2026-08-12 --
        # see backtest/engine.py and measure_signals.py's own docstring for
        # which nine, and the four that remain forward-only). It only gets
        # more decisive the longer it runs.
        #
        # Runs after grading so the box scores it needs are already final,
        # and never blocks the pipeline -- an empty result is the expected
        # answer on day one, not an error.
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: python3 measure_signals.py || true

      - name: Generate top 10 picks
        # Deterministic weighted scoring — no external API call, no LLM in the
        # loop, no secret to configure. Skipped on dry runs (no full data
        # package to score against yet) and when skip_picks is set.
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.skip_picks)) }}
        run: python3 generate_picks.py

      - name: Re-check the board for late scratches
        # quality_control() rejects a batter whose lineup was never confirmed,
        # but it runs ONCE, when picks are generated. This workflow generates
        # at 14:30, 15:30, 20:00 and 22:30 UTC; games start later. A player
        # confirmed in the early lineup and scratched in warmups was a valid
        # pick when made and is a dead bet by first pitch, and nothing looked
        # again.
        #
        # On the later runs this re-checks the board that already exists
        # against lineups as they stand now. It reports only — regenerating
        # the board would reshuffle nine correct picks against a partly
        # started slate, which is the hazard bettable_games() exists to
        # prevent.
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.skip_picks)) }}
        run: python3 check_scratches.py || true

      - name: Build the value board against live prices
        # The board that actually gets bet, and until now it only existed if
        # someone ran it by hand. generate_picks.py ranks by chance of
        # cashing; this takes those same scored candidates, pairs them with
        # FanDuel's live prices, and tiers what is worth taking at what the
        # market is charging — including the home-run section.
        #
        # Written to output/ so it is committed with the board rather than
        # living only in a log that scrolls past.
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.skip_picks)) }}
        run: |
          python3 value_board.py --json output/value_board_$(date -u +'%F').json || true

      - name: Settle the value screen against captured prices
        # THE FORWARD TEST, and it has never once run.
        #
        # Its own docstring is explicit that prices cannot be backfilled and
        # that the screen can only ever be judged forward, against prices
        # captured live — which is exactly why prop_snapshot.py runs hourly.
        # That capture has been accumulating and nothing has ever settled it,
        # so the screen's central claim has gone untested since the day it
        # was written.
        #
        # Refuses to call a verdict under 200 settled bets on its own, so
        # running it daily costs nothing and simply lets the record build.
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: python3 grade_value.py || true

      - name: Commit picks immediately
        # PICKS ARE COMMITTED BEFORE THE LONG REPORT RUNS, deliberately.
        #
        # Two scheduled runs on 2026-08-06 were cancelled by the runner at
        # almost exactly 15 minutes, mid-pipeline. Successful runs take 5-8
        # minutes, and the job timeout is 35, so nothing in this workflow
        # explains the cut-off -- but the consequence was entirely of our own
        # making: the single commit step ran last, so a run killed partway
        # through delivered NOTHING, even though the picks themselves had
        # already been computed.
        #
        # generate_picks.py imports functions from mlb_daily.py but never reads
        # its output files -- it fetches its own lineups and stats -- so the
        # picks do not depend on the 88-section report in any way. Ordering
        # picks first and committing them straight away means a run that dies
        # later still delivers the part that is actually bet on. The report is
        # valuable, but it is not what gets read at 9am.
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.skip_picks)) }}
        run: |
          shopt -s nullglob
          git config user.name "mlb-pipeline-bot"
          git config user.email "actions@github.com"
          # picks_DATE_TIMESTAMP.json archives are included by the glob above.
          # They are the record of every board generated that day, kept because
          # a later run overwrites the live file and the earlier board may be
          # the one that was actually bet.
          #
          # board_*.html / full_board_*.html / parlay_example_*.html WERE
          # MISSING FROM THIS LIST ENTIRELY. Found by checking git history
          # for output/*.html: every commit that ever touched one, in this
          # repo's entire history, was a manual `git add -A` during
          # development -- never this workflow. generate_picks.py has been
          # writing all three every single scheduled run since they were
          # built (render_board.py, render_full_board.py, the example-parlay
          # step), and every one was silently discarded at the end of the
          # job, recoverable only from that run's GitHub Actions artifact
          # bundle (limited retention, not part of the permanent record) --
          # never actually reaching the repo a real "check tonight's board"
          # visit would read. These are exactly "what gets read before
          # betting", the same standard as the JSON/markdown already here,
          # so they belong in this step, not the secondary report commit.
          git add output/top10_picks_*.md output/picks_*.json output/scratches_*.json output/value_board_*.json output/early_look_*.md output/board_*.html output/full_board_*.html output/parlay_example_*.html results/*.json data/players/*.json
          if git diff --cached --quiet; then
            echo "No picks to commit."
            exit 0
          fi
          git commit -m "Picks $(date -u +%F)"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed picks on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) — rebasing onto origin/main."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Rebase conflict while committing picks — aborting."
              git rebase --abort
              exit 1
            fi
          done
          echo "::error::Failed to push picks after 5 attempts."
          exit 1

      - name: Run daily pipeline
        env:
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
        run: python3 mlb_daily.py

      - name: Commit the full report
        # Skip committing on dry runs — those are for validating the pipeline
        # mechanics, not for adding to the daily-package history.
        # Picks are already safely committed by the step above, so a
        # failure here costs the report only -- never the picks.
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          # nullglob: an unmatched glob (e.g. results/*.json before any grading has
          # run) expands to nothing instead of being passed to git add literally —
          # verified live that without this, "git add results/*.json" with zero
          # matches fails hard under this step's `bash -e` and aborts the whole
          # commit, silently dropping every other file the step meant to add too.
          shopt -s nullglob
          git config user.name "mlb-pipeline-bot"
          git config user.email "actions@github.com"
          git add output/mlb_daily_*.txt output/run_log_*.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Daily MLB data package $(date -u +%F)"
          # Retry with rebase on push rejection: verified live that a manual
          # push to main landing while this run was mid-flight (~15-20 min of
          # work) causes a plain `git push` to be rejected outright here,
          # silently discarding the whole run's generated output since the
          # rejection wasn't handled at all. Most of the time a manual/code
          # push touches different files than this step's output files, so
          # the rebase applies cleanly. But that's not guaranteed -- a manual
          # or bug-fix commit CAN touch the same results/*.json files this
          # step also writes (e.g. a grade_results.py fix that re-grades and
          # commits a corrected results/history.json directly, which happened
          # for real during this project's own development). Reproduced that
          # exact case locally (two branches editing the same JSON line):
          # `git rebase origin/main` fails with a real CONFLICT as expected,
          # the check below catches it, and `git rebase --abort` leaves the
          # working tree clean (verified via `git status` after) rather than
          # half-rebased -- so aborting loudly here is a tested, safe outcome,
          # not a guess, even though it does mean this run's output is lost
          # and must be picked up by the next scheduled run or a manual retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) — main moved while this run was working. Rebasing onto origin/main and retrying."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Rebase hit a real conflict — aborting rather than leaving the repo in a broken state. This run's generated output was NOT saved."
              git rebase --abort
              exit 1
            fi
          done
          echo "::error::Failed to push generated output after 5 attempts."
          exit 1

      - name: Upload run artifacts
        # EVERY FILE IN THIS GLOB IS ALSO COMMITTED TO GIT, ABOVE, IN THE
        # SAME JOB (either "Commit picks immediately" or "Commit the full
        # report"). This upload buys exactly one thing over that: a one-click
        # zip of a specific run from the Actions UI, without checking out
        # git. It does not buy durability -- git already has that, with no
        # retention limit.
        #
        # At the old 14-day retention, that redundant convenience was
        # costing real money: ~6 runs/day x ~5.1MB x 14 days = ~430MB against
        # this account's 500MB free Actions-storage quota (measured 2026-08-12
        # via the GitHub storage-usage warning, which hit 90% -- confirmed by
        # checking several recent runs' actual artifact sizes, not guessed).
        # Public-repo Actions MINUTES are unlimited (see the schedule
        # comment above); Actions STORAGE is not, and this step was the
        # entire cause. 3 days keeps the quick-access convenience for
        # same-week debugging at roughly a 5x smaller footprint (~90MB
        # steady-state) with real headroom to spare.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-daily-output-${{ github.run_id }}
          path: |
            output/mlb_daily_*.txt
            output/run_log_*.json
            output/top10_picks_*.md
            output/picks_*.json
            output/board_*.html
            output/full_board_*.html
            output/parlay_example_*.html
            results/*.json
          retention-days: 3
          if-no-files-found: ignore
