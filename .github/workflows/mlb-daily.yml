name: MLB Daily Pipeline

on:
  schedule:
    # 14:30 UTC = 10:30 AM EDT. MLB's regular season runs entirely within U.S.
    # daylight saving time (late March - early October), so this cron is
    # accurate for the season. It will run at 9:30 AM CT-equivalent (10:30 AM
    # EST) if ever triggered outside DST (e.g. a manual re-run in November) —
    # see README for the tradeoff; resolving DST dynamically in cron YAML
    # isn't worth the complexity for a two-outing-a-year edge case.
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (fast subset: lineups, injuries, weather, umpires) instead of the full ~15-20min pipeline"
        required: false
        type: boolean
        default: false
      skip_picks:
        description: "Skip the picks-scoring step (data package only) — useful when testing the data pull in isolation"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mlb-daily-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Speeds up reruns (Chadwick player-ID table, season-to-date FanGraphs/
      # Statcast pulls that don't change intraday). The save key includes
      # github.run_id, which is unique to this run, so it never collides with
      # an existing cache entry -- every run saves a brand-new one; the prior
      # comment here claimed this was "keyed by ISO week", which the key
      # expression below does not actually do (verified: no week/date
      # component in it at all). restore-keys' prefix match still warms the
      # cache from the single most recent prior run's save (freshest
      # available, never stale), so this isn't a correctness bug -- but it
      # does mean a new cache entry accumulates every single day with nothing
      # in this workflow ever reusing/overwriting a prior day's key, relying
      # entirely on GitHub's own account-level eviction (7-day-unused, 10GB
      # total) to bound growth rather than anything scoped here.
      - name: Cache pybaseball data
        uses: actions/cache@v4
        with:
          path: ~/.pybaseball/cache
          key: pybaseball-cache-${{ github.run_id }}
          restore-keys: |
            pybaseball-cache-

      - name: Grade yesterday's picks
        # Fetches yesterday's actual box scores and grades every pick this
        # pipeline made against them, before generating anything new — this is
        # the feedback loop that makes "more accurate over time" measurable
        # instead of a guess. Reads output/picks_YYYY-MM-DD.json (committed by
        # a prior run) and writes results/history.json. No-op if yesterday's
        # picks file doesn't exist (first run, or picks were skipped that day)
        # — never blocks the rest of the pipeline.
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: python3 grade_results.py

      - name: Run daily pipeline
        env:
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
        run: python3 mlb_daily.py

      - name: Generate top 10 picks
        # Deterministic weighted scoring — no external API call, no LLM in the
        # loop, no secret to configure. Skipped on dry runs (no full data
        # package to score against yet) and when skip_picks is set.
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.skip_picks)) }}
        run: python3 generate_picks.py

      - name: Commit generated output
        # Skip committing on dry runs — those are for validating the pipeline
        # mechanics, not for adding to the daily-package history.
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          # nullglob: an unmatched glob (e.g. results/*.json before any grading has
          # run) expands to nothing instead of being passed to git add literally —
          # verified live that without this, "git add results/*.json" with zero
          # matches fails hard under this step's `bash -e` and aborts the whole
          # commit, silently dropping every other file the step meant to add too.
          shopt -s nullglob
          git config user.name "mlb-pipeline-bot"
          git config user.email "actions@github.com"
          git add output/mlb_daily_*.txt output/run_log_*.json output/top10_picks_*.md output/picks_*.json results/*.json data/players/*.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Daily MLB data package + picks $(date -u +%F)"
          # Retry with rebase on push rejection: verified live that a manual
          # push to main landing while this run was mid-flight (~15-20 min of
          # work) causes a plain `git push` to be rejected outright here,
          # silently discarding the whole run's generated output since the
          # rejection wasn't handled at all. Most of the time a manual/code
          # push touches different files than this step's output files, so
          # the rebase applies cleanly. But that's not guaranteed -- a manual
          # or bug-fix commit CAN touch the same results/*.json files this
          # step also writes (e.g. a grade_results.py fix that re-grades and
          # commits a corrected results/history.json directly, which happened
          # for real during this project's own development). Reproduced that
          # exact case locally (two branches editing the same JSON line):
          # `git rebase origin/main` fails with a real CONFLICT as expected,
          # the check below catches it, and `git rebase --abort` leaves the
          # working tree clean (verified via `git status` after) rather than
          # half-rebased -- so aborting loudly here is a tested, safe outcome,
          # not a guess, even though it does mean this run's output is lost
          # and must be picked up by the next scheduled run or a manual retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) — main moved while this run was working. Rebasing onto origin/main and retrying."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Rebase hit a real conflict — aborting rather than leaving the repo in a broken state. This run's generated output was NOT saved."
              git rebase --abort
              exit 1
            fi
          done
          echo "::error::Failed to push generated output after 5 attempts."
          exit 1

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-daily-output-${{ github.run_id }}
          path: |
            output/mlb_daily_*.txt
            output/run_log_*.json
            output/top10_picks_*.md
            output/picks_*.json
            results/*.json
          retention-days: 14
          if-no-files-found: ignore
