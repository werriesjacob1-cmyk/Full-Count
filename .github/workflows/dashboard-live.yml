name: Dashboard Live Update

# The sole writer of docs/live.json. Grading and pricing run sequentially
# against one checkout so their field-level deltas cannot race. Each channel
# is failure-isolated: a failed grader still permits a valid price update to
# commit, and a failed price fetch still permits a valid lifecycle result.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Default single-pending semantics deliberately coalesce obsolete five-
  # minute observations instead of building an hours-long queue.
  group: dashboard-live-observation
  cancel-in-progress: false

jobs:
  update-live-state:
    runs-on: ubuntu-latest
    # Verified live across 3 fix attempts (runs 102/103/104): the
    # sparse-checkout + filter:blob:none fixes above got "Checkout repo"
    # down to 3s and materially shrank "Commit and push live state", but
    # run 104 still finished at 10m34s and got cancelled -- every single
    # step succeeded, it was ~34s over budget. Grading (2m38s) + repricing
    # (2m41s) alone took 5m19s on 2026-08-20 (docs/data.json was 1075
    # props, 1.6MB; each grades a real MLB boxscore check), leaving too
    # little room for the push-retry loop given how many OTHER workflows
    # commit to main every few minutes.
    #
    # 2026-08-25 incident follow-up: that same measurement had regrown to
    # ~15 minutes combined in 5 days (run 267's own job log: "Grade
    # published Top Picks" 7m34s, "Reprice pregame candidates" cancelled
    # mid-step at 7m31s in) -- consuming the ENTIRE 15-minute budget before
    # "Commit and push live state" could even finish, and this was the
    # dominant cause of that day's long streak of cancelled scheduled runs
    # (a real, separate mechanism from the live-freshness-watchdog.yml
    # scheduler-gap fix added the same day). Bumped again on the same
    # "give it the headroom the real, demonstrated workload needs" basis
    # as the prior three fixes -- not a git inefficiency, not something a
    # fourth checkout optimization would touch. If this keeps regrowing,
    # that points at grading/repricing's own per-prop cost (docs/data.json
    # size, or MLB boxscore-check latency) needing investigation, which is
    # out of scope for a workflow-YAML freshness fix.
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          # sparse-checkout alone only limits what's MATERIALIZED into the
          # working tree -- it does not stop `git fetch` from downloading
          # blob content for paths outside it. Verified live: run 102
          # (sparse-checkout, no filter) still took 11m25s and got
          # cancelled, even though "Checkout repo" itself dropped to 3s --
          # "Commit and push live state" was still slow because its retry
          # loop's `git fetch origin main` calls kept pulling full
          # data/props/data/odds blob history from the many other
          # workflows committing to main every few minutes. filter:
          # blob:none makes this a real partial clone: blobs outside the
          # sparse-checkout cone are never fetched at all (not "fetched
          # then discarded"), so every retry's fetch+checkout stays cheap
          # regardless of how large data/props/ grows.
          filter: blob:none
          # This job only ever reads/writes docs/, results/, dashboard/, and
          # data/public_top_picks/ (root-level *.py modules come along for
          # free in cone mode). data/props/ and data/odds/ are multi-hundred-
          # MB daily snapshot dumps this job never touches -- materializing
          # them on every 5-minute run (and again on every push-retry
          # attempt below) is what pushed runtime past timeout-minutes: 10.
          sparse-checkout: |
            dashboard
            docs
            results
            data/public_top_picks
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install live-update dependencies
        # Statcast-only final markets remain retryable for the durable daily
        # grader; five-minute threshold/status work does not initialize pandas
        # and pybaseball on every observation.
        run: pip install --quiet 'requests~=2.34.2' 'mlb-statsapi~=1.9.0'

      - name: Grade published Top Picks
        id: grades
        continue-on-error: true
        run: |
          if [ ! -f docs/data.json ]; then
            echo "docs/data.json does not exist yet; nothing to grade."
            exit 0
          fi
          python3 dashboard/refresh_grades.py

      - name: Reprice pregame candidates
        id: prices
        continue-on-error: true
        run: |
          if [ ! -f docs/data.json ]; then
            echo "docs/data.json does not exist yet; nothing to reprice."
            exit 0
          fi
          python3 dashboard/refresh_prices.py

      - name: Commit and push live state
        if: always()
        run: |
          git config user.name "mlb-pipeline-bot"
          git config user.email "actions@github.com"
          if [ ! -f docs/live.json ]; then
            echo "No live state was produced."
            exit 0
          fi
          cp docs/live.json "$RUNNER_TEMP/live-candidate.json"
          git restore docs/live.json
          for attempt in 1 2 3 4 5; do
            # Both a stale checkout and a push rejection re-read current main,
            # then semantically merge by per-field recency/result authority.
            git fetch origin main
            git checkout --detach origin/main
            python3 dashboard/merge_live_files.py \
              --base docs/live.json --incoming "$RUNNER_TEMP/live-candidate.json" \
              --out docs/live.json --data docs/data.json \
              --registry data/public_top_picks/registry.json --results-dir results
            git add docs/live.json
            if git diff --cached --quiet; then
              echo "No newer live-state change to publish."
              exit 0
            fi
            git commit -m "Dashboard live update $(date -u +'%F %H:%M') UTC"
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5); rereading and merging current main."
          done
          echo "::error::Failed to push live state after 5 attempts."
          exit 1

      - name: Report partial live-update failure
        if: always() && (steps.grades.outcome == 'failure' || steps.prices.outcome == 'failure')
        run: |
          echo "::error::At least one live channel failed. Any successful channel was preserved and committed."
          exit 1
