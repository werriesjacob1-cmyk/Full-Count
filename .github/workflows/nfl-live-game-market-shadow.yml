name: NFL Live Game-Market Shadow Board

# Research-only prospective spread/total evidence capture.
# Discovers the full target-date FanDuel NFL slate, builds strictly-prior B0
# control predictions, binds them to real FanDuel lines/prices, seals each
# event, and emits a full-slate manifest with explicit NO_PLAY accounting.
#
# No public picks, no model promotion, no commit/push of generated evidence.
on:
  schedule:
    # Sunday kickoff waves in UTC. Multiple pregame vintages are intentional.
    - cron: '40 15 * * 0'
    - cron: '50 16 * * 0'
    - cron: '5 19 * * 0'
    - cron: '55 19 * * 0'
    - cron: '15 20 * * 0'
    - cron: '0 23 * * 0'
    - cron: '10 0 * * 1'
    # Non-Sunday waves (claude/nfl-non-sunday-waves-20261121, NFL-NONSUNDAY-WAVES-20261121).
    # Each game gets one wave ~10 min after its 90-min inactives deadline and
    # one final pre-lock wave ~10 min before kickoff (kickoffs: ESPN, EST).
    # Chicago slate date for these waves is set by the "Resolve Chicago slate
    # date" step; Sunday waves above are untouched.
    # Mon/Thu 19:15 CT games (kickoff 01:15Z the next UTC day), every week:
    - cron: '55 23 * * 1,4'
    - cron: '5 1 * * 2,5'
    # Wed 2026-11-25 19:00 CT
    - cron: '40 23 25 11 *'
    - cron: '50 0 26 11 *'
    # Thanksgiving 2026-11-26 12:00 CT and 15:30 CT (the 19:20 CT game uses the Thu waves)
    - cron: '40 16 26 11 *'
    - cron: '50 17 26 11 *'
    - cron: '10 20 26 11 *'
    - cron: '20 21 26 11 *'
    # Black Friday 2026-11-27 14:00 CT
    - cron: '40 18 27 11 *'
    - cron: '50 19 27 11 *'
    # Sat 2026-12-19 16:00 CT and 19:20 CT
    - cron: '40 20 19 12 *'
    - cron: '50 21 19 12 *'
    - cron: '0 0 20 12 *'
    - cron: '10 1 20 12 *'
    # Fri 2026-12-25 12:00 CT, 15:30 CT, 19:15 CT
    - cron: '40 16 25 12 *'
    - cron: '50 17 25 12 *'
    - cron: '10 20 25 12 *'
    - cron: '20 21 25 12 *'
    - cron: '55 23 25 12 *'
    - cron: '5 1 26 12 *'
  push:
    branches:
      - superchad/nfl-live-game-market-shadow-20260918
    paths:
      - nfl/prospective/game_market_shadow_board.py
      - nfl/prospective/live_game_market_shadow.py
      - nfl/tests/test_game_market_shadow_board.py
      - .github/workflows/nfl-live-game-market-shadow.yml
  workflow_dispatch:
    inputs:
      target_local_date:
        description: 'Chicago local slate date (YYYY-MM-DD); blank = upcoming Sunday'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: nfl-live-game-market-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install NFL dependencies only
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r nfl/requirements-nfl.txt
          python3 -m pip install 'requests~=2.34.2'

      - name: Run bridge unit tests
        run: |
          PYTHONPATH=. python3 nfl/tests/test_game_market_snapshot.py
          PYTHONPATH=. python3 nfl/tests/test_game_market_shadow_board.py
          PYTHONPATH=. python3 nfl/tests/test_game_market_b0.py
          PYTHONPATH=. python3 nfl/tests/test_scoring_prior_features.py

      - name: Resolve Chicago slate date for non-Sunday waves
        id: slate
        if: github.event_name == 'schedule'
        run: |
          # Scheduled waves for Mon/Wed/Thu/Fri/Sat games target that Chicago
          # calendar day. Sunday waves, and the 00:10Z Monday wave (still
          # Sunday in Chicago), leave the date blank so the existing
          # "upcoming Sunday" derivation is unchanged.
          dow="$(TZ=America/Chicago date +%u)"
          case "$dow" in
            1|3|4|5|6)
              echo "target_local_date=$(TZ=America/Chicago date +%F)" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Build live full-slate shadow board
        env:
          FULL_COUNT_CODE_SHA: ${{ github.sha }}
          TARGET_LOCAL_DATE: ${{ inputs.target_local_date || steps.slate.outputs.target_local_date }}
          OUTPUT_DIR: /tmp/nfl-game-market-shadow
        run: |
          PYTHONPATH=. python3 nfl/prospective/live_game_market_shadow.py

      - name: Assert full-slate accounting
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/nfl-game-market-shadow/slate_manifest.json')
          data = json.loads(p.read_text())
          discovered = data['discovered_event_count']
          accounted = data['accounted_event_count']
          if discovered != accounted:
              raise SystemExit(f'coverage mismatch: {accounted}/{discovered}')
          if discovered < 1:
              raise SystemExit('no events discovered')
          missing = [
              e for e in data['events']
              if e.get('status') not in {'BOARD_BUILT', 'NO_PLAY'}
          ]
          if missing:
              raise SystemExit(f'unaccounted event states: {missing}')
          print({
              'target_local_date': data['target_local_date'],
              'discovered': discovered,
              'accounted': accounted,
              'event_board_built': sum(e['status'] == 'BOARD_BUILT' for e in data['events']),
              'event_no_play': sum(e['status'] == 'NO_PLAY' for e in data['events']),
              'market_decision_counts': data['market_decision_counts'],
              'manifest_sha256': data['manifest_sha256'],
          })
          PY

      - name: Upload prospective evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-game-market-shadow-${{ github.run_id }}
          path: /tmp/nfl-game-market-shadow
          if-no-files-found: error
          retention-days: 30
