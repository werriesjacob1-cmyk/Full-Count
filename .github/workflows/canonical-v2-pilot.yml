name: Canonical V2 Full Range

on:
  push:
    branches:
      - superchad/canonical-v2-provenance-runner-01
    paths:
      - engineering/CANONICAL_V2_PILOT_TRIGGER

permissions:
  contents: read

concurrency:
  group: canonical-v2-full-range
  cancel-in-progress: false

env:
  CANONICAL_RUN_ID: canonical-v2-full-${{ github.sha }}
  CANONICAL_START: "2024-04-01"
  CANONICAL_END: "2026-08-25"
  SHARD_COUNT: "4"
  SCIENTIFIC_PARENT_SHA: fc589447ec157bff9a96071edc3ceb6c7dc734eb
  PREDICTOR_SHA: 85c41d79570ac25169726419ed2bcb55cbba78139e8786b6005f71f40a877685
  OUTCOME_SHA: 03fe66c5035b1e139216cf2f56ec276bf82bdea341febbbebc0406f4d3c6b98f

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for exact-head Test Suite
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for Test Suite on exact SHA $GITHUB_SHA"
          for attempt in $(seq 1 46); do
            payload="$(curl -fsSL -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=push&per_page=100")"
            row="$(printf '%s' "$payload" | jq -r --arg sha "$GITHUB_SHA" '
              .workflow_runs[]
              | select(.name == "Test Suite" and .head_sha == $sha)
              | [.status, (.conclusion // ""), (.id|tostring)]
              | @tsv
            ' | head -n1)"
            if [ -z "$row" ]; then
              echo "[$attempt] exact-head Test Suite not visible yet"
              sleep 45
              continue
            fi
            IFS=$'\t' read -r status conclusion run_id <<<"$row"
            echo "[$attempt] Test Suite run=$run_id status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "EXACT_HEAD_TEST_SUITE_GREEN sha=$GITHUB_SHA run=$run_id"
                exit 0
              fi
              echo "Exact-head Test Suite failed: conclusion=$conclusion run=$run_id" >&2
              exit 1
            fi
            sleep 45
          done
          echo "Timed out waiting for exact-head Test Suite" >&2
          exit 1

  prepare-sources:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact generation head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up exact canonical Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
          cache: pip

      - name: Install exact canonical environment
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install --upgrade --force-reinstall             numpy==2.4.6             pandas==3.0.5             pyarrow==25.0.1             pybaseball==2.2.7             python-dateutil==2.9.0.post0             requests==2.34.2             scikit-learn==1.9.0             scipy==1.17.1
          python - <<'PY'
          import json
          from backtest.canonical_durability import environment_identity
          from backtest.canonical_v2_certify import (
              EXPECTED_CRITICAL_PACKAGES,
              EXPECTED_PYTHON,
          )
          env = environment_identity()
          if env["python_version"] != EXPECTED_PYTHON:
              raise SystemExit(
                  f"Python mismatch {env['python_version']} != {EXPECTED_PYTHON}"
              )
          for name, expected in EXPECTED_CRITICAL_PACKAGES.items():
              actual = env["critical_packages"].get(name)
              if actual != expected:
                  raise SystemExit(
                      f"critical package mismatch {name}={actual} expected={expected}"
                  )
          print(json.dumps(env, sort_keys=True))
          PY

      - name: Materialize and bind both Statcast sources once
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/canonical-v2-sources
          mkdir -p             /tmp/canonical-v2-sources/predictor             /tmp/canonical-v2-sources/outcome

          git fetch origin canonical-durable-checkpoints
          git show             origin/canonical-durable-checkpoints:canonical/canonical-20260828T153143Z-2b79304f/source/statcast_2024_through_2026-08-24.parquet             > /tmp/canonical-v2-sources/predictor/statcast_2024_through_2026-08-24.parquet
          predictor_actual="$(sha256sum /tmp/canonical-v2-sources/predictor/statcast_2024_through_2026-08-24.parquet | awk '{print $1}')"
          test "$predictor_actual" = "$PREDICTOR_SHA"

          python - <<'PY'
          import hashlib
          import json
          import os
          import pandas as pd
          from pybaseball import statcast

          expected = os.environ["OUTCOME_SHA"]
          day = "2026-08-25"
          columns = [
              "game_date",
              "game_pk",
              "batter",
              "events",
              "launch_speed",
              "hit_distance_sc",
          ]
          frame = statcast(start_dt=day, end_dt=day)
          if frame is None or frame.empty:
              raise SystemExit("outcome-only Statcast fetch returned no rows")
          missing = [c for c in columns if c not in frame.columns]
          if missing:
              raise SystemExit(f"outcome-only source missing columns: {missing}")
          out = frame[columns].copy()
          parsed = pd.to_datetime(out["game_date"], errors="coerce")
          coverage = sorted({value.date().isoformat() for value in parsed.dropna()})
          if coverage != [day]:
              raise SystemExit(f"outcome-only coverage mismatch: {coverage}")
          out["game_date"] = parsed.dt.date.astype(str)
          out = out.sort_values(
              ["game_pk", "batter", "events", "launch_speed", "hit_distance_sc"],
              kind="mergesort",
              na_position="last",
          ).reset_index(drop=True)
          path = (
              "/tmp/canonical-v2-sources/outcome/"
              "statcast_outcome_2026-08-25.parquet"
          )
          out.to_parquet(path, index=False)
          actual = hashlib.sha256(open(path, "rb").read()).hexdigest()
          if actual != expected:
              raise SystemExit(
                  f"outcome-only Statcast SHA drift: {actual} != {expected}"
              )
          manifest = {
              "predictor_sha256": os.environ["PREDICTOR_SHA"],
              "outcome_sha256": actual,
              "outcome_rows": int(len(out)),
              "outcome_game_count": int(out["game_pk"].dropna().nunique()),
              "outcome_date_coverage": f"{day}..{day}",
              "outcome_schema_columns": sorted(columns),
              "generation_sha": os.environ["GITHUB_SHA"],
          }
          with open(
              "/tmp/canonical-v2-sources/source_manifest.json",
              "w",
              encoding="utf-8",
          ) as handle:
              json.dump(manifest, handle, indent=2, sort_keys=True)
              handle.write("\n")
          print(json.dumps(manifest, sort_keys=True))
          PY

      - name: Upload single bound source package
        uses: actions/upload-artifact@v4
        with:
          name: canonical-v2-bound-sources
          path: /tmp/canonical-v2-sources
          if-no-files-found: error
          retention-days: 90

  shard:
    needs: prepare-sources
    name: shard-${{ matrix.shard }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout exact generation head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up exact canonical Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
          cache: pip

      - name: Install exact canonical environment
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install --upgrade --force-reinstall             numpy==2.4.6             pandas==3.0.5             pyarrow==25.0.1             pybaseball==2.2.7             python-dateutil==2.9.0.post0             requests==2.34.2             scikit-learn==1.9.0             scipy==1.17.1
          python - <<'PY'
          from backtest.canonical_durability import environment_identity
          from backtest.canonical_v2_certify import (
              EXPECTED_CRITICAL_PACKAGES,
              EXPECTED_PYTHON,
          )
          env = environment_identity()
          assert env["python_version"] == EXPECTED_PYTHON, env
          for name, expected in EXPECTED_CRITICAL_PACKAGES.items():
              assert env["critical_packages"].get(name) == expected, (name, env)
          print(env["environment_fingerprint"])
          print(env["pip_freeze_sha256"])
          PY

      - name: Download the one bound source package
        uses: actions/download-artifact@v4
        with:
          name: canonical-v2-bound-sources
          path: /tmp/canonical-v2-sources

      - name: Reverify source bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum /tmp/canonical-v2-sources/predictor/statcast_2024_through_2026-08-24.parquet | awk '{print $1}')" = "$PREDICTOR_SHA"
          test "$(sha256sum /tmp/canonical-v2-sources/outcome/statcast_outcome_2026-08-25.parquet | awk '{print $1}')" = "$OUTCOME_SHA"

      - name: Generate deterministic shard
        shell: bash
        run: |
          set -euo pipefail
          out="/tmp/canonical-v2-shard-${{ matrix.shard }}"
          rm -rf "$out"
          mkdir -p "$out"
          python backtest/canonical_v2_shard.py             --run-id "$CANONICAL_RUN_ID"             --start "$CANONICAL_START"             --end "$CANONICAL_END"             --shard-index "${{ matrix.shard }}"             --shard-count "$SHARD_COUNT"             --source-parquet /tmp/canonical-v2-sources/predictor/statcast_2024_through_2026-08-24.parquet             --expected-source-sha256 "$PREDICTOR_SHA"             --outcome-parquet /tmp/canonical-v2-sources/outcome/statcast_outcome_2026-08-25.parquet             --expected-outcome-sha256 "$OUTCOME_SHA"             --outcome-date 2026-08-25             --scientific-parent-sha "$SCIENTIFIC_PARENT_SHA"             --out-dir "$out"             --archive-http-bodies             --sleep 0.25             --verbose

      - name: Upload shard evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-v2-shard-${{ matrix.shard }}
          path: /tmp/canonical-v2-shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

  consolidate:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact generation head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up exact canonical Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
          cache: pip

      - name: Install exact canonical environment
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install --upgrade --force-reinstall             numpy==2.4.6             pandas==3.0.5             pyarrow==25.0.1             pybaseball==2.2.7             python-dateutil==2.9.0.post0             requests==2.34.2             scikit-learn==1.9.0             scipy==1.17.1

      - name: Download bound sources
        uses: actions/download-artifact@v4
        with:
          name: canonical-v2-bound-sources
          path: /tmp/canonical-v2-sources

      - name: Download shard 0
        uses: actions/download-artifact@v4
        with:
          name: canonical-v2-shard-0
          path: /tmp/canonical-v2-shards/shard-0
      - name: Download shard 1
        uses: actions/download-artifact@v4
        with:
          name: canonical-v2-shard-1
          path: /tmp/canonical-v2-shards/shard-1
      - name: Download shard 2
        uses: actions/download-artifact@v4
        with:
          name: canonical-v2-shard-2
          path: /tmp/canonical-v2-shards/shard-2
      - name: Download shard 3
        uses: actions/download-artifact@v4
        with:
          name: canonical-v2-shard-3
          path: /tmp/canonical-v2-shards/shard-3

      - name: Independently consolidate all four shards
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/canonical-v2-consolidated
          python backtest/canonical_v2_consolidate.py             --shards-root /tmp/canonical-v2-shards             --out-dir /tmp/canonical-v2-consolidated             --run-id "$CANONICAL_RUN_ID"             --start "$CANONICAL_START"             --end "$CANONICAL_END"             --shard-count "$SHARD_COUNT"             --source-parquet /tmp/canonical-v2-sources/predictor/statcast_2024_through_2026-08-24.parquet             --outcome-parquet /tmp/canonical-v2-sources/outcome/statcast_outcome_2026-08-25.parquet             --require-body-archive

      - name: Upload uncertified consolidated package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-v2-consolidated-${{ github.sha }}
          path: /tmp/canonical-v2-consolidated
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

  certify:
    needs: consolidate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact generation head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up exact canonical Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
          cache: pip

      - name: Install exact canonical environment
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install --upgrade --force-reinstall             numpy==2.4.6             pandas==3.0.5             pyarrow==25.0.1             pybaseball==2.2.7             python-dateutil==2.9.0.post0             requests==2.34.2             scikit-learn==1.9.0             scipy==1.17.1

      - name: Download consolidated package into a fresh job
        uses: actions/download-artifact@v4
        with:
          name: canonical-v2-consolidated-${{ github.sha }}
          path: /tmp/canonical-v2-final

      - name: Independently certify the transferred package
        shell: bash
        run: |
          set -euo pipefail
          python backtest/canonical_v2_certify.py             /tmp/canonical-v2-final             --repo-root "$GITHUB_WORKSPACE"             --expected-parent-sha "$SCIENTIFIC_PARENT_SHA"             --expected-source-sha "$PREDICTOR_SHA"             --expected-outcome-source-sha "$OUTCOME_SHA"             --output /tmp/canonical-v2-final/certification_report.json

      - name: Upload final self-contained evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-v2-final-${{ github.sha }}
          path: /tmp/canonical-v2-final
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
