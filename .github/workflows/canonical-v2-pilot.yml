name: Canonical V2 Pilot

on:
  push:
    branches:
      - superchad/canonical-v2-provenance-runner-01
    paths:
      - engineering/CANONICAL_V2_PILOT_TRIGGER

permissions:
  contents: read

concurrency:
  group: canonical-v2-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout provenance runner
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Materialize exact bound Statcast source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fc-source
          git fetch origin canonical-durable-checkpoints
          git show origin/canonical-durable-checkpoints:canonical/canonical-20260828T153143Z-2b79304f/source/statcast_2024_through_2026-08-24.parquet             > /tmp/fc-source/statcast_2024_through_2026-08-24.parquet
          actual="$(sha256sum /tmp/fc-source/statcast_2024_through_2026-08-24.parquet | awk '{print $1}')"
          expected="85c41d79570ac25169726419ed2bcb55cbba78139e8786b6005f71f40a877685"
          echo "source_sha256=$actual"
          test "$actual" = "$expected"

      - name: Run one-date provenance pilot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/canonical-v2-pilot
          python backtest/canonical_v2_shard.py             --run-id canonical-v2-pilot-20250820             --start 2025-08-20             --end 2025-08-20             --shard-index 0             --shard-count 1             --source-parquet /tmp/fc-source/statcast_2024_through_2026-08-24.parquet             --expected-source-sha256 85c41d79570ac25169726419ed2bcb55cbba78139e8786b6005f71f40a877685             --scientific-parent-sha fc589447ec157bff9a96071edc3ceb6c7dc734eb             --out-dir /tmp/canonical-v2-pilot             --archive-http-bodies             --verbose

      - name: Inspect pilot evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /tmp/canonical-v2-pilot ]; then
            du -sh /tmp/canonical-v2-pilot || true
            find /tmp/canonical-v2-pilot -type f | wc -l
            if [ -f /tmp/canonical-v2-pilot/shard_summary.json ]; then
              cat /tmp/canonical-v2-pilot/shard_summary.json
            fi
          fi

      - name: Upload complete pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-v2-pilot-20250820
          path: /tmp/canonical-v2-pilot
          if-no-files-found: error
          retention-days: 90
