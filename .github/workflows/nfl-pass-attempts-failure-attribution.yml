name: NFL Pass Attempts Failure Attribution

# Research-only postmortem of rejected generic B1 pass-attempt rescaling.
# No tuning, no challenger, no promotion.
on:
  push:
    branches:
      - superchad/nfl-foundation-continuation-20260911
    paths:
      - .github/workflows/nfl-pass-attempts-failure-attribution.yml
      - nfl/research/b1_alignment.py
      - nfl/research/b1_attribution.py
      - nfl/research/b1_history.py
      - nfl/research/b1_evaluate.py
      - nfl/research/b1_team_opportunity.py
      - nfl/research/nflverse_history.py

permissions:
  contents: read

jobs:
  attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install 'requests~=2.34.2'

      - name: Attribute rejected pass-attempt rescaling
        env:
          FULL_COUNT_CODE_SHA: ${{ github.sha }}
        run: |
          PYTHONPATH=. python3 - <<'PY'
          import csv
          import hashlib
          import io
          import json
          import os
          import statistics
          from collections import defaultdict, deque
          from datetime import datetime, timezone

          import requests

          from nfl.research import b1_alignment as al
          from nfl.research import b1_attribution as at
          from nfl.research.b1_evaluate import paired_error_rows
          from nfl.research.b1_history import (
              TEAM_REQUIRED_COLUMNS,
              build_b1_rows,
          )
          from nfl.research import nflverse_history as nh

          RAW_SEASONS = (2022, 2023, 2024, 2025)
          TEST_SEASONS = (2023, 2024, 2025)
          ROLLING_WINDOW = 5
          MIN_HISTORY = 3
          MIN_TEAM_HISTORY = 3
          CHANGE_TOLERANCE = 1e-12

          EXPECTED_SHA256 = {
              "player": {
                  2022: "ad426c3fe5bf1cc30c3f137fdfe96d054e19d400879ee4413129da49fa7b54be",
                  2023: "f19cb71a5de0dce7fd09376026237c9ee9d5a93fe13815a2ea3ec2d37204cb17",
                  2024: "3ddc45a84f759aa348ce465ae001752c530575455717657cdfe1f8abfcdb4759",
                  2025: "e5e0615b3d96a3eaebfaee91e55afb4a4e7fe0caf057454177bcd7d6ad4bcfc2",
              },
              "team": {
                  2022: "9803875bd0b74aa49230288d45359c75e45910f1cf1953ea0f07b9d3db35e4d1",
                  2023: "dc5a387daabe8663deaddac492ad7020d47fb1a66048690b355b406cd8e4c454",
                  2024: "b207a1430c2715d03bbf1844c4eae98695f364851ff6025f422febc2c13f5255",
                  2025: "91058a59d894855377b2f39f40c4e7bdbeef96d12144289dc68215209a1c93cb",
              },
          }
          EXPECTED_N = {2023: 599, 2024: 611, 2025: 617}
          CATEGORIES = (
              "ALIGNED",
              "MISSED_GAMES",
              "TEAM_CHANGE",
              "WINDOW_LENGTH_MISMATCH",
              "NO_HISTORY",
          )
          SHARE_BUCKETS = (
              ("lt_0_25", 0.0, 0.25),
              ("0_25_to_0_50", 0.25, 0.50),
              ("0_50_to_0_75", 0.50, 0.75),
              ("0_75_to_0_90", 0.75, 0.90),
              ("0_90_to_1_00", 0.90, 1.000000000001),
          )
          SCALE_BUCKETS = (
              ("down_10pct_plus", -1e9, 0.90),
              ("down_2_to_10pct", 0.90, 0.98),
              ("within_2pct", 0.98, 1.020000000001),
              ("up_2_to_10pct", 1.020000000001, 1.10),
              ("up_10pct_plus", 1.10, 1e9),
          )

          def game_key(row):
              return (
                  int(row["season"]),
                  int(row["week"]),
                  str(row["season_type"]),
                  str(row["team"]),
              )

          def player_key(row):
              return (
                  int(row["season"]),
                  int(row["week"]),
                  str(row["season_type"]),
                  str(row["player_id"]),
              )

          def normalize_team_games(rows):
              out = []
              seen = set()
              for i, raw in enumerate(rows):
                  missing = sorted(TEAM_REQUIRED_COLUMNS - raw.keys())
                  if missing:
                      raise SystemExit(
                          f"team row {i}: missing columns {missing}"
                      )
                  row = {
                      "season": int(float(raw["season"])),
                      "week": int(float(raw["week"])),
                      "season_type": str(raw["season_type"]),
                      "team": str(raw["team"]).strip(),
                  }
                  key = game_key(row)
                  if key in seen:
                      raise SystemExit(f"duplicate team game {key}")
                  seen.add(key)
                  out.append(row)
              out.sort(
                  key=lambda r: (
                      r["season"], r["week"], r["team"], r["season_type"]
                  )
              )
              return out

          def alignment_map(player_rows, team_rows):
              players = nh.build_prior_only_rows(
                  player_rows,
                  rolling_window=ROLLING_WINDOW,
              )
              teams = normalize_team_games(team_rows)

              team_hist = defaultdict(
                  lambda: deque(maxlen=ROLLING_WINDOW)
              )
              team_prior = {}
              for row in teams:
                  key = game_key(row)
                  team_prior[key] = list(team_hist[row["team"]])
                  team_hist[row["team"]].append(key)

              player_hist = defaultdict(
                  lambda: deque(maxlen=ROLLING_WINDOW)
              )
              out = {}
              for row in players:
                  key = game_key(row)
                  if key not in team_prior:
                      raise SystemExit(
                          f"missing team prior history for {key}"
                      )
                  ph = list(player_hist[row["player_id"]])
                  th = team_prior[key]
                  pk = player_key(row)
                  out[pk] = al.classify_history_alignment(
                      ph,
                      th,
                      current_team=row["team"],
                  )
                  player_hist[row["player_id"]].append(key)
              return out

          def summarize(rows):
              if not rows:
                  return {
                      "n": 0,
                      "changed_n": 0,
                      "changed_fraction": None,
                      "delta_mae_b1_minus_b0": None,
                      "changed_delta_mae_b1_minus_b0": None,
                      "b0_mae": None,
                      "b1_mae": None,
                      "improved_n": 0,
                      "worsened_n": 0,
                      "tied_n": 0,
                      "mean_share": None,
                      "mean_team_window_scale": None,
                  }
              b0e = [abs(r["b0"] - r["actual"]) for r in rows]
              b1e = [abs(r["b1"] - r["actual"]) for r in rows]
              deltas = [a - b for a, b in zip(b1e, b0e)]
              changed = [r for r in rows if r["changed"]]
              changed_deltas = [
                  abs(r["b1"] - r["actual"])
                  - abs(r["b0"] - r["actual"])
                  for r in changed
              ]
              return {
                  "n": len(rows),
                  "changed_n": len(changed),
                  "changed_fraction": len(changed) / len(rows),
                  "delta_mae_b1_minus_b0": statistics.fmean(deltas),
                  "changed_delta_mae_b1_minus_b0": (
                      statistics.fmean(changed_deltas)
                      if changed_deltas else None
                  ),
                  "b0_mae": statistics.fmean(b0e),
                  "b1_mae": statistics.fmean(b1e),
                  "improved_n": sum(
                      d < -CHANGE_TOLERANCE for d in deltas
                  ),
                  "worsened_n": sum(
                      d > CHANGE_TOLERANCE for d in deltas
                  ),
                  "tied_n": sum(
                      abs(d) <= CHANGE_TOLERANCE for d in deltas
                  ),
                  "mean_share": statistics.fmean(
                      r["prior_attempt_share"] for r in rows
                  ),
                  "mean_team_window_scale": statistics.fmean(
                      r["team_window_scale"] for r in rows
                  ),
              }

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Full-Count pass-attempt failure attribution"
          })
          raw_players = []
          raw_teams = []
          sources = {"player": {}, "team": {}}

          for season in RAW_SEASONS:
              purl = nh.player_stats_url(season)
              pr = session.get(purl, timeout=60)
              pr.raise_for_status()
              psha = hashlib.sha256(pr.content).hexdigest()
              if psha != EXPECTED_SHA256["player"][season]:
                  raise SystemExit(
                      f"{season}: player SHA drift {psha}"
                  )
              prows = list(csv.DictReader(io.StringIO(pr.text)))
              raw_players.extend(prows)
              sources["player"][str(season)] = {
                  "url": purl, "rows": len(prows), "sha256": psha,
              }

              turl = (
                  "https://github.com/nflverse/nflverse-data/releases/download/"
                  f"stats_team/stats_team_week_{season}.csv"
              )
              tr = session.get(turl, timeout=60)
              tr.raise_for_status()
              tsha = hashlib.sha256(tr.content).hexdigest()
              if tsha != EXPECTED_SHA256["team"][season]:
                  raise SystemExit(
                      f"{season}: team SHA drift {tsha}"
                  )
              trows = list(csv.DictReader(io.StringIO(tr.text)))
              raw_teams.extend(trows)
              sources["team"][str(season)] = {
                  "url": turl, "rows": len(trows), "sha256": tsha,
              }

          built = build_b1_rows(
              raw_players,
              raw_teams,
              rolling_window=ROLLING_WINDOW,
          )
          index = {player_key(row): row for row in built}
          if len(index) != len(built):
              raise SystemExit("duplicate built player-game key")
          alignments = alignment_map(raw_players, raw_teams)

          reports = {}
          for season in TEST_SEASONS:
              paired = paired_error_rows(
                  built,
                  "pass_attempts",
                  test_season=season,
                  test_season_type="REG",
                  min_history=MIN_HISTORY,
                  min_team_history=MIN_TEAM_HISTORY,
              )
              if len(paired) != EXPECTED_N[season]:
                  raise SystemExit(
                      f"{season}: population drift "
                      f"{len(paired)} != {EXPECTED_N[season]}"
                  )

              records = []
              for pair in paired:
                  pk = (
                      int(pair["season"]),
                      int(pair["week"]),
                      "REG",
                      str(pair["player_id"]),
                  )
                  row = index.get(pk)
                  category = alignments.get(pk)
                  if row is None or category is None:
                      raise SystemExit(
                          f"{season}: missing attribution row {pk}"
                      )
                  if str(row.get("position") or "").strip().upper() != "QB":
                      raise SystemExit(
                          f"{season}: non-QB in pass market {pk}"
                      )
                  parts = at.opportunity_components(
                      row, "pass_attempts"
                  )
                  b0 = float(pair["b0_prediction"])
                  b1 = float(pair["b1_prediction"])
                  records.append({
                      "category": category,
                      "b0": b0,
                      "b1": b1,
                      "actual": float(pair["actual"]),
                      "changed": abs(b1 - b0) > CHANGE_TOLERANCE,
                      "prior_attempt_share":
                          float(parts["prior_player_share"]),
                      "team_window_scale":
                          float(parts["team_window_scale"]),
                  })

              by_alignment = {
                  cat: summarize([
                      r for r in records if r["category"] == cat
                  ])
                  for cat in CATEGORIES
              }
              if sum(x["n"] for x in by_alignment.values()) != len(records):
                  raise SystemExit(
                      f"{season}: alignment partition incomplete"
                  )

              by_share = {}
              for name, lo, hi in SHARE_BUCKETS:
                  by_share[name] = summarize([
                      r for r in records
                      if lo <= r["prior_attempt_share"] < hi
                  ])
              if sum(x["n"] for x in by_share.values()) != len(records):
                  raise SystemExit(
                      f"{season}: share partition incomplete"
                  )

              by_scale = {}
              for name, lo, hi in SCALE_BUCKETS:
                  by_scale[name] = summarize([
                      r for r in records
                      if lo <= r["team_window_scale"] < hi
                  ])
              if sum(x["n"] for x in by_scale.values()) != len(records):
                  raise SystemExit(
                      f"{season}: scale partition incomplete"
                  )

              reports[str(season)] = {
                  "overall": summarize(records),
                  "by_alignment": by_alignment,
                  "by_prior_attempt_share": by_share,
                  "by_team_window_scale": by_scale,
              }

          output = {
              "analysis": "NFL_PASS_ATTEMPTS_REJECTED_B1_FAILURE_ATTRIBUTION",
              "status": "research_only_no_challenger",
              "created_at": datetime.now(timezone.utc).isoformat(),
              "code_sha": os.environ["FULL_COUNT_CODE_SHA"],
              "scientific_context": {
                  "fresh_2023_audit_run_id": 34637475732,
                  "fresh_2023_result": (
                      "B1 rejected: +0.2502 MAE vs B0 with player/team "
                      "clustered intervals entirely above zero"
                  ),
                  "2024_and_2025_status": (
                      "already observed; mechanism diagnosis only"
                  ),
                  "purpose": (
                      "decide whether next passing work should prioritize "
                      "QB role-state or team pace/pass-tendency signals"
                  ),
              },
              "sources": sources,
              "reports": reports,
              "decision_rule": (
                  "Do not tune B1. Use the failure partition to choose the "
                  "next independent pregame signal class."
              ),
          }

          path = "/tmp/nfl-pass-attempts-failure-attribution.json"
          with open(path, "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2, sort_keys=True)
          print(json.dumps(output, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: nfl-pass-attempts-failure-attribution
          path: /tmp/nfl-pass-attempts-failure-attribution.json
          retention-days: 30
