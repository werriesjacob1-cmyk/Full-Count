name: Canonical V2 Multi-Day Pilot

on:
  push:
    branches:
      - superchad/canonical-v2-provenance-runner-01
    paths:
      - engineering/CANONICAL_V2_MULTIDAY_TRIGGER

permissions:
  contents: read

concurrency:
  group: canonical-v2-multiday-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout provenance runner
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up exact canonical Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Materialize exact bound Statcast source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fc-source
          git fetch origin canonical-durable-checkpoints
          git show origin/canonical-durable-checkpoints:canonical/canonical-20260828T153143Z-2b79304f/source/statcast_2024_through_2026-08-24.parquet             > /tmp/fc-source/statcast_2024_through_2026-08-24.parquet
          actual="$(sha256sum /tmp/fc-source/statcast_2024_through_2026-08-24.parquet | awk '{print $1}')"
          expected="85c41d79570ac25169726419ed2bcb55cbba78139e8786b6005f71f40a877685"
          test "$actual" = "$expected"

      - name: Run three-date cached provenance pilot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/canonical-v2-multiday
          python backtest/canonical_v2_shard.py             --run-id canonical-v2-multiday-20250818-20             --start 2025-08-18             --end 2025-08-20             --shard-index 0             --shard-count 1             --source-parquet /tmp/fc-source/statcast_2024_through_2026-08-24.parquet             --expected-source-sha256 85c41d79570ac25169726419ed2bcb55cbba78139e8786b6005f71f40a877685             --scientific-parent-sha fc589447ec157bff9a96071edc3ceb6c7dc734eb             --out-dir /tmp/canonical-v2-multiday             --archive-http-bodies             --verbose

      - name: Summarize network/cache evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /tmp/canonical-v2-multiday ]; then
            du -sh /tmp/canonical-v2-multiday || true
            python - <<'PY'
          import glob, json, os
          root="/tmp/canonical-v2-multiday/http"
          for path in sorted(glob.glob(root+"/*.summary.json")):
              d=json.load(open(path))
              print(json.dumps({
                  "date":d["date"],
                  "request_count":d["request_count"],
                  "network_request_count":d.get("network_request_count"),
                  "cache_hit_count":d.get("cache_hit_count"),
                  "response_bytes_total":d["response_bytes_total"],
                  "firewall_block_count":d.get("firewall_block_count"),
                  "exceptions":d.get("exceptions"),
                  "non_2xx":d.get("http_non_2xx"),
              }, sort_keys=True))
          PY
            cat /tmp/canonical-v2-multiday/shard_summary.json || true
          fi

      - name: Upload complete pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-v2-multiday-20250818-20
          path: /tmp/canonical-v2-multiday
          if-no-files-found: error
          retention-days: 90
