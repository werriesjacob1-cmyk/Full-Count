# FC-MLB-001B -- ENVIRONMENT A: record the 001B evidence-integrity drill on a fresh GitHub-hosted runner.
#
# FC-MLB-001B EVIDENCE-INTEGRITY DRILL -- NOT A PROSPECTIVE UNIT. Runs ONLY when b_drill/RECORD_REQUEST.json is
# committed. It records one drill in the pinned runtime sandbox (live inputs of today's slate; no outcomes), and
# never pushes, seals onto the chain, posts a receipt, deploys, or touches V3's trigger/dispatcher/activation.
#
# Tape transport (SUPERCHAD disposition 2026-10-05): the complete tape is uploaded as ONE GitHub Actions artifact
# named fc-mlb-001b-drill-tape-<sha256>.json.gz -- temporary, outside git, NON-authoritative. The sealed sha256 and
# byte size (bound into the TSA-timestamped manifest) are authoritative; environment B re-hashes before replay.
# The drill's small sealed files are a second artifact. Identities are published as check-run annotations.
name: V3 001B drill record (environment A)

on:
  push:
    branches: [claude/mlb-v3-amendment-b-20261005]
    paths: ['research/mlb_accuracy_challenger_20261001/v3/b_drill/RECORD_REQUEST.json']

permissions:
  contents: read

concurrency:
  group: v3-b-drill-record
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  record-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      V3: research/mlb_accuracy_challenger_20261001/v3
      SHADOW_PIN: 7d3ebacd55c34c6ec78030bdeca70799e56d4764
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact commit (shallow on purpose)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Host Python 3.11 (launcher only; the pipeline runs in the pinned image)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
      - name: Fetch the frozen shadow pin and the live overlay ref (depth 1)
        run: |
          set -euo pipefail
          git fetch --no-tags --depth 1 origin "$SHADOW_PIN"
          git fetch --no-tags --depth 1 origin "+refs/heads/main:refs/remotes/origin/main"
      - name: Host tools + hash-locked launcher packages (runner schedule/capture/TSA HTTP only)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq strace
          grep -E '^(requests|urllib3|idna|certifi|charset-normalizer)==' "$V3/shadow-requirements.lock" > "$RUNNER_TEMP/launcher.lock"
          python3 -m pip install -q --no-deps --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/launcher.lock"
          mkdir -p "$RUNNER_TEMP/out"
      - name: Pinned runtime image (fetch by digest, verify, extract)
        run: |
          set -euo pipefail
          sudo -E env "PATH=$PATH" python3 "$V3/runtime_image.py" "$RUNNER_TEMP/v3b_runtime" > "$RUNNER_TEMP/out/runtime_identity.json"
          cat "$RUNNER_TEMP/out/runtime_identity.json"
      - name: Drill request (today's slate only)
        id: req
        run: |
          set -euo pipefail
          python3 - "$V3/b_drill/RECORD_REQUEST.json" >> "$GITHUB_OUTPUT" <<'PY'
          import datetime, json, sys
          r = json.load(open(sys.argv[1]))
          today = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          if r.get("date") != today or r.get("window") not in ("DAY", "NIGHT"):
              raise SystemExit(f"request {r} is not for today's slate ({today}); refusing")
          print(f"date={r['date']}\nwindow={r['window']}\ndrill=B_DRILL_{r['date'].replace('-', '')}_{r['window']}")
          PY
      - name: Record the drill in the pinned runtime sandbox (environment A)
        run: |
          set -euo pipefail
          rc=0
          sudo -E env "PATH=$PATH" V3B_RUNTIME_CACHE="$RUNNER_TEMP/v3b_runtime" V3A1_ISOLATION_BASE="$RUNNER_TEMP/iso_a" \
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" \
            python3 "$V3/b_drill.py" record --repo "$GITHUB_WORKSPACE" --date "${{ steps.req.outputs.date }}" \
            --window "${{ steps.req.outputs.window }}" --out "$RUNNER_TEMP/drill/${{ steps.req.outputs.drill }}" \
            --store "$RUNNER_TEMP/store" --transport-out "$RUNNER_TEMP/transport" > "$RUNNER_TEMP/out/record.log" 2>&1 || rc=$?
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/drill" "$RUNNER_TEMP/transport" "$RUNNER_TEMP/out" 2>/dev/null || true
          tail -c 40000 "$RUNNER_TEMP/out/record.log"
          if [ "$rc" -ne 0 ]; then echo "::error title=B-A RECORD::drill record failed (rc $rc)"; exit "$rc"; fi
          ls -la "$RUNNER_TEMP/drill/${{ steps.req.outputs.drill }}" "$RUNNER_TEMP/transport"
          test "$(ls "$RUNNER_TEMP/transport" | wc -l)" -eq 1
      - name: Upload the drill's sealed files (artifact)
        id: up_files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: fc-mlb-001b-drill-files-${{ steps.req.outputs.drill }}
          path: ${{ runner.temp }}/drill/${{ steps.req.outputs.drill }}/
          retention-days: 90
          if-no-files-found: error
      - name: Upload the complete tape as ONE artifact named by its sha256 (drill transport)
        id: up_tape
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: tape-${{ steps.req.outputs.drill }}
          path: ${{ runner.temp }}/transport/
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
      - name: Publish identities (check-run annotations; committed by the builder as B_DRILL_RECORD.json)
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/drill/${{ steps.req.outputs.drill }}" "$RUNNER_TEMP/transport" <<'PY'
          import hashlib, json, os, sys
          d, t = sys.argv[1], sys.argv[2]
          meta = json.load(open(os.path.join(d, "B_DRILL.json")))
          name = os.listdir(t)[0]
          h, n = hashlib.sha256(), 0
          with open(os.path.join(t, name), "rb") as fh:
              for chunk in iter(lambda: fh.read(1 << 20), b""):
                  h.update(chunk); n += len(chunk)
          tt = meta["tape_transport"]
          def hex64(d):  # frozen digest representation: bare 64-char lowercase hex (Codex pre-drill audit MUST FIX 1)
              d = d.strip().lower()
              d = d[len("sha256:"):] if d.startswith("sha256:") else d
              assert len(d) == 64 and all(c in "0123456789abcdef" for c in d), f"not a sha256 digest: {d!r}"
              return d
          assert (h.hexdigest(), n, name) == (tt["sha256"], tt["bytes"], tt["asset_name"]), "transport file != sealed identity"
          rec = {"label": meta["label"], "drill": os.path.basename(d), "record_run_id": int(os.environ["GITHUB_RUN_ID"]),
                 "record_commit": os.environ["GITHUB_SHA"], "repository": os.environ["GITHUB_REPOSITORY"],
                 "files_artifact": {"name": f"fc-mlb-001b-drill-files-{os.path.basename(d)}",
                                    "id": int(os.environ["FILES_ID"]), "zip_sha256": hex64(os.environ["FILES_DIGEST"])},
                 "tape": {"transport": "github-actions-artifact", "artifact_name": f"tape-{os.path.basename(d)}",
                          "artifact_id": int(os.environ["TAPE_ID"]), "zip_sha256": hex64(os.environ["TAPE_DIGEST"]),
                          "asset_name": name, "key": tt["key"], "sha256": tt["sha256"], "bytes": tt["bytes"]},
                 "scientific_payload_sha256": meta["scientific_payload_sha256"], "manifest_sha256": meta["manifest_sha256"],
                 "runtime_image": meta["runtime_image"]["manifest_digest"],
                 "rootfs_tree_sha256": meta["runtime_image"]["rootfs_tree_sha256"]}
          print(f"::notice title=B-A RECORD::{json.dumps(rec, sort_keys=True)}")
          print(f"::notice title=B-A SHA256SUMS::{json.dumps(open(os.path.join(d, 'SHA256SUMS')).read())}")
          env = meta["record_environment"]
          print(f"::notice title=B-A ENV::{json.dumps(env, sort_keys=True)[:6000]}")
          PY
        env:
          FILES_ID: ${{ steps.up_files.outputs.artifact-id }}
          FILES_DIGEST: ${{ steps.up_files.outputs.artifact-digest }}
          TAPE_ID: ${{ steps.up_tape.outputs.artifact-id }}
          TAPE_DIGEST: ${{ steps.up_tape.outputs.artifact-digest }}
      - name: Record log (artifact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: b-drill-record-log-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
          retention-days: 90
