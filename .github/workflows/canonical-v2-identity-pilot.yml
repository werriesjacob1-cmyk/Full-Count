name: Canonical V2 Certification-Only Audit

on:
  push:
    branches:
      - superchad/canonical-v2-provenance-runner-01
    paths:
      - engineering/CANONICAL_V2_IDENTITY_PILOT_TRIGGER

permissions:
  contents: read
  actions: read

concurrency:
  group: canonical-v2-certification-only
  cancel-in-progress: false

env:
  GENERATION_SHA: bbbe4683a2f3b1a43f17a43327ad642d8126f377
  SCIENTIFIC_PARENT_SHA: fc589447ec157bff9a96071edc3ceb6c7dc734eb
  PREDICTOR_SHA: 85c41d79570ac25169726419ed2bcb55cbba78139e8786b6005f71f40a877685
  OUTCOME_SHA: 03fe66c5035b1e139216cf2f56ec276bf82bdea341febbbebc0406f4d3c6b98f
  SOURCE_RUN_ID: "33363027948"
  SOURCE_ARTIFACT_ID: "9750059385"
  SOURCE_ARTIFACT_NAME: canonical-v2-consolidated-bbbe4683a2f3b1a43f17a43327ad642d8126f377
  GENERATION_TEST_RUN_ID: "33363027985"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for exact-head auditor Test Suite
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 46); do
            payload="$(curl -fsSL -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=push&per_page=100")"
            row="$(printf '%s' "$payload" | jq -r --arg sha "$GITHUB_SHA" '
              .workflow_runs[]
              | select(.name == "Test Suite" and .head_sha == $sha)
              | [.status, (.conclusion // ""), (.id|tostring)]
              | @tsv
            ' | head -n1)"
            if [ -z "$row" ]; then
              sleep 45
              continue
            fi
            IFS=$'\t' read -r status conclusion run_id <<<"$row"
            echo "auditor Test Suite run=$run_id status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              test "$conclusion" = "success"
              echo "EXACT_HEAD_AUDITOR_TEST_SUITE_GREEN sha=$GITHUB_SHA run=$run_id"
              exit 0
            fi
            sleep 45
          done
          echo "Timed out waiting for exact-head auditor Test Suite" >&2
          exit 1

  certify:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact auditor head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: auditor

      - name: Checkout immutable generation head separately
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GENERATION_SHA }}
          fetch-depth: 0
          path: generation

      - name: Verify auditor and generation identities
        shell: bash
        run: |
          set -euo pipefail
          auditor="$(git -C auditor rev-parse HEAD)"
          generation="$(git -C generation rev-parse HEAD)"
          echo "auditor_sha=$auditor"
          echo "generation_sha=$generation"
          test "$auditor" = "$GITHUB_SHA"
          test "$generation" = "$GENERATION_SHA"

          payload="$(curl -fsSL -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GENERATION_TEST_RUN_ID")"
          test "$(printf '%s' "$payload" | jq -r .name)" = "Test Suite"
          test "$(printf '%s' "$payload" | jq -r .head_sha)" = "$GENERATION_SHA"
          test "$(printf '%s' "$payload" | jq -r .conclusion)" = "success"
          echo "GENERATION_EXACT_HEAD_TEST_SUITE_GREEN run=$GENERATION_TEST_RUN_ID"

      - name: Set up exact canonical Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
          cache: pip
          cache-dependency-path: generation/requirements.txt

      - name: Install exact canonical environment
        shell: bash
        run: |
          set -euo pipefail
          pip install -r generation/requirements.txt
          pip install --upgrade --force-reinstall \
            numpy==2.4.6 \
            pandas==3.0.5 \
            pyarrow==25.0.1 \
            pybaseball==2.2.7 \
            python-dateutil==2.9.0.post0 \
            requests==2.34.2 \
            scikit-learn==1.9.0 \
            scipy==1.17.1

      - name: Download immutable consolidated artifact from run 6
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          path: /tmp/canonical-v2-final
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Bind auditor provenance and source artifact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os

          root="/tmp/canonical-v2-final"
          report_path=os.path.join(root,"consolidation_report.json")
          report=json.load(open(report_path,encoding="utf-8"))
          generation=os.environ["GENERATION_SHA"]
          if report.get("generation_code_sha") != generation:
              raise SystemExit(
                  f"artifact generation SHA mismatch: {report.get('generation_code_sha')} != {generation}"
              )
          if report.get("verdict") != "CANONICAL_V2_CONSOLIDATED":
              raise SystemExit(f"unexpected consolidation verdict: {report.get('verdict')}")

          certifier="auditor/backtest/canonical_v2_certify.py"
          h=hashlib.sha256()
          with open(certifier,"rb") as fh:
              for chunk in iter(lambda: fh.read(1<<20),b""):
                  h.update(chunk)

          file_h=hashlib.sha256()
          with open(report_path,"rb") as fh:
              for chunk in iter(lambda: fh.read(1<<20),b""):
                  file_h.update(chunk)

          provenance={
              "audit_architecture":"separate_auditor_checkout_over_immutable_generation_checkout_v1",
              "auditor_git_sha":os.environ["GITHUB_SHA"],
              "certifier_file_sha256":h.hexdigest(),
              "audited_generation_sha":generation,
              "scientific_parent_sha":os.environ["SCIENTIFIC_PARENT_SHA"],
              "source_workflow_run_id":int(os.environ["SOURCE_RUN_ID"]),
              "source_artifact_id":int(os.environ["SOURCE_ARTIFACT_ID"]),
              "source_artifact_name":os.environ["SOURCE_ARTIFACT_NAME"],
              "generation_test_suite_run_id":int(os.environ["GENERATION_TEST_RUN_ID"]),
              "consolidation_report_file_sha256":file_h.hexdigest(),
              "assembled_rows_sha256":report.get("assembled_rows_sha256"),
              "source_lineage_fingerprint":report.get("source_lineage_fingerprint"),
              "total_rows":report.get("total_rows"),
              "unique_candidate_identities":report.get("unique_candidate_identities"),
          }
          with open(os.path.join(root,"certifier_provenance.json"),"x",encoding="utf-8") as fh:
              json.dump(provenance,fh,indent=2,sort_keys=True)
              fh.write("\n")
              fh.flush()
              os.fsync(fh.fileno())
          print(json.dumps(provenance,sort_keys=True))
          PY

      - name: Independently certify with bounded-memory auditor
        shell: bash
        run: |
          set -uo pipefail
          stdout=/tmp/certifier.stdout.log
          stderr=/tmp/certifier.stderr.log

          python -u auditor/backtest/canonical_v2_certify.py \
            /tmp/canonical-v2-final \
            --repo-root generation \
            --expected-parent-sha "$SCIENTIFIC_PARENT_SHA" \
            --expected-source-sha "$PREDICTOR_SHA" \
            --expected-outcome-source-sha "$OUTCOME_SHA" \
            --output /tmp/canonical-v2-final/certification_report.json \
            > >(tee "$stdout") \
            2> >(tee "$stderr" >&2) &
          cert_pid=$!

          (
            while kill -0 "$cert_pid" 2>/dev/null; do
              rss="$(ps -o rss= -p "$cert_pid" 2>/dev/null | tr -d ' ' || true)"
              avail="$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)"
              echo "CERTIFIER_RESOURCE rss_kb=${rss:-0} mem_available_kb=${avail:-unknown}"
              sleep 15
            done
          ) &
          monitor_pid=$!

          set +e
          wait "$cert_pid"
          rc=$?
          set -e
          kill "$monitor_pid" 2>/dev/null || true
          wait "$monitor_pid" 2>/dev/null || true

          echo "CERTIFIER_EXIT_CODE=$rc"
          exit "$rc"

      - name: Require literal canonical certification
        shell: bash
        run: |
          set -euo pipefail
          verdict="$(python - <<'PY'
          import json
          print(json.load(open("/tmp/canonical-v2-final/certification_report.json",encoding="utf-8"))["verdict"])
          PY
          )"
          echo "CERTIFICATION_VERDICT=$verdict"
          test "$verdict" = "CANONICAL CERTIFIED"

      - name: Upload durable certification bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-v2-certification-bundle-bbbe4683a2f3b1a43f17a43327ad642d8126f377
          path: |
            /tmp/canonical-v2-final/consolidation_report.json
            /tmp/canonical-v2-final/certifier_provenance.json
            /tmp/canonical-v2-final/certification_report.json
            /tmp/certifier.stdout.log
            /tmp/certifier.stderr.log
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
