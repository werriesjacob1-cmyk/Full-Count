name: NFL V0 B1 Alignment Attribution

# Research-only. Explains WHEN the already-observed B1 team-window rescaling
# fires: exact aligned history, missed player games, team changes, or unequal
# prior-window lengths. No tuning, promotion, selection, or publication.
on:
  push:
    branches:
      - superchad/nfl-foundation-continuation-20260911
    paths:
      - .github/workflows/nfl-v0-b1-alignment.yml
      - nfl/research/b1_alignment.py
      - nfl/research/b1_attribution.py
      - nfl/research/b1_history.py
      - nfl/research/b1_evaluate.py
      - nfl/research/b1_team_opportunity.py
      - nfl/research/nflverse_history.py

permissions:
  contents: read

jobs:
  alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install 'requests~=2.34.2'

      - name: Measure B1 history-window mechanisms
        env:
          FULL_COUNT_CODE_SHA: ${{ github.sha }}
        run: |
          PYTHONPATH=. python3 - <<'PY'
          import csv
          import hashlib
          import io
          import json
          import math
          import os
          import statistics
          from collections import defaultdict, deque
          from datetime import datetime, timezone

          import requests

          from nfl.research import b1_alignment as al
          from nfl.research import b1_attribution as at
          from nfl.research.b1_evaluate import MARKETS, paired_error_rows
          from nfl.research.b1_history import build_b1_rows, TEAM_REQUIRED_COLUMNS
          from nfl.research import nflverse_history as nh

          RAW_SEASONS = (2023, 2024, 2025)
          ROLLING_WINDOW = 5
          MIN_HISTORY = 3
          MIN_TEAM_HISTORY = 3
          CHANGE_TOLERANCE = 1e-12

          EXPECTED_SHA256 = {
              "player": {
                  2023: "f19cb71a5de0dce7fd09376026237c9ee9d5a93fe13815a2ea3ec2d37204cb17",
                  2024: "3ddc45a84f759aa348ce465ae001752c530575455717657cdfe1f8abfcdb4759",
                  2025: "e5e0615b3d96a3eaebfaee91e55afb4a4e7fe0caf057454177bcd7d6ad4bcfc2",
              },
              "team": {
                  2023: "dc5a387daabe8663deaddac492ad7020d47fb1a66048690b355b406cd8e4c454",
                  2024: "b207a1430c2715d03bbf1844c4eae98695f364851ff6025f422febc2c13f5255",
                  2025: "91058a59d894855377b2f39f40c4e7bdbeef96d12144289dc68215209a1c93cb",
              },
          }

          EXPECTED_COMPARISON_N = {
              2024: {
                  "pass_attempts": 611, "passing_yards": 611,
                  "receptions": 4689, "receiving_yards": 4689,
                  "rush_attempts": 2953, "rushing_yards": 2953,
              },
              2025: {
                  "pass_attempts": 617, "passing_yards": 617,
                  "receptions": 4849, "receiving_yards": 4849,
                  "rush_attempts": 3045, "rushing_yards": 3045,
              },
          }

          CATEGORIES = (
              "ALIGNED",
              "MISSED_GAMES",
              "TEAM_CHANGE",
              "WINDOW_LENGTH_MISMATCH",
              "NO_HISTORY",
          )

          def current_key(row):
              return (
                  int(row["season"]),
                  int(row["week"]),
                  str(row["season_type"]),
                  str(row["team"]),
              )

          def player_key(row):
              return (
                  int(row["season"]),
                  int(row["week"]),
                  str(row["season_type"]),
                  str(row["player_id"]),
              )

          def normalize_team_game_rows(source_rows):
              out = []
              seen = set()
              for i, raw in enumerate(source_rows):
                  missing = sorted(TEAM_REQUIRED_COLUMNS - raw.keys())
                  if missing:
                      raise SystemExit(
                          f"team row {i}: missing required columns {missing}"
                      )
                  try:
                      season = int(float(raw["season"]))
                      week = int(float(raw["week"]))
                  except (TypeError, ValueError) as exc:
                      raise SystemExit(
                          f"team row {i}: invalid season/week"
                      ) from exc
                  team = str(raw["team"]).strip()
                  season_type = str(raw["season_type"])
                  if not team or week <= 0:
                      raise SystemExit(f"team row {i}: invalid team/week")
                  key = (season, week, season_type, team)
                  if key in seen:
                      raise SystemExit(f"duplicate team game key: {key}")
                  seen.add(key)
                  out.append({
                      "season": season,
                      "week": week,
                      "season_type": season_type,
                      "team": team,
                  })
              out.sort(key=lambda r: (
                  r["season"], r["week"], r["team"], r["season_type"]
              ))
              return out

          def build_alignment_map(player_source_rows, team_source_rows):
              # Use the production research builder for player normalization,
              # empty-ID policy, chronology, and deduplication.
              players = nh.build_prior_only_rows(
                  player_source_rows,
                  rolling_window=ROLLING_WINDOW,
              )
              teams = normalize_team_game_rows(team_source_rows)

              team_histories = defaultdict(
                  lambda: deque(maxlen=ROLLING_WINDOW)
              )
              team_prior = {}
              for row in teams:
                  key = current_key(row)
                  team_prior[key] = list(team_histories[row["team"]])
                  team_histories[row["team"]].append(key)

              player_histories = defaultdict(
                  lambda: deque(maxlen=ROLLING_WINDOW)
              )
              output = {}
              for row in players:
                  game_key = current_key(row)
                  if game_key not in team_prior:
                      raise SystemExit(
                          f"no current-team history for player game {game_key}"
                      )
                  prior_player = list(player_histories[row["player_id"]])
                  prior_team = team_prior[game_key]
                  category = al.classify_history_alignment(
                      prior_player,
                      prior_team,
                      current_team=row["team"],
                  )
                  pk = player_key(row)
                  if pk in output:
                      raise SystemExit(f"duplicate player attribution key: {pk}")
                  output[pk] = {
                      "category": category,
                      "player_history_n": len(prior_player),
                      "team_history_n": len(prior_team),
                  }
                  player_histories[row["player_id"]].append(game_key)
              return output

          def summarize(records):
              if not records:
                  return {
                      "n": 0,
                      "changed_n": 0,
                      "changed_fraction": None,
                      "mean_delta_abs_error": None,
                      "changed_mean_delta_abs_error": None,
                      "improved_n": 0,
                      "worsened_n": 0,
                      "tied_n": 0,
                      "mean_team_window_scale": None,
                  }
              changed = [r for r in records if r["changed"]]
              deltas = [r["delta_abs_error"] for r in records]
              changed_deltas = [r["delta_abs_error"] for r in changed]
              return {
                  "n": len(records),
                  "changed_n": len(changed),
                  "changed_fraction": len(changed) / len(records),
                  "mean_delta_abs_error": statistics.fmean(deltas),
                  "changed_mean_delta_abs_error": (
                      statistics.fmean(changed_deltas)
                      if changed_deltas else None
                  ),
                  "improved_n": sum(
                      d < -CHANGE_TOLERANCE for d in deltas
                  ),
                  "worsened_n": sum(
                      d > CHANGE_TOLERANCE for d in deltas
                  ),
                  "tied_n": sum(
                      abs(d) <= CHANGE_TOLERANCE for d in deltas
                  ),
                  "mean_team_window_scale": statistics.fmean(
                      r["team_window_scale"] for r in records
                  ),
              }

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Full-Count NFL B1 alignment attribution (read-only)"
          })

          raw_players = []
          raw_teams = []
          sources = {"player": {}, "team": {}}

          for season in RAW_SEASONS:
              purl = nh.player_stats_url(season)
              pr = session.get(purl, timeout=60)
              pr.raise_for_status()
              psha = hashlib.sha256(pr.content).hexdigest()
              if psha != EXPECTED_SHA256["player"][season]:
                  raise SystemExit(
                      f"{season}: player source SHA drift: {psha}"
                  )
              prows = list(csv.DictReader(io.StringIO(pr.text)))
              raw_players.extend(prows)
              sources["player"][str(season)] = {
                  "url": purl, "rows": len(prows), "sha256": psha,
              }

              turl = (
                  "https://github.com/nflverse/nflverse-data/releases/download/"
                  f"stats_team/stats_team_week_{season}.csv"
              )
              tr = session.get(turl, timeout=60)
              tr.raise_for_status()
              tsha = hashlib.sha256(tr.content).hexdigest()
              if tsha != EXPECTED_SHA256["team"][season]:
                  raise SystemExit(
                      f"{season}: team source SHA drift: {tsha}"
                  )
              trows = list(csv.DictReader(io.StringIO(tr.text)))
              raw_teams.extend(trows)
              sources["team"][str(season)] = {
                  "url": turl, "rows": len(trows), "sha256": tsha,
              }

          # Building B1 first preserves its stricter cross-source integrity
          # checks. The alignment map then explains those exact B1 rows.
          built = build_b1_rows(
              raw_players,
              raw_teams,
              rolling_window=ROLLING_WINDOW,
          )
          built_index = {player_key(row): row for row in built}
          if len(built_index) != len(built):
              raise SystemExit("duplicate built B1 player-game key")

          alignments = build_alignment_map(raw_players, raw_teams)

          reports = {}
          for season, label in (
              (2024, "2024_development"),
              (2025, "2025_previously_observed_descriptive"),
          ):
              reports[label] = {}
              for market in MARKETS:
                  paired = paired_error_rows(
                      built,
                      market,
                      test_season=season,
                      test_season_type="REG",
                      min_history=MIN_HISTORY,
                      min_team_history=MIN_TEAM_HISTORY,
                  )
                  expected_n = EXPECTED_COMPARISON_N[season][market]
                  if len(paired) != expected_n:
                      raise SystemExit(
                          f"{label}/{market}: population drift "
                          f"{len(paired)} != {expected_n}"
                      )

                  records = []
                  for p in paired:
                      pk = (
                          int(p["season"]),
                          int(p["week"]),
                          "REG",
                          str(p["player_id"]),
                      )
                      row = built_index.get(pk)
                      alignment = alignments.get(pk)
                      if row is None or alignment is None:
                          raise SystemExit(
                              f"{label}/{market}: missing attribution row {pk}"
                          )
                      components = at.opportunity_components(row, market)
                      records.append({
                          "category": alignment["category"],
                          "position": str(row.get("position") or "").upper(),
                          "changed": abs(
                              float(p["b1_prediction"])
                              - float(p["b0_prediction"])
                          ) > CHANGE_TOLERANCE,
                          "delta_abs_error": float(p["delta_abs_error"]),
                          "team_window_scale": float(
                              components["team_window_scale"]
                          ),
                      })

                  by_category = {
                      category: summarize([
                          r for r in records
                          if r["category"] == category
                      ])
                      for category in CATEGORIES
                  }

                  # The category partition must be exhaustive and disjoint.
                  if sum(v["n"] for v in by_category.values()) != len(records):
                      unknown = sorted({
                          r["category"] for r in records
                          if r["category"] not in CATEGORIES
                      })
                      raise SystemExit(
                          f"{label}/{market}: incomplete category partition "
                          f"{unknown}"
                      )

                  by_position_category = {}
                  for position in sorted({r["position"] for r in records}):
                      by_position_category[position] = {
                          category: summarize([
                              r for r in records
                              if r["position"] == position
                              and r["category"] == category
                          ])
                          for category in CATEGORIES
                      }

                  reports[label][market] = {
                      "comparison_n": len(records),
                      "overall": summarize(records),
                      "by_alignment_category": by_category,
                      "by_position_and_alignment": by_position_category,
                  }

          output = {
              "analysis": "NFL_V0_B1_HISTORY_ALIGNMENT_ATTRIBUTION",
              "status": "research_only",
              "created_at": datetime.now(timezone.utc).isoformat(),
              "code_sha": os.environ["FULL_COUNT_CODE_SHA"],
              "scientific_context": {
                  "b0_run_id": 34621247208,
                  "b1_run_id": 34622487867,
                  "component_attribution_run_id": 34625424919,
                  "rolling_window_prior_games": ROLLING_WINDOW,
                  "development_season": 2024,
                  "2025_status": (
                      "previously observed; descriptive only; not pristine "
                      "for new tuning claims"
                  ),
                  "category_semantics": {
                      "ALIGNED": (
                          "player prior appearances exactly equal current "
                          "team prior games"
                      ),
                      "MISSED_GAMES": (
                          "same team and equal window lengths, but player prior "
                          "appearances skip at least one team game; no injury "
                          "cause is inferred"
                      ),
                      "TEAM_CHANGE": (
                          "at least one player prior appearance belongs to a "
                          "different team"
                      ),
                      "WINDOW_LENGTH_MISMATCH": (
                          "same current team, but prior player and team windows "
                          "have different lengths"
                      ),
                      "NO_HISTORY": "neither side has prior history",
                  },
              },
              "sources": sources,
              "reports": reports,
          }

          path = "/tmp/nfl-v0-b1-alignment.json"
          with open(path, "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2, sort_keys=True)
          print(json.dumps(output, indent=2, sort_keys=True))
          print(f"\nWrote {path}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: nfl-v0-b1-alignment-attribution
          path: /tmp/nfl-v0-b1-alignment.json
          retention-days: 30
