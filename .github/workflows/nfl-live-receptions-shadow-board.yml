name: NFL Live Receptions Shadow Board Audit

# Prospective research launch workflow.
# Live FanDuel -> strict primary receptions normalization (via the generic
# multi-market player-prop normalizer) -> exact 2026 roster identity -> frozen
# B0 projection -> pooled historical residual score -> official-inactives
# fail-closed gate -> deterministic sealed shadow snapshot.
#
# Adapted from nfl-live-passing-yards-shadow-board.yml per Jacob's instruction
# to reuse the existing passing-yards workflow pattern rather than building a
# new framework. Two deliberate differences from that workflow, matching
# receptions_shadow.py's own documented design:
#   1. Market discovery uses the "receiving-props" FanDuel tab and the
#      generic `player_prop_markets.normalize_payload` (passing_yards has its
#      own dedicated `fanduel_passing.py`; receptions does not need one).
#   2. No role-continuity/team-change or "one primary candidate per team"
#      quarantine gate. That gate exists for passing_yards because exactly
#      one starting QB is expected per team; multiple legitimate primary
#      receivers (WR1/WR2/TE1) per team is normal, so it does not apply here
#      (see receptions_shadow.py's module docstring for the underlying study).
#
# NO commit, push, public PLAY, publication, or production promotion.
on:
  # UTC. Same 7 kickoff waves as the passing-yards workflow.
  schedule:
    - cron: '40 15 * * 0'
    - cron: '50 16 * * 0'
    - cron: '5 19 * * 0'
    - cron: '55 19 * * 0'
    - cron: '15 20 * * 0'
    - cron: '0 23 * * 0'
    - cron: '10 0 * * 1'
  push:
    branches:
      - claude/nfl-receptions-live-shadow-20260919
    paths:
      - .github/workflows/nfl-live-receptions-shadow-board.yml
  workflow_dispatch:

permissions:
  contents: read

# If a delayed older cron overlaps a newer freeze, keep the fresher run.
concurrency:
  group: nfl-live-receptions-shadow-board
  cancel-in-progress: true

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NFL dependencies only
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r nfl/requirements-nfl.txt
          python3 -m pip install 'requests~=2.34.2'

      - name: Build live Sunday receptions shadow board without publishing
        env:
          FULL_COUNT_CODE_SHA: ${{ github.sha }}
          # Optional manual override. Scheduled runs derive the Chicago date.
          TARGET_LOCAL_DATE: ''
        run: |
          PYTHONPATH=. python3 - <<'PY'
          import csv
          import hashlib
          import io
          import json
          import math
          import os
          import statistics
          from collections import Counter, defaultdict, deque
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import requests

          from nfl.archive.provenance import CHECKED_AND_FOUND, utcnow
          from nfl.archive.sources import fanduel_nfl, official_nfl
          from nfl.normalize.player_prop_markets import normalize_payload
          from nfl.normalize.inactive_roster_binding import bind_report
          from nfl.normalize.player_prop_roster_binding import bind_player_prop_candidate
          from nfl.normalize.official_inactives import parse_report
          from nfl.normalize.pregame_availability import evaluate_candidate
          from nfl.prospective.receptions_challenger_snapshot import (
              build_challenger_snapshot_record,
              seal_challenger_snapshot,
          )
          from nfl.prospective.shadow_snapshot import seal_snapshot, validate_pregame_timing
          from nfl.research import nflverse_history as nh
          from nfl.research.receptions_frozen_challenger import (
              FROZEN_NB_FIT,
              compare_b0_vs_frozen_challenger,
          )
          from nfl.research.receptions_shadow import (
              current_b0_projection,
              score_shadow_candidate,
          )

          # Research-only, separately sealed -- never read by the primary
          # board/decision logic below. PR #164 (frozen challenger) and #165
          # (sealed pairing connector) are both already merged, unmodified,
          # research-only infrastructure; this just calls them with the
          # SAME real inputs (projection, line, odds) the live B0 scoring
          # loop already computed, using the identical authoritative
          # availability gate and identity checks. B0's own decision/record
          # is never read from or written to by this block.
          CHALLENGER_MODEL_VERSION = (
              f"NEGATIVE_BINOMIAL_POOLED_V1_alpha_{FROZEN_NB_FIT['alpha']}"
          )

          CT = ZoneInfo("America/Chicago")
          target_override = str(
              os.environ.get("TARGET_LOCAL_DATE") or ""
          ).strip()
          if target_override:
              TARGET_DATE = target_override
          else:
              local_today = datetime.now(CT).date()
              days_until_sunday = (6 - local_today.weekday()) % 7
              TARGET_DATE = (
                  local_today + timedelta(days=days_until_sunday)
              ).isoformat()
          EVIDENCE_ROOT = Path("/tmp/nfl-receptions-shadow-evidence")
          (EVIDENCE_ROOT / "raw" / "fanduel").mkdir(parents=True, exist_ok=True)
          (EVIDENCE_ROOT / "raw" / "official_nfl").mkdir(parents=True, exist_ok=True)
          (EVIDENCE_ROOT / "model_sources").mkdir(parents=True, exist_ok=True)
          MIN_HISTORY = 3

          # Identical roster/player-stats sources and digests already pinned
          # by the passing-yards workflow -- the same nflverse release assets,
          # re-pinned here rather than imported to keep this workflow's own
          # drift check self-contained and auditable.
          ROSTER_URL = (
              "https://github.com/nflverse/nflverse-data/releases/download/"
              "rosters/roster_2026.csv"
          )
          # Re-pinned 2026-09-20 after a real, expected further drift: the
          # 2026-09-19 pin (8d6496372133d5a9d683b0f48402bf4a2b8b96eae85c5d6b88093bb9094c3dbe)
          # was itself stale by today -- real season transactions keep
          # moving the roster forward. Same live SHA the passing-yards
          # workflow was just re-pinned to, independently re-verified
          # before repinning: 944,684 bytes, sha256 07a874aa...4d60b9.
          ROSTER_SHA = (
              "07a874aa3cf8918db46aa8206968ee2c3a36845d62cd3ea208fa0efc664d60b9"
          )
          PLAYER_SHA = {
              2023: "f19cb71a5de0dce7fd09376026237c9ee9d5a93fe13815a2ea3ec2d37204cb17",
              2024: "3ddc45a84f759aa348ce465ae001752c530575455717657cdfe1f8abfcdb4759",
              2025: "e5e0615b3d96a3eaebfaee91e55afb4a4e7fe0caf057454177bcd7d6ad4bcfc2",
          }
          # Pinned reproduction of receptions_baseline_research.py's real
          # EXPECTED_ACTIVE_B0 (2023-2025 cold-start restriction of the full
          # 1999-2025 audited corpus). A drift guard, not a live production
          # board.
          EXPECTED_B0 = {
              2024: {"n": 3909, "mae": 1.4570009380063103},
              2025: {"n": 3987, "mae": 1.408703285678455},
          }
          EXPECTED_POOLED_RESIDUALS = 3909 + 3987

          def parse_iso(value):
              text = str(value or "").strip()
              if not text:
                  return None
              try:
                  return datetime.fromisoformat(text.replace("Z", "+00:00"))
              except ValueError:
                  return None

          def local_slate(value):
              dt = parse_iso(value)
              if dt is None:
                  return None
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              return dt.astimezone(CT).date().isoformat()

          def finite(value):
              try:
                  out = float(value)
              except (TypeError, ValueError):
                  return None
              return out if math.isfinite(out) else None

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Full-Count NFL live receptions shadow board audit"
          })

          # ---------- current roster, pinned after explicit repin audit ----------
          rr = session.get(ROSTER_URL, timeout=60)
          rr.raise_for_status()
          roster_sha = hashlib.sha256(rr.content).hexdigest()
          if roster_sha != ROSTER_SHA:
              raise SystemExit(
                  f"2026 roster drift {roster_sha} != pinned {ROSTER_SHA}"
              )
          roster = list(csv.DictReader(io.StringIO(rr.text)))
          if not roster:
              raise SystemExit("empty 2026 roster")
          (EVIDENCE_ROOT / "model_sources" / "roster_2026.csv").write_bytes(
              rr.content
          )

          # ---------- historical B0 calibration substrate ----------
          # Mirrors receptions_baseline_research.load_receiver_rows'
          # eligibility gate: no position-label filter, effective_targets =
          # max(targets, receptions) > 0 (see that module's docstring for the
          # confirmed 2003-2008 nflverse targets-column coverage gap this
          # covers).
          player_rows_by_season = {}
          all_history_rows = []
          for season in (2023, 2024, 2025):
              url = nh.player_stats_url(season)
              response = session.get(url, timeout=60)
              response.raise_for_status()
              digest = hashlib.sha256(response.content).hexdigest()
              if digest != PLAYER_SHA[season]:
                  raise SystemExit(
                      f"{season}: player source drift {digest}"
                  )
              rows = list(csv.DictReader(io.StringIO(response.text)))
              if not rows:
                  raise SystemExit(f"{season}: empty player source")
              (EVIDENCE_ROOT / "model_sources" / f"stats_player_week_{season}.csv").write_bytes(
                  response.content
              )
              player_rows_by_season[season] = rows
              all_history_rows.extend(rows)

          def effective_targets(row):
              targets = finite(row.get("targets")) or 0.0
              receptions = finite(row.get("receptions")) or 0.0
              return max(targets, receptions)

          role_rows = []
          for row in all_history_rows:
              if effective_targets(row) <= 0:
                  continue
              player_id = str(row.get("player_id") or "").strip()
              week = finite(row.get("week"))
              season = finite(row.get("season"))
              receptions = finite(row.get("receptions"))
              if not player_id or week is None or season is None or receptions is None:
                  continue
              role_rows.append({
                  "player_id": player_id,
                  "season": int(season),
                  "week": int(week),
                  "season_type": str(row.get("season_type") or ""),
                  "effective_targets": effective_targets(row),
                  "receptions": receptions,
              })
          role_rows.sort(key=lambda r: (r["season"], r["week"], r["player_id"]))

          # Residual pool is restricted to exactly the rows the drift check
          # below verifies (2024+2025 REG), mirroring the passing-yards
          # workflow's own residual-population restriction (its pooled-n
          # check covers precisely its two benchmarked seasons, not the full
          # multi-year history used only to build rolling context).
          history_by_player = defaultdict(lambda: deque(maxlen=5))
          residuals = []
          scored_by_season = defaultdict(list)
          for row in role_rows:
              appearances = history_by_player[row["player_id"]]
              if (
                  len(appearances) >= MIN_HISTORY
                  and statistics.fmean(a["effective_targets"] for a in appearances) > 0
              ):
                  b0 = statistics.fmean(a["receptions"] for a in appearances)
                  if row["season_type"] == "REG" and row["season"] in EXPECTED_B0:
                      scored_by_season[row["season"]].append((b0, row["receptions"]))
                      residuals.append(row["receptions"] - b0)
              appearances.append(row)

          benchmark_check = {}
          for season, expected in EXPECTED_B0.items():
              scored = scored_by_season[season]
              if len(scored) != expected["n"]:
                  raise SystemExit(
                      f"{season}: B0 population drift {len(scored)} != {expected['n']}"
                  )
              mae = statistics.fmean(abs(p - a) for p, a in scored)
              if not math.isclose(mae, expected["mae"], rel_tol=0.0, abs_tol=1e-9):
                  raise SystemExit(
                      f"{season}: B0 MAE drift {mae} != {expected['mae']}"
                  )
              benchmark_check[str(season)] = {"n": len(scored), "mae": mae}

          if len(residuals) != EXPECTED_POOLED_RESIDUALS:
              raise SystemExit(
                  f"pooled B0 residual population drift: {len(residuals)} != {EXPECTED_POOLED_RESIDUALS}"
              )

          # Current player history for Sunday projection. 2025 POST
          # appearances remain legitimate prior information for 2026 Week 1.
          # receptions_shadow.current_b0_projection computes its own
          # effective_targets internally from raw targets/receptions, so raw
          # fields are passed through unmodified here.
          prior_by_player = defaultdict(list)
          for row in player_rows_by_season[2025]:
              player_id = str(row.get("player_id") or "").strip()
              if not player_id:
                  continue
              targets = finite(row.get("targets"))
              receptions = finite(row.get("receptions"))
              week = finite(row.get("week"))
              if targets is None or receptions is None or week is None:
                  continue
              prior_by_player[player_id].append({
                  "season": 2025,
                  "week": int(week),
                  "season_type": str(row.get("season_type") or ""),
                  "targets": targets,
                  "receptions": receptions,
                  "team": str(row.get("team") or "").strip().upper(),
              })
          for rows in prior_by_player.values():
              rows.sort(
                  key=lambda x: (
                      x["season"],
                      x["week"],
                      x["season_type"],
                  )
              )

          # ---------- live FanDuel primary receiving state ----------
          root = fanduel_nfl._fetch_first_healthy_host(
              "root_nfl_page",
              f"content-managed-page?page=CUSTOM&customPageId=nfl&_ak={fanduel_nfl.AK}",
              {"feed": "nfl root", "audit": "receptions_shadow_board"},
              session,
          )
          if root.outcome != CHECKED_AND_FOUND:
              raise SystemExit(
                  f"FanDuel root not conclusive: {root.outcome} {root.failure_reason}"
              )

          (EVIDENCE_ROOT / "raw" / "fanduel" / "root_nfl_page.json").write_bytes(
              root.body
          )
          discovered = fanduel_nfl.discover_events(root.body)
          slate_events = [
              event for event in discovered
              if local_slate(event.get("open_date")) == TARGET_DATE
          ]
          root_observed_dt = parse_iso(root.observed_at)
          if root_observed_dt is None:
              raise SystemExit(
                  f"unparseable FanDuel observation time: {root.observed_at}"
              )
          sunday_events = []
          for event in slate_events:
              event_dt = parse_iso(event.get("open_date"))
              if event_dt is None:
                  continue
              if event_dt > root_observed_dt:
                  sunday_events.append(event)
          if not sunday_events:
              raise SystemExit(
                  f"no pregame FanDuel events remain for CT date {TARGET_DATE}"
              )

          normalized = []
          market_failures = []
          for event in sunday_events:
              event_id = event["event_id"]
              ctx = {
                  "event_id": event_id,
                  "event_name": event["name"],
                  "open_date": event.get("open_date"),
                  "audit": "receptions_shadow_board",
              }
              baseline = fanduel_nfl._fetch_first_healthy_host(
                  f"event_{event_id}_no_tab",
                  f"event-page?eventId={event_id}&_ak={fanduel_nfl.AK}",
                  {**ctx, "tab": None},
                  session,
              )
              baseline_ids = fanduel_nfl._market_ids(baseline.body)
              receiving = fanduel_nfl._fetch_first_healthy_host(
                  f"event_{event_id}_tab_receiving-props",
                  (
                      f"event-page?eventId={event_id}&tab=receiving-props"
                      f"&_ak={fanduel_nfl.AK}"
                  ),
                  {**ctx, "tab": "receiving-props"},
                  session,
              )
              receiving = fanduel_nfl._classify_tab_payload(
                  receiving,
                  baseline_ids,
              )
              if receiving.outcome != CHECKED_AND_FOUND:
                  market_failures.append({
                      "event_id": str(event_id),
                      "event_name": event["name"],
                      "outcome": receiving.outcome,
                      "failure_reason": receiving.failure_reason,
                      "context": receiving.context,
                  })
                  continue
              payload_path = (
                  EVIDENCE_ROOT / "raw" / "fanduel"
                  / f"event_{event_id}_receiving-props.json"
              )
              payload_path.write_bytes(receiving.body)
              payload_sha = hashlib.sha256(receiving.body).hexdigest()
              payload = json.loads(receiving.body)
              result = normalize_payload(
                  payload,
                  captured_at=receiving.observed_at,
              )
              # This board only prospects the primary `receptions` market from
              # this tab -- `receiving_yards` and the alt-ladder families are
              # out of scope for this board (a separate research surface).
              receptions_only = [
                  c for c in result["candidates"] if c.get("market") == "receptions"
              ]
              for candidate in receptions_only:
                  candidate["source_payload_sha256"] = payload_sha
                  candidate["source_url"] = receiving.url
              normalized.extend(receptions_only)
              relevant_rejections = [
                  rej for rej in result["rejections"]
                  if str(rej.get("market_type") or "") in (
                      "PLAYER_X_RECEPTIONS_HIGH", "PLAYER_X_RECEPTIONS_LOW",
                  )
              ]
              if relevant_rejections:
                  market_failures.extend([
                      {
                          "event_id": str(event_id),
                          "event_name": event["name"],
                          "outcome": "NORMALIZER_REJECTION",
                          **rej,
                      }
                      for rej in relevant_rejections
                  ])

          # De-duplicate exact market observations in case upstream discovery
          # repeated one event.
          uniq = {}
          for row in normalized:
              key = (
                  row["event_id"],
                  row["market_id"],
                  row["player_name"],
                  row["line"],
              )
              if key in uniq:
                  raise SystemExit(f"duplicate normalized market: {key}")
              uniq[key] = row
          normalized = list(uniq.values())

          # ---------- durable identity ----------
          bound = [
              bind_player_prop_candidate(c, roster, season=2026)
              for c in normalized
          ]
          binding_counts = Counter(
              row["binding_status"] for row in bound
          )

          # ---------- live official inactive reports ----------
          official_records = official_nfl.capture(session=session)
          bound_reports = []
          report_failures = []
          for record in official_records:
              if not record.artifact.startswith("inactive_report_"):
                  continue
              if record.outcome != CHECKED_AND_FOUND or not record.body:
                  report_failures.append({
                      "artifact": record.artifact,
                      "outcome": record.outcome,
                      "failure_reason": record.failure_reason,
                  })
                  continue
              try:
                  safe_name = "".join(
                      ch if ch.isalnum() or ch in "._-" else "_"
                      for ch in record.artifact
                  )
                  (EVIDENCE_ROOT / "raw" / "official_nfl" / f"{safe_name}.html").write_bytes(
                      record.body
                  )
                  parsed = parse_report(record.body)
                  rebound = bind_report(
                      parsed,
                      roster,
                      season=2026,
                  )
                  rebound["report_observed_at"] = record.observed_at
                  bound_reports.append(rebound)
              except Exception as exc:
                  report_failures.append({
                      "artifact": record.artifact,
                      "outcome": "PARSE_OR_BIND_FAILED",
                      "failure_reason": f"{type(exc).__name__}: {exc}",
                  })

          # ---------- projection, score, availability, quarantine ----------
          snapshot_records = []
          challenger_snapshot_records = []
          challenger_build_failures = []
          excluded_unbound = []
          quarantine_counts = Counter()
          history_counts = Counter()

          for row in bound:
              if row["binding_status"] != "BOUND":
                  excluded_unbound.append(row)
                  continue

              availability = evaluate_candidate(
                  row,
                  bound_reports,
              )
              quarantine_reasons = []
              if not availability["availability_gate_pass"]:
                  quarantine_reasons.append(
                      availability["availability_status"]
                  )

              projection = None
              score = None
              history = prior_by_player.get(row["gsis_id"], [])
              try:
                  projection_info = current_b0_projection(history)
                  projection = float(projection_info["projection"])
                  history_counts["ELIGIBLE"] += 1
                  score = score_shadow_candidate(
                      projection=projection,
                      line=row["line"],
                      over_odds=row["over_odds"],
                      under_odds=row["under_odds"],
                      residuals=residuals,
                  )
              except ValueError:
                  history_counts["INSUFFICIENT_HISTORY"] += 1
                  quarantine_reasons.append("INSUFFICIENT_HISTORY")

              decision = (
                  "SHADOW_ONLY"
                  if not quarantine_reasons and score is not None
                  else "QUARANTINED"
              )
              for reason in quarantine_reasons:
                  quarantine_counts[reason] += 1

              record = {
                  **row,
                  **availability,
                  "decision_status": decision,
                  "quarantine_reasons": sorted(set(quarantine_reasons)),
                  "model_name": "NFL_B0_ROLLING_RECEPTIONS_V0",
                  "model_projection": projection,
                  "model_history_n": (
                      min(len(history), 5) if projection is not None else len(history)
                  ),
                  "model_scoring_status": (
                      "SCORED" if score is not None else "NOT_SCORED"
                  ),
              }
              if score is not None:
                  record.update(score)
                  record["decision_status"] = decision

              snapshot_records.append(record)

              # ---- research-only paired challenger record (identical inputs, same gate) ----
              if score is not None:
                  try:
                      comparison = compare_b0_vs_frozen_challenger(
                          projection=projection,
                          line=row["line"],
                          b0_over=score["model_over_probability"],
                          b0_under=score["model_under_probability"],
                          over_price=row["over_odds"],
                          under_price=row["under_odds"],
                      )
                      challenger_snapshot_records.append(build_challenger_snapshot_record(
                          event_id=row["event_id"], market_id=row["market_id"],
                          gsis_id=row["gsis_id"], player_name=row["player_name"],
                          team=row["team"], event_open_date=row["event_open_date"],
                          line=row["line"], over_odds=row["over_odds"],
                          under_odds=row["under_odds"], captured_at=row["captured_at"],
                          availability_status=availability["availability_status"],
                          decision_status=decision, b0_score=score,
                          challenger_comparison=comparison,
                          challenger_model_version=CHALLENGER_MODEL_VERSION,
                          source_vintage="nflverse_2023_2024_2025_weekly_stats_verified",
                          feature_cutoff="2025_REG_final_week",
                      ))
                  except Exception as exc:
                      # Research-only lane. Never let a challenger-side failure
                      # affect the primary B0 record already appended above.
                      challenger_build_failures.append({
                          "event_id": row.get("event_id"),
                          "gsis_id": row.get("gsis_id"),
                          "failure_reason": f"{type(exc).__name__}: {exc}",
                      })

          sealed_at = utcnow()
          validate_pregame_timing(snapshot_records, sealed_at)
          source_vintage = (
              max(
                  (
                      str(r.get("captured_at") or "")
                      for r in snapshot_records
                  ),
                  default=sealed_at,
              )
              or sealed_at
          )
          snapshot = seal_snapshot(
              snapshot_records,
              slate_date=TARGET_DATE,
              code_sha=os.environ["FULL_COUNT_CODE_SHA"],
              source_vintage=source_vintage,
              sealed_at=sealed_at,
          )

          # Separate, independently sealed research artifact -- never merged
          # into `snapshot`/`board` above, never read by any B0 decision.
          challenger_snapshot = seal_challenger_snapshot(
              challenger_snapshot_records,
              slate_date=TARGET_DATE,
              code_sha=os.environ["FULL_COUNT_CODE_SHA"],
              source_vintage=source_vintage,
              sealed_at=sealed_at,
          )
          challenger_path = (
              EVIDENCE_ROOT / "nfl-receptions-challenger-comparison.json"
          )
          with challenger_path.open("w", encoding="utf-8") as f:
              json.dump({
                  "analysis": "NFL_RECEPTIONS_B0_VS_FROZEN_CHALLENGER_PAIRED_PROSPECTIVE",
                  "status": "RESEARCH_ONLY_NOT_PROMOTED",
                  "created_at": sealed_at,
                  "code_sha": os.environ["FULL_COUNT_CODE_SHA"],
                  "target_local_date": TARGET_DATE,
                  "challenger_model_version": CHALLENGER_MODEL_VERSION,
                  "build_failures": challenger_build_failures,
                  "snapshot": challenger_snapshot,
              }, f, indent=2, sort_keys=True)

          board = {
              "analysis": "NFL_LIVE_RECEPTIONS_SHADOW_BOARD_AUDIT",
              "status": "RESEARCH_ONLY_NO_PUBLICATION",
              "created_at": sealed_at,
              "code_sha": os.environ["FULL_COUNT_CODE_SHA"],
              "target_local_date": TARGET_DATE,
              "fan_duel": {
                  "root_observed_at": root.observed_at,
                  "events_discovered_total": len(discovered),
                  "target_sunday_events": len(slate_events),
                  "pregame_target_events": len(sunday_events),
                  "normalized_primary_candidates": len(normalized),
                  "market_failures": market_failures,
              },
              "identity": {
                  "roster_sha256": roster_sha,
                  "binding_status_counts": dict(binding_counts),
                  "excluded_unbound_count": len(excluded_unbound),
                  "excluded_unbound": excluded_unbound,
              },
              "model": {
                  "name": "NFL_B0_ROLLING_RECEPTIONS_V0",
                  "historical_benchmark_check": benchmark_check,
                  "pooled_residual_n": len(residuals),
                  "current_history_status_counts": dict(history_counts),
                  "public_selector_validated": False,
                  "decision_surface": "SHADOW_ONLY_OR_QUARANTINED",
              },
              "availability": {
                  "official_records": len(official_records),
                  "bound_inactive_reports": len(bound_reports),
                  "report_failures": report_failures,
                  "quarantine_reason_counts": dict(quarantine_counts),
              },
              "snapshot": snapshot,
          }

          path = EVIDENCE_ROOT / "nfl-live-receptions-shadow-board.json"
          with path.open("w", encoding="utf-8") as f:
              json.dump(board, f, indent=2, sort_keys=True)

          print(json.dumps({
              "target_local_date": TARGET_DATE,
              "target_events_total": len(slate_events),
              "pregame_target_events": len(sunday_events),
              "primary_candidates": len(normalized),
              "binding_status_counts": dict(binding_counts),
              "history_status_counts": dict(history_counts),
              "bound_inactive_reports": len(bound_reports),
              "quarantine_reason_counts": dict(quarantine_counts),
              "decision_counts": dict(Counter(
                  r["decision_status"] for r in snapshot["records"]
              )),
              "snapshot_sha256": snapshot["snapshot_sha256"],
              "record_count": snapshot["record_count"],
              "challenger_snapshot_sha256": challenger_snapshot["snapshot_sha256"],
              "challenger_record_count": challenger_snapshot["record_count"],
              "challenger_build_failure_count": len(challenger_build_failures),
          }, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: nfl-live-receptions-shadow-board
          path: /tmp/nfl-receptions-shadow-evidence
          retention-days: 90
