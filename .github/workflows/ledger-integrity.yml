name: Public Ledger Integrity

# Fails if a push to main drops a canonical identity from the immutable public
# evidence estate.
#
# WHY THIS EXISTS. On 2026-09-03 main was force-pushed onto an unmerged branch.
# 153 commits vanished, and with them 12 identities from the graded ledger and 6
# from the publication registry. It went unnoticed for 20 minutes and was found
# by accident, not by any check.
#
# DETECTION, NOT PREVENTION. This runs AFTER a push is accepted. The only
# prevention is a server-side ruleset on refs/heads/main blocking force pushes
# and deletions, configured at GitHub. A push that deletes or edits this
# workflow cannot be caught by this workflow -- an in-repository check cannot
# police its own removal. That gap is real and is not engineered around here.
#
# NO paths: FILTER, deliberately. The 2026-09-03 force-push introduced commits
# touching only .claude/, .github/, .gitignore and CLAUDE.md -- verified, zero
# intersection with results/ or data/public_top_picks/. A paths filter scoped to
# the ledger would have skipped the run and missed the very incident this
# exists to catch. The repository is public, so Actions minutes are free and
# running on every push costs nothing worth optimising.
on:
  push:
    branches: [main]
  # The push trigger alone was NOT ENOUGH, and this is the gap it left.
  # Every pipeline commit is pushed by GitHub Actions using the default
  # GITHUB_TOKEN, and GitHub deliberately does not start new workflow runs from
  # those pushes (it prevents recursion). Measured: 3,077 commits landed on main
  # after this workflow shipped and it ran ONCE -- on the one push made with a
  # user credential. The Test Suite has likewise never run on a pipeline commit.
  # So the push trigger covers exactly the class that caused the 2026-09-03
  # incident (a user-credentialed force push) and misses the more likely
  # everyday failure: the pipeline itself dropping ledger rows in a bad merge.
  # A schedule fires regardless of who pushed.
  # Hourly, not six-hourly, for as long as main has NO server-side ruleset.
  # Detection latency is the only lever left while prevention is missing, and
  # it is not academic: during the 2026-09-03 incident six pipeline commits
  # landed on the broken lineage in the twenty minutes before anyone noticed,
  # so every hour of delay is more state built on top of damage and more to
  # reconcile. The repository is public, so the runs are free. Widen this back
  # out once a ruleset actually blocks force pushes and deletions.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

# Read-only. This job holds no push credential, writes nothing back, opens no
# issue or PR, and never attempts a repair. A red check is the whole output.
permissions:
  contents: read

# Queue, never cancel. cancel-in-progress would coalesce a burst of pipeline
# pushes and silently skip the intermediate transitions -- which is exactly
# where a loss could hide.
concurrency:
  group: ledger-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monotonic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Commits and trees only; the few JSON blobs actually compared are
          # fetched on demand. Keeps a large-history repo cheap to check.
          filter: blob:none

      - name: Report whether this push rewrote history
        if: github.event_name == 'push'
        run: |
          if [ "${{ github.event.forced }}" = "true" ]; then
            echo "::error::This push to main was a FORCE PUSH (history rewrite)."
            echo "Only Jacob may rewrite main, and the pipeline never needs to."
            exit 1
          fi
          echo "Not a force push."

      - name: Public ledger monotonicity
        run: |
          AFTER='${{ github.sha }}'
          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE='${{ github.event.before }}'
            # All-zero `before` means the ref was just created; there is no
            # prior estate to compare against, so there is nothing to verify.
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "Branch creation; no prior estate to compare."
              exit 0
            fi
          else
            # Schedule and manual runs get no `before`, so anchor on main as it
            # stood one window back. Endpoints are what matter: damage present
            # at both ends is caught. A loss that appeared and was repaired
            # inside the window is missed, which is the accepted cost of a
            # stateless check -- durable damage is the thing worth catching.
            BEFORE="$(git rev-list -1 --before='90 minutes ago' origin/main)"
            echo "schedule mode: baseline $BEFORE"
          fi
          # An unresolvable baseline is the failure mode this guard exists for.
          # A shallow or partial clone makes `git rev-list --before` return an
          # EMPTY string, which without this check would sail through as a pass.
          # Found while validating locally against a shallow clone, before this
          # workflow ever shipped.
          if [ -z "$BEFORE" ]; then
            echo "::error::Could not resolve a baseline commit to compare against."
            echo "Most likely the checkout lacks history (needs fetch-depth: 0)."
            echo "Missing evidence is not a pass -- failing closed."
            exit 1
          fi
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "::error::Cannot read baseline commit $BEFORE."
            echo "The prior estate is unreachable, so no verdict is possible."
            echo "Missing evidence is not a pass -- failing closed."
            exit 1
          fi
          python3 ledger_integrity.py "$BEFORE" "$AFTER"
