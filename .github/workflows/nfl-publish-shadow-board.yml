name: NFL Shadow Board Publish

# Website bridge only: sealed research artifact -> public-safe docs/nfl/data.json.
# It never scores, grades, changes eligibility, or creates a public pick.
on:
  workflow_run:
    workflows: [NFL Live Passing-Yards Shadow Board Audit]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful main-branch NFL shadow-board run ID to publish
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: nfl-shadow-board-publish
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify source run is the exact successful main-branch shadow workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          run_id = os.environ["SOURCE_RUN_ID"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "full-count-nfl-shadow-publisher",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              run = json.load(response)
          expected = {
              "name": "NFL Live Passing-Yards Shadow Board Audit",
              "head_branch": "main",
              "conclusion": "success",
          }
          actual = {key: run.get(key) for key in expected}
          if actual != expected:
              raise SystemExit(f"refusing source run {run_id}: expected {expected}, got {actual}")
          print(json.dumps({"source_run_id": int(run_id), "head_sha": run.get("head_sha"), **actual}, sort_keys=True))
          PY

      - name: Download exact sealed shadow artifact
        uses: actions/download-artifact@v4
        with:
          name: nfl-live-passing-yards-shadow-board
          path: ${{ runner.temp }}/nfl-shadow-source
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Build public-safe NFL website payload
        run: |
          set -euo pipefail
          source_board="$(find "$RUNNER_TEMP/nfl-shadow-source" -type f -name 'nfl-live-passing-yards-shadow-board.json' -print -quit)"
          if [ -z "$source_board" ] || [ ! -f "$source_board" ]; then
            echo "::error::Downloaded artifact did not contain nfl-live-passing-yards-shadow-board.json"
            exit 1
          fi
          PYTHONPATH=. python3 nfl/web/build_shadow_site.py --input "$source_board" --output "$RUNNER_TEMP/nfl-public-data.json" --source-run-id "$SOURCE_RUN_ID" --publisher-code-sha "$(git rev-parse HEAD)"
          cmp nfl/web/static/index.html docs/nfl/index.html
          cmp nfl/web/static/app.css docs/nfl/app.css
          cmp nfl/web/static/app.js docs/nfl/app.js

      - name: Run NFL website safety tests
        run: PYTHONPATH=. python3 nfl/tests/test_nfl_web_shadow.py

      - name: Commit only the derived NFL website payload
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/nfl-public-data.json" "$RUNNER_TEMP/nfl-public-data.candidate.json"
          git config user.name "nfl-shadow-pipeline-bot"
          git config user.email "actions@github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout --detach origin/main
            mkdir -p docs/nfl
            verdict="$(python3 nfl/web/publish_guard.py --current docs/nfl/data.json --candidate "$RUNNER_TEMP/nfl-public-data.candidate.json")"
            if [ "$verdict" = "SAME" ]; then
              echo "NFL website already carries this exact sealed snapshot."
              exit 0
            fi
            if [ "$verdict" != "NEWER" ]; then
              echo "::error::Unexpected NFL publication verdict: $verdict"
              exit 1
            fi
            cp "$RUNNER_TEMP/nfl-public-data.candidate.json" docs/nfl/data.json
            git add -- docs/nfl/data.json
            staged="$(git diff --cached --name-only)"
            if [ -z "$staged" ]; then
              echo "NFL website payload already current."
              exit 0
            fi
            if [ "$staged" != "docs/nfl/data.json" ]; then
              echo "::error::Refusing to commit unexpected staged paths: $staged"
              exit 1
            fi
            git commit -m "Update NFL research shadow board from run $SOURCE_RUN_ID"
            if git push origin HEAD:main; then
              echo "Published derived NFL website payload on attempt $attempt."
              exit 0
            fi
            echo "Push raced current main (attempt $attempt/5); retrying from newest main."
          done
          echo "::error::Failed to persist NFL website payload after 5 attempts."
          exit 1
