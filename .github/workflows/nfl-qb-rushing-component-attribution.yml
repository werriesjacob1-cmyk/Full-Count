name: NFL QB Rushing Component Attribution

# Research-only diagnosis of the already-observed 2024/2025 QB rush-attempt
# behavior. No new challenger, no fitted weights, no promotion.
on:
  push:
    branches:
      - superchad/nfl-foundation-continuation-20260911
    paths:
      - .github/workflows/nfl-qb-rushing-component-attribution.yml
      - nfl/research/qb_rushing_components.py
      - nfl/research/b1_attribution.py
      - nfl/research/b1_history.py
      - nfl/research/b1_evaluate.py
      - nfl/research/nflverse_history.py

permissions:
  contents: read

jobs:
  attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install 'requests~=2.34.2'

      - name: Attribute QB rushing error by process
        env:
          FULL_COUNT_CODE_SHA: ${{ github.sha }}
        run: |
          PYTHONPATH=. python3 - <<'PY'
          import csv, gzip, hashlib, io, json, math, os, statistics
          from collections import defaultdict, deque
          from datetime import datetime, timezone
          import requests

          from nfl.research import b1_attribution as attrib
          from nfl.research import nflverse_history as nh
          from nfl.research.b1_evaluate import paired_error_rows
          from nfl.research.b1_history import TEAM_REQUIRED_COLUMNS, build_b1_rows
          from nfl.research.qb_rushing_components import (
              aggregate_components, classify_qb_rush,
          )

          SEASONS=(2023,2024,2025)
          WINDOW=5
          MIN_HISTORY=3
          MIN_TEAM_HISTORY=3
          EPS=1e-10
          PLAYER_SHA={
            2023:"f19cb71a5de0dce7fd09376026237c9ee9d5a93fe13815a2ea3ec2d37204cb17",
            2024:"3ddc45a84f759aa348ce465ae001752c530575455717657cdfe1f8abfcdb4759",
            2025:"e5e0615b3d96a3eaebfaee91e55afb4a4e7fe0caf057454177bcd7d6ad4bcfc2",
          }
          TEAM_SHA={
            2023:"dc5a387daabe8663deaddac492ad7020d47fb1a66048690b355b406cd8e4c454",
            2024:"b207a1430c2715d03bbf1844c4eae98695f364851ff6025f422febc2c13f5255",
            2025:"91058a59d894855377b2f39f40c4e7bdbeef96d12144289dc68215209a1c93cb",
          }
          PBP_SHA={
            2023:"4649804ee0f0a40b41e51ec75a1ce921949d7fab5459213488656b92f78560e8",
            2024:"23370d5d10f8104d80d46a1fc5e61f4f6f5a3263fe96fe2dd629913cfcb08c06",
            2025:"2f135887790a013fd004e609e37096bb4816d5cc80b9f19122e1bad478961978",
          }
          EXPECTED={2024:615,2025:617}
          COMPONENTS=("designed_rush","scramble","kneel")

          def truth(v):
              if v in (None,"",0,0.0,"0","0.0",False): return False
              if v in (1,1.0,"1","1.0",True): return True
              try: return float(v)==1.0
              except (TypeError,ValueError): return False

          def pkey(r):
              return (int(r["season"]),int(r["week"]),str(r["season_type"]),str(r["player_id"]))

          def stat(rows, component, scaled):
              if not rows: return {"n":0,"mae":None,"bias":None}
              actual=[r[f"actual_{component}"] for r in rows]
              pred=[r[f"{'scaled' if scaled else 'base'}_{component}"] for r in rows]
              err=[p-a for p,a in zip(pred,actual)]
              return {
                "n":len(rows),
                "mae":statistics.fmean(abs(e) for e in err),
                "bias":statistics.fmean(err),
                "mean_prediction":statistics.fmean(pred),
                "mean_actual":statistics.fmean(actual),
              }

          s=requests.Session()
          s.headers.update({"User-Agent":"Full-Count QB component attribution"})
          players=[]; teams=[]; qbids=defaultdict(set); sources={"player":{},"team":{},"pbp":{}}
          for season in SEASONS:
              u=nh.player_stats_url(season); r=s.get(u,timeout=60); r.raise_for_status()
              d=hashlib.sha256(r.content).hexdigest()
              if d!=PLAYER_SHA[season]: raise SystemExit(f"{season} player SHA drift")
              rows=list(csv.DictReader(io.StringIO(r.text))); players+=rows
              for row in rows:
                  if str(row.get("position") or "").strip().upper()=="QB":
                      pid=str(row.get("player_id") or "").strip()
                      if pid: qbids[season].add(pid)
              sources["player"][str(season)]={"rows":len(rows),"sha256":d,"url":u}

              u=("https://github.com/nflverse/nflverse-data/releases/download/"
                 f"stats_team/stats_team_week_{season}.csv")
              r=s.get(u,timeout=60); r.raise_for_status(); d=hashlib.sha256(r.content).hexdigest()
              if d!=TEAM_SHA[season]: raise SystemExit(f"{season} team SHA drift")
              rows=list(csv.DictReader(io.StringIO(r.text)))
              if sorted(TEAM_REQUIRED_COLUMNS-set(rows[0])): raise SystemExit("team schema drift")
              teams+=rows; sources["team"][str(season)]={"rows":len(rows),"sha256":d,"url":u}

          raw=defaultdict(list)
          for season in SEASONS:
              u=("https://github.com/nflverse/nflverse-data/releases/download/"
                 f"pbp/play_by_play_{season}.csv.gz")
              r=s.get(u,timeout=120); r.raise_for_status(); d=hashlib.sha256(r.content).hexdigest()
              if d!=PBP_SHA[season]: raise SystemExit(f"{season} PBP SHA drift")
              n=0
              with gzip.GzipFile(fileobj=io.BytesIO(r.content)) as gz:
                  reader=csv.DictReader(io.TextIOWrapper(gz,encoding="utf-8",newline=""))
                  for row in reader:
                      n+=1
                      pid=str(row.get("rusher_player_id") or "").strip()
                      if not pid or pid not in qbids[season]: continue
                      if not (truth(row.get("rush_attempt")) or truth(row.get("qb_kneel")) or truth(row.get("qb_scramble"))): continue
                      obs=classify_qb_rush(row,is_qb=True)
                      if obs is None: continue
                      key=(season,int(float(row["week"])),str(row.get("season_type") or ""),pid)
                      raw[key].append(obs)
              sources["pbp"][str(season)]={"rows":n,"sha256":d,"url":u}

          actual={k:aggregate_components(v) for k,v in raw.items()}
          prior=nh.build_prior_only_rows(players,rolling_window=WINDOW)
          hist=defaultdict(lambda:deque(maxlen=WINDOW))
          features={}
          for row in prior:
              if str(row.get("position") or "").strip().upper()!="QB": continue
              key=pkey(row); cur=actual.get(key,aggregate_components([]))
              if abs(float(cur["carries"])-float(row["target"]["carries"]))>EPS:
                  raise SystemExit(f"carry reconciliation failed {key}")
              h=hist[row["player_id"]]
              feat={}
              for comp in COMPONENTS:
                  name=f"{comp}_attempts"
                  feat[comp]=(statistics.fmean(float(x[name]) for x in h) if h else None)
              feat["history_n"]=len(h); features[key]=feat; h.append(cur)

          built=build_b1_rows(players,teams,rolling_window=WINDOW)
          index={pkey(r):r for r in built}
          reports={}
          for season,label in ((2024,"2024_development"),(2025,"2025_descriptive")):
              pairs=paired_error_rows(
                  built,"rush_attempts",test_season=season,test_season_type="REG",
                  min_history=MIN_HISTORY,min_team_history=MIN_TEAM_HISTORY,
              )
              out=[]
              for pair in pairs:
                  key=(int(pair["season"]),int(pair["week"]),"REG",str(pair["player_id"]))
                  row=index[key]
                  if str(row.get("position") or "").strip().upper()!="QB": continue
                  f=features[key]
                  if f["history_n"]<MIN_HISTORY: raise SystemExit("history mismatch")
                  scale=float(attrib.opportunity_components(row,"rush_attempts")["team_window_scale"])
                  cur=actual.get(key,aggregate_components([]))
                  rec={
                    "b0":float(pair["b0_prediction"]),
                    "b1":float(pair["b1_prediction"]),
                    "actual_total":float(pair["actual"]),
                    "scale":scale,
                  }
                  base_total=0.0; scaled_total=0.0
                  for comp in COMPONENTS:
                      base=float(f[comp]); act=float(cur[f"{comp}_attempts"])
                      rec[f"base_{comp}"]=base
                      rec[f"scaled_{comp}"]=base*scale
                      rec[f"actual_{comp}"]=act
                      base_total+=base; scaled_total+=base*scale
                  if abs(base_total-rec["b0"])>EPS: raise SystemExit(f"B0 component identity failed {key}")
                  if abs(scaled_total-rec["b1"])>EPS: raise SystemExit(f"B1 component identity failed {key}")
                  out.append(rec)
              if len(out)!=EXPECTED[season]: raise SystemExit(f"{label} population drift {len(out)}")

              comp_report={}
              for comp in COMPONENTS:
                  base=stat(out,comp,False); scaled=stat(out,comp,True)
                  comp_report[comp]={
                    "base":base,
                    "team_scaled":scaled,
                    "delta_mae_scaled_minus_base":scaled["mae"]-base["mae"],
                  }

              reports[label]={
                "population_n":len(out),
                "components":comp_report,
                "component_actual_attempt_share":{
                  comp:sum(r[f"actual_{comp}"] for r in out)/sum(r["actual_total"] for r in out)
                  for comp in COMPONENTS
                },
                "large_upscale_components":{
                  comp:{
                    "n":len([r for r in out if r["scale"]>1.10]),
                    "base_mae":stat([r for r in out if r["scale"]>1.10],comp,False)["mae"],
                    "scaled_mae":stat([r for r in out if r["scale"]>1.10],comp,True)["mae"],
                  } for comp in COMPONENTS
                },
                "large_downscale_components":{
                  comp:{
                    "n":len([r for r in out if r["scale"]<0.90]),
                    "base_mae":stat([r for r in out if r["scale"]<0.90],comp,False)["mae"],
                    "scaled_mae":stat([r for r in out if r["scale"]<0.90],comp,True)["mae"],
                  } for comp in COMPONENTS
                },
              }

          output={
            "analysis":"NFL_QB_RUSH_ATTEMPT_COMPONENT_ATTRIBUTION",
            "status":"research_only",
            "created_at":datetime.now(timezone.utc).isoformat(),
            "code_sha":os.environ["FULL_COUNT_CODE_SHA"],
            "source_integrity":{"carry_reconstruction_exact_required":True},
            "sources":sources,
            "reports":reports,
            "interpretation_rule":(
              "Use this only to identify which football process current B1 scaling harms. "
              "Do not tune a new coefficient from these same seasons. Preserve 2023 for the next preregistered challenger."
            ),
          }
          path="/tmp/nfl-qb-rushing-component-attribution.json"
          with open(path,"w",encoding="utf-8") as f: json.dump(output,f,indent=2,sort_keys=True)
          print(json.dumps(output,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: nfl-qb-rushing-component-attribution
          path: /tmp/nfl-qb-rushing-component-attribution.json
          retention-days: 30
