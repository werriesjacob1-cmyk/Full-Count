name: NFL B1 Team Source Schema Probe

on:
  push:
    branches:
      - superchad/nfl-foundation-continuation-20260911
    paths:
      - .github/workflows/nfl-b1-team-schema-probe.yml
      - nfl/research/b1_history.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install 'requests~=2.34.2'
      - name: Verify nflverse weekly team source
        run: |
          PYTHONPATH=. python3 - <<'PY'
          import csv, io, json, requests
          from nfl.research.b1_history import TEAM_REQUIRED_COLUMNS

          base = (
              "https://github.com/nflverse/nflverse-data/releases/download/"
              "stats_team/stats_team_week_{season}.csv"
          )
          session = requests.Session()
          session.headers.update({
              "User-Agent": "Full-Count NFL B1 team source probe (read-only)"
          })
          report = {}
          for season in (2023, 2024, 2025):
              url = base.format(season=season)
              r = session.get(url, timeout=60)
              r.raise_for_status()
              rows = list(csv.DictReader(io.StringIO(r.text)))
              header = set(rows[0].keys()) if rows else set()
              missing = sorted(TEAM_REQUIRED_COLUMNS - header)
              if missing:
                  raise SystemExit(
                      f"{season}: missing B1 team columns: {missing}"
                  )
              keys = [
                  (x["season"], x["week"], x["season_type"], x["team"])
                  for x in rows
              ]
              if len(keys) != len(set(keys)):
                  raise SystemExit(f"{season}: duplicate team/week keys")
              report[season] = {
                  "url": url,
                  "bytes": len(r.content),
                  "rows": len(rows),
                  "required_columns_missing": missing,
                  "weeks": sorted({
                      int(float(x["week"])) for x in rows if x.get("week")
                  }),
                  "teams": len({x["team"] for x in rows if x.get("team")}),
              }
          print(json.dumps(report, indent=2, sort_keys=True))
          print("PASS: B1 nflverse weekly-team source schema is intact")
          PY
