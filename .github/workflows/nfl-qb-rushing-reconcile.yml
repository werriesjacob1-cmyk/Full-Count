name: NFL QB Rushing Source Reconciliation

# Research-only source audit. Before component-aware QB rushing can enter any
# challenger, prove what nflverse play-by-play actually reconstructs against the
# official weekly-stat surface used by B0/B1.
on:
  push:
    branches:
      - superchad/nfl-foundation-continuation-20260911
    paths:
      - .github/workflows/nfl-qb-rushing-reconcile.yml
      - nfl/research/qb_rushing_components.py

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install 'requests~=2.34.2'

      - name: Reconcile QB rushing components to weekly stats
        env:
          FULL_COUNT_CODE_SHA: ${{ github.sha }}
        run: |
          PYTHONPATH=. python3 - <<'PY'
          import csv
          import gzip
          import hashlib
          import io
          import json
          import math
          import os
          from collections import Counter, defaultdict
          from datetime import datetime, timezone

          import requests

          from nfl.research.qb_rushing_components import (
              aggregate_components,
              classify_qb_rush,
          )
          from nfl.research.nflverse_history import player_stats_url

          SEASONS = (2023, 2024, 2025)
          PBP_URL = (
              "https://github.com/nflverse/nflverse-data/releases/download/"
              "pbp/play_by_play_{season}.csv.gz"
          )
          PBP_SHA256 = {
              2023: "4649804ee0f0a40b41e51ec75a1ce921949d7fab5459213488656b92f78560e8",
              2024: "23370d5d10f8104d80d46a1fc5e61f4f6f5a3263fe96fe2dd629913cfcb08c06",
              2025: "2f135887790a013fd004e609e37096bb4816d5cc80b9f19122e1bad478961978",
          }
          PLAYER_SHA256 = {
              2023: "f19cb71a5de0dce7fd09376026237c9ee9d5a93fe13815a2ea3ec2d37204cb17",
              2024: "3ddc45a84f759aa348ce465ae001752c530575455717657cdfe1f8abfcdb4759",
              2025: "e5e0615b3d96a3eaebfaee91e55afb4a4e7fe0caf057454177bcd7d6ad4bcfc2",
          }
          REQUIRED_PBP = {
              "season", "week", "season_type", "rusher_player_id",
              "rush_attempt", "qb_kneel", "qb_scramble",
              "two_point_attempt", "yards_gained",
          }
          REQUIRED_PLAYER = {
              "season", "week", "season_type", "player_id",
              "player_display_name", "position", "carries", "rushing_yards",
          }

          def f(value, name):
              if value in (None, ""):
                  raise ValueError(f"missing {name}")
              try:
                  out = float(value)
              except (TypeError, ValueError) as exc:
                  raise ValueError(f"invalid {name}: {value!r}") from exc
              if not math.isfinite(out):
                  raise ValueError(f"non-finite {name}: {value!r}")
              return out

          def b(value):
              if value in (None, "", 0, 0.0, "0", "0.0", False):
                  return False
              if value in (1, 1.0, "1", "1.0", True):
                  return True
              try:
                  return float(value) == 1.0
              except (TypeError, ValueError):
                  return False

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Full-Count NFL QB rushing reconciliation (read-only)"
          })

          player_rows = []
          sources = {"player": {}, "pbp": {}}
          qb_ids_by_season = defaultdict(set)
          qb_names = {}

          for season in SEASONS:
              url = player_stats_url(season)
              response = session.get(url, timeout=60)
              response.raise_for_status()
              digest = hashlib.sha256(response.content).hexdigest()
              if digest != PLAYER_SHA256[season]:
                  raise SystemExit(
                      f"{season}: player source SHA drift {digest}"
                  )
              rows = list(csv.DictReader(io.StringIO(response.text)))
              if not rows:
                  raise SystemExit(f"{season}: empty player source")
              missing = sorted(REQUIRED_PLAYER - set(rows[0]))
              if missing:
                  raise SystemExit(
                      f"{season}: missing player columns {missing}"
                  )
              player_rows.extend(rows)
              for row in rows:
                  if str(row.get("position") or "").strip().upper() == "QB":
                      pid = str(row.get("player_id") or "").strip()
                      if pid:
                          qb_ids_by_season[season].add(pid)
                          qb_names[pid] = str(
                              row.get("player_display_name") or pid
                          )
              sources["player"][str(season)] = {
                  "url": url,
                  "rows": len(rows),
                  "sha256": digest,
              }

          observations = defaultdict(list)
          flag_combinations = Counter()
          qb_rush_candidate_rows = 0
          qb_rush_classified_rows = 0
          qb_rush_unclassified_rows = 0
          schema = {}

          for season in SEASONS:
              url = PBP_URL.format(season=season)
              response = session.get(url, timeout=120)
              response.raise_for_status()
              digest = hashlib.sha256(response.content).hexdigest()
              if digest != PBP_SHA256[season]:
                  raise SystemExit(
                      f"{season}: PBP source SHA drift {digest}"
                  )

              with gzip.GzipFile(fileobj=io.BytesIO(response.content)) as gz:
                  text = io.TextIOWrapper(gz, encoding="utf-8", newline="")
                  reader = csv.DictReader(text)
                  if reader.fieldnames is None:
                      raise SystemExit(f"{season}: PBP header missing")
                  missing = sorted(REQUIRED_PBP - set(reader.fieldnames))
                  if missing:
                      raise SystemExit(
                          f"{season}: missing PBP columns {missing}"
                      )
                  schema[str(season)] = {
                      "column_count": len(reader.fieldnames),
                      "required_columns_present": sorted(REQUIRED_PBP),
                  }

                  rows_seen = 0
                  for row in reader:
                      rows_seen += 1
                      pid = str(row.get("rusher_player_id") or "").strip()
                      if not pid or pid not in qb_ids_by_season[season]:
                          continue

                      kneel = b(row.get("qb_kneel"))
                      scramble = b(row.get("qb_scramble"))
                      rush = b(row.get("rush_attempt"))
                      two = b(row.get("two_point_attempt"))
                      flag_combinations[
                          f"rush={int(rush)}|kneel={int(kneel)}|"
                          f"scramble={int(scramble)}|two={int(two)}"
                      ] += 1

                      # Any explicit QB rushing-process flag or rush_attempt
                      # makes this a row whose semantics matter to the audit.
                      if not (rush or kneel or scramble):
                          continue
                      qb_rush_candidate_rows += 1

                      obs = classify_qb_rush(row, is_qb=True)
                      if obs is None:
                          qb_rush_unclassified_rows += 1
                          continue
                      qb_rush_classified_rows += 1

                      try:
                          week = int(float(row["week"]))
                      except (TypeError, ValueError) as exc:
                          raise SystemExit(
                              f"{season}: invalid PBP week {row.get('week')!r}"
                          ) from exc
                      key = (
                          season,
                          week,
                          str(row.get("season_type") or ""),
                          pid,
                      )
                      observations[key].append(obs)

              sources["pbp"][str(season)] = {
                  "url": url,
                  "rows": rows_seen,
                  "bytes": len(response.content),
                  "sha256": digest,
              }

          reconstructed = {
              key: aggregate_components(rows)
              for key, rows in observations.items()
          }

          comparisons = []
          for row in player_rows:
              if str(row.get("position") or "").strip().upper() != "QB":
                  continue
              pid = str(row.get("player_id") or "").strip()
              if not pid:
                  continue
              season = int(float(row["season"]))
              week = int(float(row["week"]))
              season_type = str(row.get("season_type") or "")
              key = (season, week, season_type, pid)
              actual_carries = f(row["carries"], "carries")
              actual_yards = f(row["rushing_yards"], "rushing_yards")
              built = reconstructed.get(
                  key,
                  aggregate_components([]),
              )
              # Structural zero QB weeks add no information to reconciliation.
              if (
                  actual_carries == 0.0
                  and actual_yards == 0.0
                  and int(built["carries"]) == 0
                  and float(built["rushing_yards"]) == 0.0
              ):
                  continue

              carry_delta = float(built["carries"]) - actual_carries
              yard_delta = float(built["rushing_yards"]) - actual_yards
              comparisons.append({
                  "season": season,
                  "week": week,
                  "season_type": season_type,
                  "player_id": pid,
                  "player": qb_names.get(pid, pid),
                  "official_carries": actual_carries,
                  "pbp_carries": int(built["carries"]),
                  "carry_delta": carry_delta,
                  "official_rushing_yards": actual_yards,
                  "pbp_rushing_yards": float(built["rushing_yards"]),
                  "yard_delta": yard_delta,
                  "designed_rush_attempts":
                      int(built["designed_rush_attempts"]),
                  "scramble_attempts": int(built["scramble_attempts"]),
                  "kneel_attempts": int(built["kneel_attempts"]),
                  "designed_rush_yards":
                      float(built["designed_rush_yards"]),
                  "scramble_yards": float(built["scramble_yards"]),
                  "kneel_yards": float(built["kneel_yards"]),
                  "exact": (
                      abs(carry_delta) < 1e-12
                      and abs(yard_delta) < 1e-12
                  ),
              })

          if not comparisons:
              raise SystemExit("no QB rushing player-weeks were compared")

          exact = [row for row in comparisons if row["exact"]]
          mismatches = [row for row in comparisons if not row["exact"]]

          per_season = {}
          for season in SEASONS:
              subset = [r for r in comparisons if r["season"] == season]
              exact_subset = [r for r in subset if r["exact"]]
              per_season[str(season)] = {
                  "player_weeks": len(subset),
                  "exact_player_weeks": len(exact_subset),
                  "exact_rate": (
                      len(exact_subset) / len(subset) if subset else None
                  ),
                  "carry_mismatch_n": sum(
                      abs(r["carry_delta"]) >= 1e-12 for r in subset
                  ),
                  "yard_mismatch_n": sum(
                      abs(r["yard_delta"]) >= 1e-12 for r in subset
                  ),
                  "designed_rush_attempts": sum(
                      r["designed_rush_attempts"] for r in subset
                  ),
                  "scramble_attempts": sum(
                      r["scramble_attempts"] for r in subset
                  ),
                  "kneel_attempts": sum(
                      r["kneel_attempts"] for r in subset
                  ),
              }

          output = {
              "analysis": "NFL_QB_RUSHING_SOURCE_RECONCILIATION",
              "status": "research_only",
              "created_at": datetime.now(timezone.utc).isoformat(),
              "code_sha": os.environ["FULL_COUNT_CODE_SHA"],
              "source_contract": {
                  "seasons": list(SEASONS),
                  "pbp_digests_pinned": PBP_SHA256,
                  "player_digests_pinned": PLAYER_SHA256,
              },
              "sources": sources,
              "schema": schema,
              "classification": {
                  "qb_rush_candidate_rows": qb_rush_candidate_rows,
                  "qb_rush_classified_rows": qb_rush_classified_rows,
                  "qb_rush_unclassified_rows": qb_rush_unclassified_rows,
                  "flag_combinations": dict(sorted(flag_combinations.items())),
              },
              "reconciliation": {
                  "player_weeks": len(comparisons),
                  "exact_player_weeks": len(exact),
                  "exact_rate": len(exact) / len(comparisons),
                  "carry_mismatch_n": sum(
                      abs(r["carry_delta"]) >= 1e-12 for r in comparisons
                  ),
                  "yard_mismatch_n": sum(
                      abs(r["yard_delta"]) >= 1e-12 for r in comparisons
                  ),
                  "by_season": per_season,
                  "mismatches": mismatches[:200],
                  "mismatches_truncated": len(mismatches) > 200,
              },
              "decision_rule": (
                  "Do not build a component-aware challenger until this audit "
                  "explains any systematic reconciliation gap. Source semantics "
                  "must be understood before model semantics are changed."
              ),
          }

          path = "/tmp/nfl-qb-rushing-reconcile.json"
          with open(path, "w", encoding="utf-8") as f:
              json.dump(output, f, indent=2, sort_keys=True)
          print(json.dumps(output, indent=2, sort_keys=True))
          print(f"\nWrote {path}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: nfl-qb-rushing-source-reconciliation
          path: /tmp/nfl-qb-rushing-reconcile.json
          retention-days: 30
