name: Lineup Watch

# RETIRED AS A CORRECTNESS DEPENDENCY (2026-08-28 P0 follow-up).
#
# This workflow was the only thing that noticed a lineup change between
# two-hourly Dashboard Refresh windows, and its own header claimed the
# rebuild would start "within 10 minutes". That claim was never true on
# this repo. Measured over 29 consecutive runs on 2026-08-28:
#
#     declared cadence   */10 * * * *          (144 runs/day)
#     delivered          12.4 runs/day          9% of declared
#     median gap         51 minutes
#     worst observed gap 11.0 hours
#     intervals near 10 min   0 of 29
#
# On the day of the incident it did not run at all for the 9.6 hours
# covering that evening's lineup postings. GitHub's scheduled-workflow
# queue is best-effort and drops ticks under load; this is not a bug in
# the workflow and no amount of tuning inside it can fix it.
#
# Correctness now lives in RECONCILIATION (dashboard/reconcile.py), which
# runs inside dashboard-live.yml -- woken every 5 minutes by
# infra/live-heartbeat's Cloudflare cron, outside GitHub's scheduler. That
# path compares MLB's confirmed lineup against what we actually published
# and keeps requesting a rebuild until publication matches. It cannot be
# satisfied by a dispatch, only by the board actually being correct.
#
# This workflow is KEPT, not deleted, because it is still a useful cheap
# accelerator: when it does fire it can start a rebuild sooner than the
# next reconciliation tick. It is simply no longer load-bearing, and its
# cadence must never again be described as a guarantee. Nothing should be
# built on the assumption that it ran.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# This cheap observer writes only lineup_watch_state.json. A detected change is
# dispatched before it is durably acknowledged. Dispatch failure therefore
# leaves remote state unchanged for the next poll to retry; dispatch success
# followed by push failure may enqueue a harmless duplicate (at-least-once).
concurrency:
  group: lineup-watch
  cancel-in-progress: false

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Only requests -- see check_lineups.py's own docstring for why this
      # deliberately does not import mlb_daily (pandas/numpy/bs4) despite
      # hitting the same endpoint.
      - name: Install minimal deps
        run: pip install --quiet requests

      - name: Check for new or changed confirmed lineups
        id: check
        run: python3 dashboard/check_lineups.py

      - name: Trigger a queued full dashboard rebuild
        id: dispatch
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dashboard-refresh.yml --ref main

      - name: Acknowledge lineup state after accepted rebuild
        if: steps.check.outputs.changed == 'true' && steps.dispatch.outcome == 'success'
        run: |
          git config user.name "mlb-pipeline-bot"
          git config user.email "actions@github.com"
          git add dashboard/lineup_watch_state.json
          if git diff --cached --quiet; then
            echo "No state change to publish."
            exit 0
          fi
          git commit -m "Lineup watch: new or changed lineup(s) $(date -u +'%F %H:%M') UTC"
          # Same retry-with-rebase as every other bot commit in this repo
          # -- lineup_watch_state.json is the only file this job ever
          # writes, so a rebase always resolves cleanly.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) -- rebasing onto origin/main."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Rebase conflict -- aborting rather than leaving a broken tree."
              git rebase --abort
              exit 1
            fi
          done
          echo "::error::Failed to push lineup-watch state after 5 attempts."
          exit 1
