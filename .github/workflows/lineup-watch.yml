name: Lineup Watch

# Direct request: "How do we have the board update each time a new lineup
# comes out?" Dashboard Refresh (dashboard-refresh.yml) does the actual
# work but is deliberately capped at every 2 hours -- build_dashboard.py's
# own docstring says a live pass hits real FanGraphs/Statcast/FanDuel and
# is "not something to run every few minutes." Verified live 2026-08-15:
# that gap is real -- a lineup can post and sit unreflected on the board
# for up to 2 hours (worse if a scheduled tick is delayed/dropped, which
# GitHub Actions does under load and this project has already measured).
#
# Also catches the mirror-image case check_scratches.py's own docstring
# names directly: a player scratched AFTER his lineup already posted
# would otherwise sit on the live board looking fully live until the next
# fixed-window rebuild.
#
# This is the cheap half of the same split dashboard-prices.yml already
# uses for FanDuel odds: a fast, free MLB schedule call every 10 minutes
# (dashboard/check_lineups.py), and Dashboard Refresh only actually gets
# triggered when a game's lineup status genuinely changed since the last
# check -- newly posted OR an already-posted roster changing -- not on a
# fixed clock, so either event gets a rebuild started within 10 minutes
# instead of waiting for the next 2-hour window.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Distinct group from every other workflow's, same isolation reasoning as
# dashboard-refresh.yml and dashboard-prices.yml -- this must never wait
# on or block anything else, and vice versa.
concurrency:
  group: lineup-watch
  cancel-in-progress: true

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Only requests -- see check_lineups.py's own docstring for why this
      # deliberately does not import mlb_daily (pandas/numpy/bs4) despite
      # hitting the same endpoint.
      - name: Install minimal deps
        run: pip install --quiet requests

      - name: Check for new or changed confirmed lineups
        id: check
        run: python3 dashboard/check_lineups.py

      - name: Trigger a full dashboard rebuild
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dashboard-refresh.yml --ref main

      - name: Commit and push updated lineup-watch state
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "mlb-pipeline-bot"
          git config user.email "actions@github.com"
          git add dashboard/lineup_watch_state.json
          if git diff --cached --quiet; then
            echo "No state change to publish."
            exit 0
          fi
          git commit -m "Lineup watch: new or changed lineup(s) $(date -u +'%F %H:%M') UTC"
          # Same retry-with-rebase as every other bot commit in this repo
          # -- lineup_watch_state.json is the only file this job ever
          # writes, so a rebase always resolves cleanly.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) -- rebasing onto origin/main."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Rebase conflict -- aborting rather than leaving a broken tree."
              git rebase --abort
              exit 1
            fi
          done
          echo "::error::Failed to push lineup-watch state after 5 attempts."
          exit 1
